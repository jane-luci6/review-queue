<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI LinkedIn personal cover — E-mesh (sharp corners)</title>
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<style>
  :root { --mint:#68E3BE; --gold:#EDD086; --off-white:#F5F8FA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1584px; height:396px; overflow:hidden; background:#0A161C; }
  .bg { position:relative; width:1584px; height:396px; overflow:hidden;
    background:radial-gradient(60% 90% at 50% 50%, #0c1c24 0%, #0A161C 70%); }
  svg.mesh { position:absolute; inset:0; width:1584px; height:396px; pointer-events:none; }
  /* centered lockup */
  .lockup { position:absolute; left:50%; top:118px; transform:translateX(-50%);
    z-index:2; text-align:center; }
  .lockup .logo { height:62px; width:auto; margin:0 auto; }
  .rule { width:40px; height:3px; background:var(--mint); margin:18px auto 14px; }
  .tag { font-family:'Space Grotesk',system-ui,sans-serif; font-weight:600;
    font-size:18px; line-height:1.3; letter-spacing:0.02em; color:rgba(245,248,250,0.86); }
  .tag em { font-style:normal; font-weight:700; color:var(--gold); }
  /* center fade so the lockup reads clean */
  .fade { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(420px 200px at 50% 45%, rgba(10,22,28,0.62) 0%, rgba(10,22,28,0.20) 55%, rgba(10,22,28,0) 80%); }
</style>
</head>
<body>
  <div class="bg">
    <svg class="mesh" viewBox="0 0 1584 396" aria-hidden="true">
<g stroke="#68E3BE" stroke-width="1.6" fill="none" opacity="0.42" stroke-linejoin="miter" stroke-linecap="square">
  <path d="M 0 52 H 220 V 144 H 80 V 236 H 200 V 328 H 100"/>
  <path d="M 48 52 V 144 H 168 V 52"/>
  <path d="M 0 236 H 120 V 360"/>
  <path d="M 220 144 V 328 H 260"/>
  <path d="M 1584 52 H 1364 V 144 H 1504 V 236 H 1384 V 328 H 1484"/>
  <path d="M 1536 52 V 144 H 1416 V 52"/>
  <path d="M 1584 236 H 1464 V 360"/>
  <path d="M 1364 144 V 328 H 1324"/>
</g>
<g fill="none" stroke="#68E3BE" stroke-width="1.3" opacity="0.5"><circle cx="220" cy="144" r="10"/><circle cx="1364" cy="144" r="10"/></g>
<g fill="#68E3BE"><circle cx="220" cy="52" r="3"/><circle cx="80" cy="144" r="3"/><circle cx="220" cy="144" r="3"/><circle cx="168" cy="144" r="3"/><circle cx="200" cy="236" r="3"/><circle cx="120" cy="236" r="3"/><circle cx="100" cy="328" r="3"/><circle cx="1364" cy="52" r="3"/><circle cx="1504" cy="144" r="3"/><circle cx="1364" cy="144" r="3"/><circle cx="1416" cy="144" r="3"/><circle cx="1384" cy="236" r="3"/><circle cx="1484" cy="328" r="3"/><circle cx="1464" cy="236" r="3"/></g>
<g fill="#EDD086"><circle cx="200" cy="236" r="2.8"/><circle cx="1384" cy="236" r="2.8"/></g>
    </svg>
    <div class="fade" aria-hidden="true"></div>
    <div class="lockup">
      <img class="logo" src="../logos/luci-full-mintmark-white.png" alt="LUCI">
      <div class="rule" aria-hidden="true"></div>
      <p class="tag">The <em>Orchestration Engine</em> for Enterprise Multimedia</p>
    </div>
  </div>
</body>
</html>
