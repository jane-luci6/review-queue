<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI LinkedIn team banner — Orchestration seal</title>
<!--
  LinkedIn team banner (1584x396). Integrated seal: the hub IS the logo. The ring frames
  the mark on the left; the wordmark sits inside the ring; the tagline extends to the right
  on the ring's centerline; tissue grows outward FROM the ring, flowing right behind the
  tagline so the copy lives INSIDE the orchestration landscape, not next to it. One composition.
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<style>
  :root {
    --navy-deep: #0A161C; --mint: #68E3BE; --mint-rgb: 104,227,190;
    --gold: #EDD086; --off-white: #F5F8FA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1584px; height: 396px; overflow: hidden;
    background: var(--navy-deep); color: var(--off-white);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .banner { position: relative; width: 1584px; height: 396px; background: var(--navy-deep); overflow: hidden; }

  .lc-landscape { position: absolute; inset: 0; width: 1584px; height: 396px; pointer-events: none; }
  .stroke { fill: none; stroke: url(#wave); stroke-linecap: round; stroke-linejoin: round; }
  .node { fill: url(#wave); }
  .ring-stroke { fill: none; stroke: url(#wave); }
  .sat-ring { fill: none; stroke: url(#wave); stroke-width: 1.2; }

  /* The text block — sits to the RIGHT of the SVG ring, vertically centered on the
     hub's centerline (y=198). The mark lives inside the ring in the SVG; the HTML is
     wordmark + rule + tagline only, so mark and copy share one axis, not two stickers. */
  .lc-seal {
    position: absolute;
    left: 268px; top: 198px;
    transform: translateY(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .lc-wordmark {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: 0.14em;
    line-height: 1;
    color: var(--off-white);
    padding-left: 0.14em;
  }
  .lc-rule {
    width: 40px; height: 3px;
    background: var(--mint);
    margin: 16px 0 14px;
  }
  .lc-tagline {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600;
    font-size: 19px;
    line-height: 1.3;
    letter-spacing: 0.01em;
    color: rgba(245, 248, 250, 0.88);
    max-width: 460px;
  }
  .lc-tagline em { font-style: normal; font-weight: 700; color: var(--mint); }
  .lc-sub {
    margin-top: 10px;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 400;
    font-size: 13px;
    line-height: 1.5;
    color: rgba(245, 248, 250, 0.50);
    max-width: 440px;
  }

  /* soft lift behind the seal so the mark reads as the figure */
  .lc-halo {
    position: absolute; inset: 0;
    background: radial-gradient(300px 220px at 12% 50%, rgba(10,22,28,0.40) 0%, rgba(10,22,28,0.10) 55%, rgba(10,22,28,0) 80%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="banner">

    <!-- hub anchored at (148, 198) — the seal's mark center; tissue flows right across the banner -->
    <svg class="lc-landscape" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <radialGradient id="pwr" cx="148" cy="198" r="130" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#68E3BE" stop-opacity="0.14"/>
          <stop offset="45%" stop-color="#68E3BE" stop-opacity="0.03"/>
          <stop offset="100%" stop-color="#68E3BE" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="wave" gradientUnits="userSpaceOnUse"
          x1="-148" y1="-20" x2="1436" y2="20">
          <stop offset="0%" stop-color="#EDD086"/>
          <stop offset="14%" stop-color="#D4D494"/>
          <stop offset="30%" stop-color="#68E3BE"/>
          <stop offset="50%" stop-color="#68E3BE"/>
          <stop offset="78%" stop-color="#D4D494"/>
          <stop offset="100%" stop-color="#EDD086"/>
        </linearGradient>
      </defs>
      <circle cx="148" cy="198" r="130" fill="url(#pwr)"/>

      <g transform="translate(148 198)" fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-linejoin="round">
        <!-- inner hub ring — frames the mark -->
        <circle class="ring-stroke" r="82" stroke-width="1.8" opacity="0.42"/>
        <circle class="ring-stroke" r="92" stroke-width="1" opacity="0.16"/>

        <!-- orchestration ring + right spine (left spine would run off the near edge) -->
        <circle class="ring-stroke" r="138" stroke-width="1.2" opacity="0.20"/>
        <g class="stroke" stroke-width="1.6" opacity="0.38">
          <line x1="92" y1="0" x2="138" y2="0"/>
        </g>

        <!-- satellites (right-facing arc; left side is clipped by the banner edge) -->
        <g opacity="0.52">
          <circle class="sat-ring" cx="138" cy="0" r="11" opacity="0.40"/>
          <circle class="node" cx="138" cy="0" r="2.6"/>
          <circle class="sat-ring" cx="69" cy="119" r="11" opacity="0.40"/>
          <circle class="node" cx="69" cy="119" r="2.6"/>
          <circle class="sat-ring" cx="-69" cy="119" r="11" opacity="0.40"/>
          <circle class="node" cx="-69" cy="119" r="2.6"/>
          <circle class="sat-ring" cx="-138" cy="0" r="11" opacity="0.40"/>
          <circle class="node" cx="-138" cy="0" r="3.4"/>
          <circle class="sat-ring" cx="69" cy="-119" r="11" opacity="0.40"/>
          <circle class="node" cx="69" cy="-119" r="2.6"/>
          <circle class="sat-ring" cx="-69" cy="-119" r="11" opacity="0.40"/>
          <circle class="node" cx="-69" cy="-119" r="2.6"/>
        </g>

        <!-- corner sats → gateway → hub -->
        <g class="stroke" stroke-width="1.15" opacity="0.26">
          <path d="M 69 119 H 138 V 12"/>
          <path d="M -69 119 H -138 V 12"/>
          <path d="M -69 -119 H -138 V -12"/>
          <path d="M 69 -119 H 138 V -12"/>
        </g>

        <!-- LUCI mark as core -->
        <g transform="translate(-40 -33) scale(0.49)" opacity="1">
          <path fill="#68E3BE" d="M 78.779 120.749 L 65.111 127.473 L 4.308 97.587 C -1.336 94.813 -1.326 86.913 4.308 84.149 L 4.328 84.149 L 4.888 84.413 L 78.789 120.749 Z"/>
          <path fill="#68E3BE" d="M 139.462 69.171 L 134.197 71.739 L 125.775 75.876 L 87.151 56.88 L 70.556 65.045 L 56.869 58.321 L 82.435 45.765 C 85.402 44.304 88.899 44.304 91.866 45.765 L 139.472 69.171 Z"/>
          <path fill="#68E3BE" d="M 161.321 80.13 L 147.864 86.726 L 91.167 114.603 C 88.639 115.848 85.652 115.848 83.125 114.603 L 28.806 87.893 L 26.398 86.717 L 12.731 79.993 L 10.323 78.816 L 4.189 75.807 C -1.396 73.053 -1.396 65.231 4.189 62.487 L 4.328 62.418 L 26.408 73.269 L 40.095 79.993 L 87.151 103.125 L 134.197 79.993 L 147.654 73.396 L 152.17 75.611 L 161.331 80.12 Z"/>
          <path fill="#68E3BE" d="M 100.818 28.445 L 87.141 35.179 L 48.457 54.175 L 36.588 48.352 L 34.78 47.47 L 87.141 21.721 L 100.818 28.445 Z"/>
          <path fill="#68E3BE" d="M 64.572 70.328 L 62.164 69.152 L 48.497 62.428 L 46.089 61.252 L 40.095 58.301 L 26.408 51.577 L 24.02 50.421 L 18.026 47.47 L 18.006 47.451 L 34.47 39.344 L 42.922 35.208 L 56.42 28.562 L 87.161 13.468 L 87.181 13.487 L 100.868 6.763 L 87.141 0 L 20.793 32.601 L 4.288 40.727 C -1.336 43.491 -1.336 51.371 4.288 54.135 L 4.328 54.155 L 10.323 57.105 L 12.731 58.282 L 26.398 65.006 L 28.805 66.182 L 32.412 67.956 L 34.82 69.132 L 48.487 75.856 L 50.895 77.032 L 87.131 94.852 L 100.798 88.128 L 64.562 70.308 Z"/>
          <path fill="#68E3BE" d="M 154.038 98.077 L 161.501 101.743 L 92.216 135.824 C 89.029 137.392 85.283 137.392 82.096 135.824 L 73.484 131.589 L 147.874 95.048 L 151.66 96.901 L 154.048 98.077 Z"/>
        </g>

        <!-- Tissue flows RIGHT from the hub, behind the tagline — copy lives inside the landscape -->
        <g class="stroke" stroke-width="1.7" opacity="0.30">
          <path d="M 149 0 H 1300"/>
          <path d="M 230 0 V -38 H 1300"/>
          <path d="M 230 0 V 46 H 1300"/>
        </g>
        <g class="stroke" stroke-width="1.2" opacity="0.17">
          <path d="M 200 0 V -50 H 520 V -82 H 1300"/>
          <path d="M 200 0 V 64 H 540 V 108 H 1300"/>
          <path d="M 420 -50 H 660 V -38"/>
          <path d="M 440 64 H 700 V 46"/>
        </g>
        <g class="stroke" stroke-width="0.9" opacity="0.08">
          <path d="M 520 -38 V -10 H 1300"/>
          <path d="M 540 46 V 78 H 1300"/>
        </g>

        <!-- tissue nodes -->
        <circle class="node" cx="230" cy="0" r="2.6" opacity="0.30"/>
        <circle class="node" cx="430" cy="-38" r="2.2" opacity="0.26"/>
        <circle class="node" cx="540" cy="46" r="2.2" opacity="0.26"/>
        <circle class="node" cx="660" cy="-82" r="2" opacity="0.22"/>
        <circle class="node" cx="700" cy="108" r="2" opacity="0.20"/>
      </g>
    </svg>

    <div class="lc-halo" aria-hidden="true"></div>

    <div class="lc-seal">
      <div class="lc-wordmark">LUCI</div>
      <div class="lc-rule" aria-hidden="true"></div>
      <p class="lc-tagline">The <em>Orchestration Engine</em> for Enterprise Multimedia</p>
      <p class="lc-sub">One interface to control, automate, and execute the entire guest experience.</p>
    </div>
  </div>
</body>
</html>
