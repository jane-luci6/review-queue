<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI — LinkedIn team banner (personal profile)</title>
<!--
  LinkedIn personal-profile banner for the LUCI team. 1584x396 (@1x) / 3168x792 (@2x).
  v3: swaps the circuit texture for the orchestration landscape motif (the locked
  standard). Hub anchors the right third; connective tissue flows left across the
  banner behind the lockup. Mint-gold wave gradient throughout. Lockup stays
  left-justified and seated upper so it clears the profile photo/name (bottom-left).
  "Orchestration Engine" accented in gold, matching the live site + company cover.
  Render via scripts/render-internal-team-assets.sh (or headless Chrome directly).
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<style>
  :root {
    --navy-deep: #0A161C;
    --mint: #68E3BE;
    --mint-rgb: 104, 227, 190;
    --gold: #EDD086;
    --off-white: #F5F8FA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1584px; height: 396px; overflow: hidden;
    background: var(--navy-deep);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .cover {
    position: relative; width: 1584px; height: 396px;
    background: var(--navy-deep); overflow: hidden;
  }
  .cover__motif { position: absolute; inset: 0; width: 1584px; height: 396px; pointer-events: none; }
  .cover__glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(420px 220px at 76% 50%, rgba(var(--mint-rgb), 0.12), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,0.018), transparent 40%);
    pointer-events: none;
  }
  /* left wash so the lockup stays readable over the tissue */
  .cover__wash {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(10,22,28,0.62) 0%, rgba(10,22,28,0.30) 26%, rgba(10,22,28,0) 52%);
    pointer-events: none;
  }
  .cover__vignette {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 180px 30px rgba(0,0,0,0.42);
    pointer-events: none;
  }
  .cover__lockup {
    position: absolute; left: 96px; top: 74px; z-index: 2;
    display: flex; align-items: center;
  }
  .cover__logo { height: 104px; width: auto; flex: 0 0 auto; display: block; }
  .cover__rule {
    flex: 0 0 auto; width: 1px; height: 116px; margin: 0 44px;
    background: rgba(245, 248, 250, 0.16);
  }
  .cover__text { max-width: 560px; }
  .cover__tagline {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600; font-size: 36px; line-height: 1.16;
    letter-spacing: -0.01em; color: rgba(245, 248, 250, 0.88);
    text-align: left;
  }
  .cover__tagline em { font-style: normal; font-weight: 700; color: var(--gold); }
  .cover__sub {
    margin-top: 14px;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 400; font-size: 18px; line-height: 1.45;
    color: rgba(245, 248, 250, 0.66); text-align: left; max-width: 540px;
  }
</style>
</head>
<body>
  <div class="cover">
    <svg class="cover__motif" viewBox="0 0 1584 396" aria-hidden="true">
      <defs>
        <radialGradient id="pwr" cx="1200" cy="198" r="140" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#68E3BE" stop-opacity="0.16"/>
          <stop offset="50%" stop-color="#68E3BE" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="#68E3BE" stop-opacity="0"/>
        </radialGradient>
        <!-- Mint-gold wave in hub-local coords (hub at 0): mint at hub, gold at both edges -->
        <linearGradient id="wave" gradientUnits="userSpaceOnUse"
          x1="-1200" y1="-40" x2="384" y2="40">
          <stop offset="0%" stop-color="#EDD086"/>
          <stop offset="14%" stop-color="#D4D494"/>
          <stop offset="32%" stop-color="#68E3BE"/>
          <stop offset="68%" stop-color="#68E3BE"/>
          <stop offset="86%" stop-color="#D4D494"/>
          <stop offset="100%" stop-color="#EDD086"/>
        </linearGradient>
      </defs>
      <circle cx="1200" cy="198" r="140" fill="url(#pwr)"/>

      <g transform="translate(1200 198)" fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-linejoin="round">
        <!-- hub rings -->
        <circle r="64" stroke-width="2" opacity="0.46"/>
        <circle r="74" stroke-width="1" opacity="0.16"/>
        <circle r="140" stroke-width="1.2" opacity="0.24"/>

        <!-- spines: hub → L/R gateways -->
        <g stroke-width="1.7" opacity="0.50">
          <line x1="64" y1="0" x2="140" y2="0"/>
          <line x1="-64" y1="0" x2="-140" y2="0"/>
        </g>

        <!-- satellites on the ring (corner sats at ±99,±99; L/R gateways at ±140,0) -->
        <g opacity="0.66">
          <circle cx="140" cy="0" r="13" stroke-width="1.3" opacity="0.55"/>
          <circle cx="140" cy="0" r="3" fill="url(#wave)" stroke="none"/>
          <circle cx="-140" cy="0" r="13" stroke-width="1.3" opacity="0.55"/>
          <circle cx="-140" cy="0" r="4" fill="url(#wave)" stroke="none"/>
          <circle cx="99" cy="99" r="13" stroke-width="1.3" opacity="0.55"/>
          <circle cx="99" cy="99" r="3" fill="url(#wave)" stroke="none"/>
          <circle cx="-99" cy="99" r="13" stroke-width="1.3" opacity="0.55"/>
          <circle cx="-99" cy="99" r="3" fill="url(#wave)" stroke="none"/>
          <circle cx="-99" cy="-99" r="13" stroke-width="1.3" opacity="0.55"/>
          <circle cx="-99" cy="-99" r="3" fill="url(#wave)" stroke="none"/>
          <circle cx="99" cy="-99" r="13" stroke-width="1.3" opacity="0.55"/>
          <circle cx="99" cy="-99" r="3" fill="url(#wave)" stroke="none"/>
        </g>

        <!-- corner sats → L/R gateway → hub (orthogonal) -->
        <g stroke-width="1.2" opacity="0.38">
          <path d="M 99 99 H 140 V 13"/>
          <path d="M -99 99 H -140 V 13"/>
          <path d="M -99 -99 H -140 V -13"/>
          <path d="M 99 -99 H 140 V -13"/>
        </g>

        <!-- RIGHT tissue — short run to the banner edge (x=384 local) -->
        <g stroke-width="1.7" opacity="0.46">
          <path d="M 153 0 H 384"/>
          <path d="M 230 0 V -36 H 384"/>
          <path d="M 230 0 V 48 H 384"/>
        </g>
        <g stroke-width="1.2" opacity="0.28">
          <path d="M 210 0 V -52 H 300 V -86 H 384"/>
          <path d="M 210 0 V 64 H 320 V 110 H 384"/>
          <path d="M 240 -52 H 320 V -36"/>
          <path d="M 260 64 H 340 V 48"/>
        </g>
        <g stroke-width="0.9" opacity="0.14">
          <path d="M 153 0 V 22 H 384"/>
          <path d="M 153 0 V -22 H 384"/>
          <path d="M 153 0 V -36 H 230"/>
          <path d="M 153 0 V 36 H 230"/>
          <path d="M 300 -52 V 64"/>
          <path d="M 320 -52 V -20 H 384"/>
          <path d="M 320 64 V 96 H 384"/>
          <path d="M 300 -86 H 384"/>
          <path d="M 320 110 H 384"/>
        </g>
        <circle cx="230" cy="0" r="3" fill="url(#wave)" stroke="none" opacity="0.48"/>
        <circle cx="300" cy="-52" r="2.5" fill="url(#wave)" stroke="none" opacity="0.40"/>
        <circle cx="320" cy="64" r="2.5" fill="url(#wave)" stroke="none" opacity="0.40"/>
        <circle cx="340" cy="-86" r="2" fill="url(#wave)" stroke="none" opacity="0.32"/>
        <circle cx="340" cy="110" r="2" fill="url(#wave)" stroke="none" opacity="0.30"/>

        <!-- LEFT tissue — long run across the banner behind the lockup (x=-1200 local → banner x=0) -->
        <g stroke-width="1.7" opacity="0.46">
          <path d="M -153 0 H -1200"/>
          <path d="M -250 0 V -42 H -1200"/>
          <path d="M -250 0 V 56 H -1200"/>
        </g>
        <g stroke-width="1.2" opacity="0.26">
          <path d="M -230 0 V -64 H -460 V -104 H -1200"/>
          <path d="M -230 0 V 78 H -520 V 132 H -1200"/>
          <path d="M -380 -64 H -640 V -48"/>
          <path d="M -420 78 H -720 V 56"/>
        </g>
        <g stroke-width="0.9" opacity="0.13">
          <path d="M -153 0 V 24 H -1200"/>
          <path d="M -153 0 V -24 H -1200"/>
          <path d="M -153 0 V -42 H -250"/>
          <path d="M -153 0 V 42 H -250"/>
          <path d="M -460 -64 V 78"/>
          <path d="M -640 -64 V -32 H -1200"/>
          <path d="M -520 78 V 108 H -1200"/>
          <path d="M -460 -104 H -1200"/>
          <path d="M -520 132 H -1200"/>
        </g>
        <circle cx="-250" cy="0" r="3" fill="url(#wave)" stroke="none" opacity="0.48"/>
        <circle cx="-460" cy="-64" r="2.5" fill="url(#wave)" stroke="none" opacity="0.38"/>
        <circle cx="-520" cy="78" r="2.5" fill="url(#wave)" stroke="none" opacity="0.38"/>
        <circle cx="-640" cy="-104" r="2" fill="url(#wave)" stroke="none" opacity="0.30"/>
        <circle cx="-720" cy="132" r="2" fill="url(#wave)" stroke="none" opacity="0.28"/>
      </g>
    </svg>

    <div class="cover__glow" aria-hidden="true"></div>
    <div class="cover__wash" aria-hidden="true"></div>

    <div class="cover__lockup">
      <img class="cover__logo" src="../logos/luci-full-mintmark-white.png" alt="LUCI">
      <div class="cover__rule" aria-hidden="true"></div>
      <div class="cover__text">
        <p class="cover__tagline">The <em>Orchestration Engine</em><br>for Enterprise Multimedia</p>
        <p class="cover__sub">One interface to control, automate, and execute the entire guest experience.</p>
      </div>
    </div>

    <div class="cover__vignette" aria-hidden="true"></div>
  </div>
</body>
</html>
