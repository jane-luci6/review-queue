<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI — LinkedIn team banner (personal profile)</title>
<!--
  LinkedIn personal-profile banner for the LUCI team. 1584x396 (@1x) / 3168x792 (@2x).
  v2 per Mike's direction:
    - pattern switched to the RIGHT side (was left-emphasized).
    - lockup left-justified (was right-anchored): logo on the LEFT, taglines to its RIGHT,
      tagline text left-aligned.
    - sub-tagline bumped to a readable size (was 14px -> 18px); tagline 34px -> 36px.
    - seated in the upper area so it clears the profile photo/name (bottom-left).
  "Orchestration Engine" accented in gold, matching the live site + company cover.
  Render via scripts/render-internal-team-assets.sh.
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<style>
  :root {
    --navy-deep: #0A161C;
    --mint: #68E3BE;
    --mint-rgb: 104, 227, 190;
    --gold: #EDD086;
    --off-white: #F5F8FA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1584px; height: 396px; overflow: hidden;
    background: var(--navy-deep);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .cover {
    position: relative; width: 1584px; height: 396px;
    background: var(--navy-deep); overflow: hidden;
  }
  /* circuit texture — switched to the RIGHT side: transparent on the left, visible on the right */
  .cover__pattern {
    position: absolute; inset: 0;
    background-image: url("../textures/texture-circuit-header-mintgold.png");
    background-repeat: repeat; background-size: 540px auto;
    opacity: 0.5; mix-blend-mode: screen; pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 50% 78% at 22% 50%, transparent 0%, transparent 42%, #000 92%);
            mask-image: radial-gradient(ellipse 50% 78% at 22% 50%, transparent 0%, transparent 42%, #000 92%);
  }
  .cover__glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(820px 340px at 78% 50%, rgba(var(--mint-rgb), 0.10), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,0.018), transparent 40%);
    pointer-events: none;
  }
  .cover__vignette {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 220px 40px rgba(0,0,0,0.45);
    pointer-events: none;
  }
  /* lockup — left-justified, anchored left, seated in the upper area to clear the profile photo/name */
  .cover__lockup {
    position: absolute; left: 96px; top: 74px; z-index: 2;
    display: flex; align-items: center;
  }
  .cover__logo { height: 104px; width: auto; flex: 0 0 auto; display: block; }
  .cover__rule {
    flex: 0 0 auto; width: 1px; height: 116px; margin: 0 44px;
    background: rgba(245, 248, 250, 0.16);
  }
  .cover__text { max-width: 560px; }
  .cover__tagline {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600; font-size: 36px; line-height: 1.16;
    letter-spacing: -0.01em; color: rgba(245, 248, 250, 0.88);
    text-align: left;
  }
  .cover__tagline em { font-style: normal; font-weight: 700; color: var(--gold); }
  .cover__sub {
    margin-top: 14px;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 400; font-size: 18px; line-height: 1.45;
    color: rgba(245, 248, 250, 0.66); text-align: left; max-width: 540px;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="cover__pattern"></div>
    <div class="cover__glow"></div>
    <div class="cover__lockup">
      <img class="cover__logo" src="../logos/luci-full-mintmark-white.png" alt="LUCI">
      <div class="cover__rule" aria-hidden="true"></div>
      <div class="cover__text">
        <p class="cover__tagline">The <em>Orchestration Engine</em><br>for Enterprise Multimedia</p>
        <p class="cover__sub">One interface to control, automate, and execute the entire guest experience.</p>
      </div>
    </div>
    <div class="cover__vignette"></div>
  </div>
</body>
</html>
