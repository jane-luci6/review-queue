<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="Control, automate, and execute the guest experience from one LUCI interface">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .kick { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:10px; letter-spacing:.18em; fill:#2b9e80; }
      .title { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; fill:#1c2b33; }
      .body { font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:11px; fill:#56707c; }
      .card-label { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:10px; fill:#f5f8fa; }
      .card-meta { font-family:'Inter',sans-serif; font-weight:500; font-size:9px; fill:rgba(245,248,250,.65); }
      .outcome { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:11px; fill:#2b9e80; }
      .chip { font-family:'Inter',sans-serif; font-weight:500; font-size:9px; fill:#354f5c; }
      .foot { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:10px; letter-spacing:.14em; fill:#56707c; }
    </style>
    <linearGradient id="photoFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10232d" stop-opacity="0"/>
      <stop offset="1" stop-color="#10232d" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="920" height="420" fill="#F5F8FA"/>

  <!-- panel dividers -->
  <line x1="307" y1="48" x2="307" y2="372" stroke="#dbe1e4" stroke-width="1"/>
  <line x1="613" y1="48" x2="613" y2="372" stroke="#dbe1e4" stroke-width="1"/>

  <!-- CONTROL -->
  <g transform="translate(24,48)">
    <text class="kick" x="0" y="0">CONTROL</text>
    <text class="title" x="0" y="24">Set the scene</text>
    <text class="body" x="0" y="44">Operator adjusts mood before the moment hits.</text>

    <g transform="translate(0,64)">
      <rect width="260" height="88" rx="0" fill="#10232d"/>
      <circle cx="12" cy="14" r="4" fill="#68e3be"/>
      <text class="card-label" x="24" y="18">House Lights</text>
      <text class="card-meta" x="24" y="32">Showtime preset</text>
      <rect x="16" y="48" width="228" height="6" fill="rgba(255,255,255,.12)"/>
      <rect x="16" y="48" width="46" height="6" fill="#68e3be"/>
      <circle cx="62" cy="51" r="7" fill="#f5f8fa"/>
      <text class="card-meta" x="16" y="78">90%</text>
      <text class="card-meta" x="228" y="78" text-anchor="end">20%</text>
    </g>

    <text class="outcome" x="0" y="178">Lights, screens, and audio ready for guests.</text>
  </g>

  <!-- AUTOMATE -->
  <g transform="translate(331,48)">
    <text class="kick" x="0" y="0">AUTOMATE</text>
    <text class="title" x="0" y="24">The floor reacts</text>
    <text class="body" x="0" y="44">Events trigger orchestrated updates instantly.</text>

    <g transform="translate(0,64)">
      <rect width="260" height="88" rx="0" fill="#10232d"/>
      <rect x="0" y="0" width="3" height="88" fill="#68e3be"/>
      <text class="card-meta" x="16" y="18">Automated &#183; Jackpot</text>
      <text class="card-label" x="16" y="36">$50,000 win</text>
      <text class="card-meta" x="16" y="52">LUCI fires the whole floor</text>
      <!-- cascade targets -->
      <g transform="translate(16,62)">
        <rect width="68" height="18" fill="rgba(104,227,190,.12)"/>
        <text class="card-meta" x="4" y="12">LED Wall</text>
        <rect x="76" width="68" height="18" fill="rgba(104,227,190,.12)"/>
        <text class="card-meta" x="80" y="12">Lights</text>
        <rect x="152" width="76" height="18" fill="rgba(104,227,190,.12)"/>
        <text class="card-meta" x="156" y="12">Slot audio</text>
      </g>
    </g>

    <text class="outcome" x="0" y="178">One trigger updates the whole experience.</text>
  </g>

  <!-- EXECUTE -->
  <g transform="translate(637,48)">
    <text class="kick" x="0" y="0">EXECUTE</text>
    <text class="title" x="0" y="24">Guests feel it</text>
    <text class="body" x="0" y="44">The ideal experience &#8212; seamless, energetic, memorable.</text>

    <!-- guest atmosphere vignette -->
    <g transform="translate(0,64)">
      <rect width="260" height="88" fill="#e8edf1"/>
      <!-- screens -->
      <rect x="16" y="14" width="72" height="40" fill="#15323b"/>
      <rect x="96" y="14" width="72" height="40" fill="#15323b"/>
      <rect x="176" y="14" width="68" height="40" fill="#15323b"/>
      <rect x="22" y="20" width="60" height="28" fill="#20404f"/>
      <rect x="102" y="20" width="60" height="28" fill="#20404f"/>
      <rect x="182" y="20" width="56" height="28" fill="#20404f"/>
      <!-- guest silhouettes -->
      <ellipse cx="52" cy="72" rx="10" ry="8" fill="#354f5c" opacity=".85"/>
      <ellipse cx="88" cy="74" rx="9" ry="7" fill="#354f5c" opacity=".75"/>
      <ellipse cx="132" cy="72" rx="10" ry="8" fill="#354f5c" opacity=".85"/>
      <ellipse cx="168" cy="74" rx="9" ry="7" fill="#354f5c" opacity=".75"/>
      <ellipse cx="208" cy="72" rx="10" ry="8" fill="#354f5c" opacity=".85"/>
      <!-- mint accent glow -->
      <rect x="0" y="84" width="260" height="4" fill="#68e3be" opacity=".45"/>
    </g>

    <!-- outcome chips -->
    <g transform="translate(0,168)">
      <rect x="0" y="0" width="118" height="22" fill="#fff" stroke="#dbe1e4"/>
      <text class="chip" x="8" y="14">Every screen live</text>
      <rect x="126" y="0" width="134" height="22" fill="#fff" stroke="#dbe1e4"/>
      <text class="chip" x="134" y="14">Energy when it counts</text>
      <rect x="0" y="30" width="260" height="22" fill="#fff" stroke="#dbe1e4"/>
      <text class="chip" x="8" y="44">Atmosphere guests remember</text>
    </g>
  </g>

  <!-- flow arrows between panels -->
  <g fill="none" stroke="#2b9e80" stroke-width="1.4" opacity=".7">
    <path d="M292 132 L312 132"/>
    <path d="M598 132 L618 132"/>
    <polygon points="312,132 306,129 306,135" fill="#2b9e80" stroke="none"/>
    <polygon points="618,132 612,129 612,135" fill="#2b9e80" stroke="none"/>
  </g>

  <text class="foot" x="460" y="404" text-anchor="middle">THE GUEST EXPERIENCE &#183; ONE INTERFACE</text>
</svg>
