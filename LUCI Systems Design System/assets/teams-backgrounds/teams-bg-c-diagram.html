<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI Teams background — C · System orbit</title>
<!--
  Teams/Zoom virtual background — Variant C "System orbit".
  Abstract orbit rings + nodes centered behind the subject (the person appears inside the
  orbit), with mint/gold circuit texture at the edges and thin radial scan lines. The
  dead-center is kept cleanest for the subject. Logo + tagline lockup bottom-right.
  Logo + tagline only (no sub-tagline). Render to PNG at 1920x1080.
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_teams-base.css">
<style>
  .lc-orbit {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1080px;
    height: 1080px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .lc-orbit .ring { fill: none; stroke: var(--mint); stroke-width: 1.4; }
  .lc-orbit .node { fill: var(--mint); }
  .lc-orbit .node-gold { fill: var(--gold); }

  .lc-scan {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1080px;
    height: 1080px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .lc-scan line { stroke: var(--mint); stroke-width: 1; }

  .lc-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(104,227,190,0.08), rgba(104,227,190,0) 58%);
    pointer-events: none;
  }

  .lc-lockup {
    right: 96px;
    bottom: 88px;
    text-align: right;
  }
  .lc-lockup .lc-rule { margin-left: auto; }
  .lc-vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 240px 50px rgba(0,0,0,0.5);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="lc-circuit" aria-hidden="true"></div>
    <div class="lc-glow" aria-hidden="true"></div>

    <svg class="lc-scan" viewBox="0 0 1080 1080" aria-hidden="true">
      <g opacity="0.14">
        <line x1="540" y1="540" x2="540" y2="0"/>
        <line x1="540" y1="540" x2="1072" y2="540"/>
        <line x1="540" y1="540" x2="540" y2="1072"/>
        <line x1="540" y1="540" x2="8"   y2="540"/>
        <line x1="540" y1="540" x2="960" y2="120"/>
        <line x1="540" y1="540" x2="960" y2="960"/>
        <line x1="540" y1="540" x2="120" y2="960"/>
        <line x1="540" y1="540" x2="120" y2="120"/>
      </g>
    </svg>

    <svg class="lc-orbit" viewBox="0 0 1080 1080" aria-hidden="true">
      <circle class="ring" cx="540" cy="540" r="532" opacity="0.08"/>
      <circle class="ring" cx="540" cy="540" r="420" opacity="0.13"/>
      <circle class="ring" cx="540" cy="540" r="296" opacity="0.18"/>
      <circle class="ring" cx="540" cy="540" r="158" opacity="0.22"/>
      <circle class="node"       cx="540" cy="8"    r="6" opacity="0.45"/>
      <circle class="node"       cx="1072" cy="540" r="6" opacity="0.45"/>
      <circle class="node-gold"  cx="540" cy="1072" r="7" opacity="0.6"/>
      <circle class="node"       cx="8"    cy="540" r="6" opacity="0.45"/>
      <circle class="node"       cx="540" cy="120"  r="5" opacity="0.4"/>
      <circle class="node"       cx="960" cy="540"  r="5" opacity="0.4"/>
      <circle class="node"       cx="540" cy="960"  r="5" opacity="0.4"/>
      <circle class="node"       cx="120" cy="540"  r="5" opacity="0.4"/>
    </svg>

    <div class="lc-vignette" aria-hidden="true"></div>

    <div class="lc-lockup">
      <img class="lc-logo" src="../logos/luci-full-mintmark-white.png" alt="LUCI">
      <div class="lc-rule" aria-hidden="true"></div>
      <p class="lc-tagline">The <em>Orchestration Engine</em><br>for Enterprise Multimedia</p>
    </div>
  </div>
</body>
</html>
