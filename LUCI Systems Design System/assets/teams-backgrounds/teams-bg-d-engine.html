<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI Teams background — Orchestration landscape</title>
<!--
  Teams/Zoom virtual background — orchestration landscape C (refined).
  Hub centered behind the subject; horizontals run off left/right edges; layered tissue
  for complexity. Center kept readable for camera. Logo + tagline bottom-right.
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_teams-base.css">
<style>
  .stroke { fill: none; stroke: #68E3BE; stroke-linecap: round; stroke-linejoin: round; }
  .node { fill: #68E3BE; }
  .node-gold { fill: #EDD086; }
  .ring-stroke { fill: none; stroke: #68E3BE; }
  .sat-ring { fill: none; stroke: #68E3BE; stroke-width: 1.3; }
  .lc-landscape { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .lc-lockup { right: 96px; bottom: 88px; text-align: right; }
  .lc-lockup .lc-rule { margin-left: auto; }
  .lc-vignette {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 240px 50px rgba(0,0,0,0.45);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="lc-circuit" aria-hidden="true"></div>

    <svg class="lc-landscape" viewBox="0 0 1920 1080" aria-hidden="true">
      <defs>
        <radialGradient id="pwr" cx="960" cy="500" r="220" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#68E3BE" stop-opacity="0.12"/>
          <stop offset="50%" stop-color="#68E3BE" stop-opacity="0.03"/>
          <stop offset="100%" stop-color="#68E3BE" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="960" cy="500" r="220" fill="url(#pwr)"/>

      <g transform="translate(960 500)">
        <circle class="ring-stroke" r="78" stroke-width="2" opacity="0.32"/>
        <circle class="ring-stroke" r="200" stroke-width="1.2" opacity="0.18"/>

        <!-- quieter rays (subject sits here) -->
        <g class="stroke" stroke-width="1" opacity="0.08">
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(20)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(40)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(70)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(110)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(140)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(160)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(200)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(220)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(250)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(290)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(320)"/>
          <line x1="78" y1="0" x2="960" y2="0" transform="rotate(340)"/>
        </g>

        <g class="stroke" stroke-width="1.7" opacity="0.32">
          <line x1="78" y1="0" x2="200" y2="0"/>
          <line x1="78" y1="0" x2="200" y2="0" transform="rotate(60)"/>
          <line x1="78" y1="0" x2="200" y2="0" transform="rotate(120)"/>
          <line x1="78" y1="0" x2="200" y2="0" transform="rotate(180)"/>
          <line x1="78" y1="0" x2="200" y2="0" transform="rotate(240)"/>
          <line x1="78" y1="0" x2="200" y2="0" transform="rotate(300)"/>
        </g>

        <g opacity="0.55">
          <circle class="sat-ring" cx="200" cy="0" r="14" opacity="0.50"/>
          <circle class="node" cx="200" cy="0" r="3"/>
          <circle class="sat-ring" cx="100" cy="173" r="14" opacity="0.50"/>
          <circle class="node" cx="100" cy="173" r="3"/>
          <circle class="sat-ring" cx="-100" cy="173" r="14" opacity="0.50"/>
          <circle class="node" cx="-100" cy="173" r="3"/>
          <circle class="sat-ring" cx="-200" cy="0" r="14" opacity="0.50" style="stroke:#EDD086"/>
          <circle class="node-gold" cx="-200" cy="0" r="4"/>
          <circle class="sat-ring" cx="-100" cy="-173" r="14" opacity="0.50"/>
          <circle class="node" cx="-100" cy="-173" r="3"/>
          <circle class="sat-ring" cx="100" cy="-173" r="14" opacity="0.50"/>
          <circle class="node" cx="100" cy="-173" r="3"/>
        </g>

        <!-- faint under-web off edges -->
        <g class="stroke" stroke-width="1" opacity="0.08">
          <path d="M 214 0 H 960"/>
          <path d="M 214 22 H 960"/>
          <path d="M 214 -22 H 960"/>
          <path d="M 214 -44 H 500 V -90 H 960"/>
          <path d="M 214 44 H 480 V 110 H 960"/>
          <path d="M -214 0 H -960"/>
          <path d="M -214 22 H -960"/>
          <path d="M -214 -22 H -960"/>
          <path d="M -214 -44 H -500 V -120 H -960"/>
          <path d="M -214 44 H -470 V 130 H -960"/>
        </g>

        <!-- mid tissue off edges -->
        <g class="stroke" stroke-width="1.3" opacity="0.22">
          <path d="M 214 0 H 960"/>
          <path d="M 300 0 V -60 H 560 V -100 H 960"/>
          <path d="M 300 0 V 80 H 580 V 140 H 960"/>
          <path d="M -214 0 H -960"/>
          <path d="M -300 0 V 60 H -560 V 120 H -960"/>
          <path d="M -300 0 V -90 H -580 V -150 H -960"/>
        </g>

        <!-- stronger trunks off edges -->
        <g class="stroke" stroke-width="1.8" opacity="0.34">
          <path d="M 214 0 H 960"/>
          <path d="M 340 0 V -48 H 960"/>
          <path d="M 340 0 V 60 H 960"/>
          <path d="M -214 0 H -960"/>
          <path d="M -340 0 V 42 H -960"/>
          <path d="M -340 0 V -70 H -960"/>
          <path d="M 115 185 L 220 270 H 480 V 360 H 960"/>
          <path d="M -115 -185 L -220 -270 H -500 V -360 H -960"/>
        </g>

        <!-- fine edge forks -->
        <g class="stroke" stroke-width="1" opacity="0.14">
          <path d="M 560 -48 V -12 H 960"/>
          <path d="M 580 60 V 100 H 960"/>
          <path d="M -560 42 V 12 H -960"/>
          <path d="M -580 -70 V -110 H -960"/>
          <path d="M 320 270 H 560 V 310 H 960"/>
          <path d="M -320 -270 H -560 V -310 H -960"/>
        </g>

        <circle class="node" cx="340" cy="0" r="3" opacity="0.40"/>
        <circle class="node" cx="560" cy="-48" r="2.5" opacity="0.30"/>
        <circle class="node" cx="580" cy="60" r="2.5" opacity="0.30"/>
        <circle class="node" cx="-340" cy="0" r="3" opacity="0.40"/>
        <circle class="node-gold" cx="-580" cy="-70" r="3.5" opacity="0.45"/>
        <circle class="node" cx="-560" cy="42" r="2.5" opacity="0.30"/>
        <circle class="node" cx="220" cy="270" r="2.5" opacity="0.28"/>
        <circle class="node" cx="-220" cy="-270" r="2.5" opacity="0.28"/>
      </g>
    </svg>

    <div class="lc-vignette" aria-hidden="true"></div>

    <div class="lc-lockup">
      <img class="lc-logo" src="../logos/luci-full-mintmark-white.png" alt="LUCI">
      <div class="lc-rule" aria-hidden="true"></div>
      <p class="lc-tagline">The <em>Orchestration Engine</em><br>for Enterprise Multimedia</p>
    </div>
  </div>
</body>
</html>
