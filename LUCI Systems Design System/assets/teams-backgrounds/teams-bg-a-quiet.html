<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI Teams background — A · Quiet executive</title>
<!--
  Teams/Zoom virtual background — Variant A "Quiet executive".
  Center is clean navy for the subject. Full-logo + tagline lockup bottom-right; a faint
  small mint mark watermark upper-left. Render to PNG at 1920x1080.
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_teams-base.css">
<style>
  .lc-mark-wm {
    top: 88px;
    left: 88px;
    width: 300px;
    height: auto;
  }
  .lc-lockup {
    right: 96px;
    bottom: 88px;
    text-align: right;
  }
  .lc-lockup .lc-rule { margin-left: auto; }
  .lc-vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 260px 50px rgba(0,0,0,0.5);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="bg">
    <img class="lc-mark-wm" src="../logos/luci-mark-mint.png" alt="" aria-hidden="true">
    <div class="lc-vignette" aria-hidden="true"></div>
    <div class="lc-lockup">
      <img class="lc-logo" src="../logos/luci-full-mintmark-white.png" alt="LUCI">
      <div class="lc-rule" aria-hidden="true"></div>
      <p class="lc-tagline">The <em>Orchestration Engine</em><br>for Enterprise Multimedia</p>
    </div>
  </div>
</body>
</html>
