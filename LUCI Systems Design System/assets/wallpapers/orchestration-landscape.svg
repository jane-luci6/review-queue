<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="4000" height="4000" role="img" aria-label="LUCI orchestration landscape">
  <!--
    Canonical vector master — orchestration landscape motif.
    Mint→gold wave gradient (circuit mintgold language). Every line under the hub.
  -->
  <rect width="1000" height="1000" fill="#0A161C"/>
  <defs>
    <radialGradient id="footprint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F8FA" stop-opacity="0.06"/>
      <stop offset="64%" stop-color="#F5F8FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="power" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#68E3BE" stop-opacity="0.20"/>
      <stop offset="42%" stop-color="#68E3BE" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#68E3BE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mintGoldWave" gradientUnits="userSpaceOnUse"
