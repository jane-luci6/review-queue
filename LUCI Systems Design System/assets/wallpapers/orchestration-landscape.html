<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI — Orchestration landscape (high-res export)</title>
<!--
  High-resolution export — 4000×4000 → orchestration-landscape-4000.png
  Mint→gold wave gradient on every connected line under the LUCI hub.
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<style>
  :root {
    --navy-deep: #0A161C;
    --mint: #68E3BE;
    --gold: #EDD086;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 4000px; height: 4000px; overflow: hidden;
    background: var(--navy-deep);
  }
  .stage {
    position: relative; width: 4000px; height: 4000px;
    background: var(--navy-deep); overflow: hidden;
  }
  .footprint {
    position: absolute; top: 50%; left: 50%;
    width: 3520px; height: 3520px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 50% 50%, rgba(245,248,250,0.06), rgba(245,248,250,0) 64%);
    pointer-events: none;
  }
  .power-glow {
    position: absolute; top: 50%; left: 50%;
    width: 1040px; height: 1040px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(104,227,190,0.20) 0%, rgba(104,227,190,0.05) 42%, transparent 70%);
    pointer-events: none;
  }
  .motif {
    position: absolute; inset: 0;
    width: 4000px; height: 4000px;
  }
  .core {
    position: absolute; top: 50%; left: 50%;
    width: 600px; height: auto;
    transform: translate(-50%, -50%);
    opacity: 0.95;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="power-glow" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 1000 1000" aria-hidden="true">
    <defs>
      <linearGradient id="mintGoldWave" gradientUnits="userSpaceOnUse"
        x1="-500" y1="-80" x2="500" y2="80">
        <stop offset="0%" stop-color="#EDD086"/>
        <stop offset="16%" stop-color="#D4D494"/>
        <stop offset="34%" stop-color="#68E3BE"/>
        <stop offset="66%" stop-color="#68E3BE"/>
        <stop offset="84%" stop-color="#D4D494"/>
        <stop offset="100%" stop-color="#EDD086"/>
      </linearGradient>
    </defs>

    <g transform="translate(500 500)" fill="none" stroke="url(#mintGoldWave)" stroke-linecap="round" stroke-linejoin="round">
      <circle r="84" stroke-width="2.2" opacity="0.48"/>
      <circle r="96" stroke-width="1" opacity="0.16"/>
      <circle r="210" stroke-width="1.3" opacity="0.26"/>

      <g stroke-width="1.9" opacity="0.55">
        <line x1="84" y1="0" x2="210" y2="0"/>
        <line x1="-84" y1="0" x2="-210" y2="0"/>
      </g>

      <g opacity="0.72">
        <circle cx="210" cy="0" r="17" stroke-width="1.4" opacity="0.55"/>
        <circle cx="210" cy="0" r="4" fill="url(#mintGoldWave)" stroke="none"/>
        <circle cx="-210" cy="0" r="17" stroke-width="1.4" opacity="0.55"/>
        <circle cx="-210" cy="0" r="5" fill="url(#mintGoldWave)" stroke="none"/>
        <circle cx="105" cy="182" r="17" stroke-width="1.4" opacity="0.55"/>
        <circle cx="105" cy="182" r="4" fill="url(#mintGoldWave)" stroke="none"/>
        <circle cx="-105" cy="182" r="17" stroke-width="1.4" opacity="0.55"/>
        <circle cx="-105" cy="182" r="4" fill="url(#mintGoldWave)" stroke="none"/>
        <circle cx="-105" cy="-182" r="17" stroke-width="1.4" opacity="0.55"/>
        <circle cx="-105" cy="-182" r="4" fill="url(#mintGoldWave)" stroke="none"/>
        <circle cx="105" cy="-182" r="17" stroke-width="1.4" opacity="0.55"/>
        <circle cx="105" cy="-182" r="4" fill="url(#mintGoldWave)" stroke="none"/>
      </g>

      <g stroke-width="1.4" opacity="0.42">
        <path d="M 105 182 H 210 V 17"/>
        <path d="M -105 182 H -210 V 17"/>
        <path d="M -105 -182 H -210 V -17"/>
        <path d="M 105 -182 H 210 V -17"/>
      </g>

      <g stroke-width="1.9" opacity="0.52">
        <path d="M 227 0 H 500"/>
        <path d="M 300 0 V -55 H 500"/>
        <path d="M 300 0 V 70 H 500"/>
      </g>
      <g stroke-width="1.4" opacity="0.32">
        <path d="M 280 0 V -70 H 360 V -120 H 500"/>
        <path d="M 280 0 V 90 H 370 V 160 H 500"/>
        <path d="M 320 -70 H 380 V -55"/>
        <path d="M 340 90 H 400 V 70"/>
      </g>
      <g stroke-width="1.0" opacity="0.16">
        <path d="M 227 0 V 28 H 500"/>
        <path d="M 227 0 V -28 H 500"/>
        <path d="M 227 0 V -55 H 300"/>
        <path d="M 227 0 V 55 H 300"/>
        <path d="M 280 -28 V 28"/>
        <path d="M 340 -55 V 70"/>
        <path d="M 360 -55 V -20 H 500"/>
        <path d="M 370 70 V 110 H 500"/>
        <path d="M 360 -120 H 500"/>
        <path d="M 370 160 H 500"/>
      </g>
      <circle cx="300" cy="0" r="3.5" fill="url(#mintGoldWave)" stroke="none" opacity="0.55"/>
      <circle cx="360" cy="-55" r="3.5" fill="url(#mintGoldWave)" stroke="none" opacity="0.50"/>
      <circle cx="370" cy="70" r="3" fill="url(#mintGoldWave)" stroke="none" opacity="0.45"/>
      <circle cx="400" cy="-120" r="2.5" fill="url(#mintGoldWave)" stroke="none" opacity="0.40"/>
      <circle cx="400" cy="160" r="2.5" fill="url(#mintGoldWave)" stroke="none" opacity="0.38"/>
      <circle cx="480" cy="0" r="2.5" fill="url(#mintGoldWave)" stroke="none" opacity="0.42"/>

      <g stroke-width="1.9" opacity="0.52">
        <path d="M -227 0 H -500"/>
        <path d="M -300 0 V 50 H -500"/>
        <path d="M -300 0 V -80 H -500"/>
      </g>
      <g stroke-width="1.4" opacity="0.32">
        <path d="M -280 0 V 70 H -360 V 140 H -500"/>
        <path d="M -280 0 V -100 H -370 V -170 H -500"/>
        <path d="M -320 70 H -390 V 50"/>
        <path d="M -340 -100 H -400 V -80"/>
      </g>
      <g stroke-width="1.0" opacity="0.16">
        <path d="M -227 0 V 28 H -500"/>
        <path d="M -227 0 V -28 H -500"/>
        <path d="M -227 0 V -55 H -300"/>
        <path d="M -227 0 V 55 H -300"/>
        <path d="M -280 -28 V 28"/>
        <path d="M -340 -80 V 50"/>
        <path d="M -360 50 V 20 H -500"/>
        <path d="M -370 -80 V -120 H -500"/>
        <path d="M -360 140 H -500"/>
        <path d="M -370 -170 H -500"/>
      </g>
      <circle cx="-300" cy="0" r="3.5" fill="url(#mintGoldWave)" stroke="none" opacity="0.55"/>
      <circle cx="-370" cy="-80" r="4" fill="url(#mintGoldWave)" stroke="none" opacity="0.58"/>
      <circle cx="-360" cy="50" r="3" fill="url(#mintGoldWave)" stroke="none" opacity="0.45"/>
      <circle cx="-400" cy="140" r="2.5" fill="url(#mintGoldWave)" stroke="none" opacity="0.38"/>
      <circle cx="-400" cy="-170" r="2.5" fill="url(#mintGoldWave)" stroke="none" opacity="0.42"/>
      <circle cx="-480" cy="0" r="2.5" fill="url(#mintGoldWave)" stroke="none" opacity="0.42"/>
    </g>
  </svg>

  <img class="core" src="../logos/luci-mark-mint.png" alt="LUCI">
</div>
</body>
</html>
