<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI wallpaper — Orchestration landscape</title>
<!--
  Locked wallpaper: orchestration landscape C (refined).
  Center hub = power source; satellite ring; connective tissue with layered line weights;
  horizontals run OFF the left and right edges of the 1920 canvas. Logo + tagline only.
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_wallpaper-base.css">
<style>
  html, body { width: 1920px; height: 1080px; }
  .wallpaper { width: 1920px; height: 1080px; }

  /* no circuit underlay — it was reading as a diagonal across the field */

  .lc-landscape {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    pointer-events: none;
  }
  .stroke { fill: none; stroke: url(#mintGoldWave); stroke-linecap: round; stroke-linejoin: round; }
  .node { fill: url(#mintGoldWave); }
  .ring-stroke { fill: none; stroke: url(#mintGoldWave); }
  .sat-ring { fill: none; stroke: url(#mintGoldWave); stroke-width: 1.4; }

  .lc-lockup {
    position: absolute; left: 120px; top: 50%;
    transform: translateY(-50%);
    z-index: 2; max-width: 540px;
  }
  .lc-lockup .lc-tagline { font-size: 42px; max-width: 520px; }
  .lc-foot { position: absolute; left: 120px; bottom: 96px; z-index: 2; }
  .lc-foot .lc-logo { height: 56px; opacity: 0.92; }

  .lc-vignette {
    position: absolute; inset: 0;
    /* light left wash only — keep tissue readable to the left edge */
    background: linear-gradient(90deg, rgba(10,22,28,0.35) 0%, rgba(10,22,28,0.12) 14%, rgba(10,22,28,0) 28%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="wallpaper">

    <!-- hub centered at (1080, 540) — right of tagline; tissue runs to x=0 and x=1920 -->
    <svg class="lc-landscape" viewBox="0 0 1920 1080" aria-hidden="true">
      <defs>
        <radialGradient id="pwr" cx="1080" cy="540" r="200" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#68E3BE" stop-opacity="0.18"/>
          <stop offset="45%" stop-color="#68E3BE" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="#68E3BE" stop-opacity="0"/>
        </radialGradient>
        <!-- Mint→gold wave (circuit mintgold language); mint peaks at the hub -->
        <linearGradient id="mintGoldWave" gradientUnits="userSpaceOnUse"
          x1="-1080" y1="-60" x2="840" y2="60">
          <stop offset="0%" stop-color="#EDD086"/>
          <stop offset="18%" stop-color="#D4D494"/>
          <stop offset="42%" stop-color="#68E3BE"/>
          <stop offset="62%" stop-color="#68E3BE"/>
          <stop offset="84%" stop-color="#D4D494"/>
          <stop offset="100%" stop-color="#EDD086"/>
        </linearGradient>
      </defs>
      <circle cx="1080" cy="540" r="200" fill="url(#pwr)"/>

      <g transform="translate(1080 540)" fill="none" stroke="url(#mintGoldWave)" stroke-linecap="round" stroke-linejoin="round">
        <!-- hub rings -->
        <circle class="ring-stroke" r="72" stroke-width="2.2" opacity="0.48"/>
        <circle class="ring-stroke" r="84" stroke-width="1" opacity="0.16"/>

        <!-- orchestration ring + left/right spines only (no diagonal through-lines) -->
        <circle class="ring-stroke" r="180" stroke-width="1.3" opacity="0.26"/>
        <g class="stroke" stroke-width="1.9" opacity="0.48">
          <line x1="72" y1="0" x2="180" y2="0"/>
          <line x1="-72" y1="0" x2="-180" y2="0"/>
        </g>

        <!-- satellites -->
        <g opacity="0.72">
          <circle class="sat-ring" cx="180" cy="0" r="15" opacity="0.55"/>
          <circle class="node" cx="180" cy="0" r="3.5"/>
          <circle class="sat-ring" cx="90" cy="156" r="15" opacity="0.55"/>
          <circle class="node" cx="90" cy="156" r="3.5"/>
          <circle class="sat-ring" cx="-90" cy="156" r="15" opacity="0.55"/>
          <circle class="node" cx="-90" cy="156" r="3.5"/>
          <circle class="sat-ring" cx="-180" cy="0" r="15" opacity="0.55"/>
          <circle class="node" cx="-180" cy="0" r="4.5"/>
          <circle class="sat-ring" cx="-90" cy="-156" r="15" opacity="0.55"/>
          <circle class="node" cx="-90" cy="-156" r="3.5"/>
          <circle class="sat-ring" cx="90" cy="-156" r="15" opacity="0.55"/>
          <circle class="node" cx="90" cy="-156" r="3.5"/>
        </g>

        <!-- Corner sats → L/R gateway → hub (every sat under hub control) -->
        <g class="stroke" stroke-width="1.35" opacity="0.40">
          <path d="M 90 156 H 180 V 15"/>
          <path d="M -90 156 H -180 V 15"/>
          <path d="M -90 -156 H -180 V -15"/>
          <path d="M 90 -156 H 180 V -15"/>
        </g>

        <!-- LUCI mark as core (inline so it scales with the landscape) -->
        <g transform="translate(-36 -30) scale(0.45)" opacity="0.95">
          <path fill="#68E3BE" d="M 78.779 120.749 L 65.111 127.473 L 4.308 97.587 C -1.336 94.813 -1.326 86.913 4.308 84.149 L 4.328 84.149 L 4.888 84.413 L 78.789 120.749 Z"/>
          <path fill="#68E3BE" d="M 139.462 69.171 L 134.197 71.739 L 125.775 75.876 L 87.151 56.88 L 70.556 65.045 L 56.869 58.321 L 82.435 45.765 C 85.402 44.304 88.899 44.304 91.866 45.765 L 139.472 69.171 Z"/>
          <path fill="#68E3BE" d="M 161.321 80.13 L 147.864 86.726 L 91.167 114.603 C 88.639 115.848 85.652 115.848 83.125 114.603 L 28.806 87.893 L 26.398 86.717 L 12.731 79.993 L 10.323 78.816 L 4.189 75.807 C -1.396 73.053 -1.396 65.231 4.189 62.487 L 4.328 62.418 L 26.408 73.269 L 40.095 79.993 L 87.151 103.125 L 134.197 79.993 L 147.654 73.396 L 152.17 75.611 L 161.331 80.12 Z"/>
          <path fill="#68E3BE" d="M 100.818 28.445 L 87.141 35.179 L 48.457 54.175 L 36.588 48.352 L 34.78 47.47 L 87.141 21.721 L 100.818 28.445 Z"/>
          <path fill="#68E3BE" d="M 64.572 70.328 L 62.164 69.152 L 48.497 62.428 L 46.089 61.252 L 40.095 58.301 L 26.408 51.577 L 24.02 50.421 L 18.026 47.47 L 18.006 47.451 L 34.47 39.344 L 42.922 35.208 L 56.42 28.562 L 87.161 13.468 L 87.181 13.487 L 100.868 6.763 L 87.141 0 L 20.793 32.601 L 4.288 40.727 C -1.336 43.491 -1.336 51.371 4.288 54.135 L 4.328 54.155 L 10.323 57.105 L 12.731 58.282 L 26.398 65.006 L 28.805 66.182 L 32.412 67.956 L 34.82 69.132 L 48.487 75.856 L 50.895 77.032 L 87.131 94.852 L 100.798 88.128 L 64.562 70.308 Z"/>
          <path fill="#68E3BE" d="M 154.038 98.077 L 161.501 101.743 L 92.216 135.824 C 89.029 137.392 85.283 137.392 82.096 135.824 L 73.484 131.589 L 147.874 95.048 L 151.66 96.901 L 154.048 98.077 Z"/>
        </g>

        <!-- Tissue rooted at L/R gateways — every branch reconnects to a trunk -->
        <g class="stroke" stroke-width="2" opacity="0.50">
          <path d="M 195 0 H 840"/>
          <path d="M 320 0 V -50 H 840"/>
          <path d="M 320 0 V 65 H 840"/>
          <path d="M -195 0 H -1080"/>
          <path d="M -320 0 V 45 H -1080"/>
          <path d="M -320 0 V -75 H -1080"/>
        </g>
        <g class="stroke" stroke-width="1.35" opacity="0.32">
          <path d="M 280 0 V -65 H 620 V -110 H 840"/>
          <path d="M 280 0 V 85 H 640 V 150 H 840"/>
          <path d="M 480 -65 H 720 V -50"/>
          <path d="M 500 85 H 760 V 65"/>
          <path d="M -280 0 V 65 H -700 V 130 H -1080"/>
          <path d="M -280 0 V -95 H -720 V -160 H -1080"/>
          <path d="M -520 65 H -860 V 45"/>
          <path d="M -540 -95 H -900 V -75"/>
        </g>
        <g class="stroke" stroke-width="1" opacity="0.16">
          <path d="M 195 0 V 24 H 840"/>
          <path d="M 195 0 V -24 H 840"/>
          <path d="M 195 0 V -48 H 320"/>
          <path d="M 195 0 V 48 H 320"/>
          <path d="M 400 -24 V 24"/>
          <path d="M 560 -50 V 65"/>
          <path d="M 620 -50 V -15 H 840"/>
          <path d="M 640 65 V 105 H 840"/>
          <path d="M 620 -110 H 840"/>
          <path d="M 640 150 H 840"/>
          <path d="M -195 0 V 24 H -1080"/>
          <path d="M -195 0 V -24 H -1080"/>
          <path d="M -195 0 V -48 H -320"/>
          <path d="M -195 0 V 48 H -320"/>
          <path d="M -400 -24 V 24"/>
          <path d="M -560 -75 V 45"/>
          <path d="M -700 45 V 15 H -1080"/>
          <path d="M -720 -75 V -115 H -1080"/>
          <path d="M -700 130 H -1080"/>
          <path d="M -720 -160 H -1080"/>
        </g>

        <!-- tissue nodes — including near the edges -->
        <circle class="node" cx="320" cy="0" r="3.5" opacity="0.50"/>
        <circle class="node" cx="560" cy="-50" r="3.5" opacity="0.50"/>
        <circle class="node" cx="640" cy="65" r="3" opacity="0.42"/>
        <circle class="node" cx="780" cy="-110" r="2.5" opacity="0.40"/>
        <circle class="node" cx="800" cy="150" r="2.5" opacity="0.36"/>
        <circle class="node" cx="-320" cy="0" r="3.5" opacity="0.50"/>
        <circle class="node" cx="-720" cy="-75" r="4" opacity="0.55"/>
        <circle class="node" cx="-700" cy="45" r="3" opacity="0.42"/>
        <circle class="node" cx="-900" cy="130" r="2.5" opacity="0.36"/>
        <circle class="node" cx="-950" cy="-160" r="2.5" opacity="0.40"/>
      </g>
    </svg>

    <div class="lc-vignette" aria-hidden="true"></div>

    <div class="lc-lockup">
      <div class="lc-rule" aria-hidden="true"></div>
      <p class="lc-tagline">The <em>Orchestration Engine</em><br>for Enterprise Multimedia</p>
    </div>

    <div class="lc-foot">
      <img class="lc-logo" src="../logos/luci-full-mintmark-white.png" alt="LUCI">
    </div>
  </div>
</body>
</html>
