<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI wallpaper — Orchestration seal</title>
<!--
  Integrated seal: the LUCI logo IS the hub. The orchestration ring frames the mark;
  the wordmark sits below the ring; the tagline hangs below on the same axis; the
  connective tissue grows outward FROM the ring. One composition, one center of gravity.
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_wallpaper-base.css">
<style>
  html, body { width: 1920px; height: 1080px; }
  .wallpaper { width: 1920px; height: 1080px; }

  .lc-landscape {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    pointer-events: none;
  }
  .stroke { fill: none; stroke: url(#mintGoldWave); stroke-linecap: round; stroke-linejoin: round; }
  .node { fill: url(#mintGoldWave); }
  .ring-stroke { fill: none; stroke: url(#mintGoldWave); }
  .sat-ring { fill: none; stroke: url(#mintGoldWave); stroke-width: 1.4; }

  /* The seal — one centered lockup: ring+mark (SVG) above, wordmark + rule + tagline (HTML) below.
     Everything shares the hub's vertical axis (x = 960). */
  .lc-seal {
    position: absolute;
    left: 50%; top: 432px;
    transform: translateX(-50%);
    z-index: 2;
    text-align: center;
    width: 640px;
  }
  .lc-wordmark {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 700;
    font-size: 62px;
    letter-spacing: 0.14em;
    line-height: 1;
    color: var(--off-white);
    margin-top: 40px;
    padding-left: 0.14em;
  }
  .lc-seal .lc-rule {
    width: 44px; height: 3px;
    background: var(--mint);
    margin: 26px auto 22px;
  }
  .lc-seal .lc-tagline {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600;
    font-size: 26px;
    line-height: 1.3;
    letter-spacing: 0.02em;
    color: rgba(245, 248, 250, 0.86);
    max-width: none;
    text-align: center;
  }
  .lc-seal .lc-tagline em {
    font-style: normal;
    font-weight: 700;
    color: var(--mint);
  }

  /* soft radial lift behind the seal so the mark reads as the figure */
  .lc-halo {
    position: absolute; inset: 0;
    background: radial-gradient(440px 320px at 50% 40%, rgba(10,22,28,0.50) 0%, rgba(10,22,28,0.16) 55%, rgba(10,22,28,0) 80%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="wallpaper">

    <!-- hub centered at (960, 432) — the seal's visual center; tissue runs to both edges -->
    <svg class="lc-landscape" viewBox="0 0 1920 1080" aria-hidden="true">
      <defs>
        <radialGradient id="pwr" cx="960" cy="432" r="200" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#68E3BE" stop-opacity="0.16"/>
          <stop offset="45%" stop-color="#68E3BE" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="#68E3BE" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="mintGoldWave" gradientUnits="userSpaceOnUse"
          x1="-960" y1="-40" x2="960" y2="40">
          <stop offset="0%" stop-color="#EDD086"/>
          <stop offset="18%" stop-color="#D4D494"/>
          <stop offset="42%" stop-color="#68E3BE"/>
          <stop offset="58%" stop-color="#68E3BE"/>
          <stop offset="82%" stop-color="#D4D494"/>
          <stop offset="100%" stop-color="#EDD086"/>
        </linearGradient>
      </defs>
      <circle cx="960" cy="432" r="200" fill="url(#pwr)"/>

      <g transform="translate(960 432)" fill="none" stroke="url(#mintGoldWave)" stroke-linecap="round" stroke-linejoin="round">
        <!-- inner hub ring — frames the mark -->
        <circle class="ring-stroke" r="132" stroke-width="2" opacity="0.40"/>
        <circle class="ring-stroke" r="146" stroke-width="1" opacity="0.16"/>

        <!-- orchestration ring + left/right spines -->
        <circle class="ring-stroke" r="210" stroke-width="1.3" opacity="0.20"/>
        <g class="stroke" stroke-width="1.9" opacity="0.38">
          <line x1="146" y1="0" x2="210" y2="0"/>
          <line x1="-146" y1="0" x2="-210" y2="0"/>
        </g>

        <!-- satellites on the orchestration ring -->
        <g opacity="0.55">
          <circle class="sat-ring" cx="210" cy="0" r="15" opacity="0.42"/>
          <circle class="node" cx="210" cy="0" r="3.5"/>
          <circle class="sat-ring" cx="105" cy="182" r="15" opacity="0.42"/>
          <circle class="node" cx="105" cy="182" r="3.5"/>
          <circle class="sat-ring" cx="-105" cy="182" r="15" opacity="0.42"/>
          <circle class="node" cx="-105" cy="182" r="3.5"/>
          <circle class="sat-ring" cx="-210" cy="0" r="15" opacity="0.42"/>
          <circle class="node" cx="-210" cy="0" r="4.5"/>
          <circle class="sat-ring" cx="-105" cy="-182" r="15" opacity="0.42"/>
          <circle class="node" cx="-105" cy="-182" r="3.5"/>
          <circle class="sat-ring" cx="105" cy="-182" r="15" opacity="0.42"/>
          <circle class="node" cx="105" cy="-182" r="3.5"/>
        </g>

        <!-- corner sats → L/R gateway → hub -->
        <g class="stroke" stroke-width="1.35" opacity="0.28">
          <path d="M 105 182 H 210 V 16"/>
          <path d="M -105 182 H -210 V 16"/>
          <path d="M -105 -182 H -210 V -16"/>
          <path d="M 105 -182 H 210 V -16"/>
        </g>

        <!-- LUCI mark as core — the figure inside the ring -->
        <g transform="translate(-65 -54) scale(0.8)" opacity="1">
          <path fill="#68E3BE" d="M 78.779 120.749 L 65.111 127.473 L 4.308 97.587 C -1.336 94.813 -1.326 86.913 4.308 84.149 L 4.328 84.149 L 4.888 84.413 L 78.789 120.749 Z"/>
          <path fill="#68E3BE" d="M 139.462 69.171 L 134.197 71.739 L 125.775 75.876 L 87.151 56.88 L 70.556 65.045 L 56.869 58.321 L 82.435 45.765 C 85.402 44.304 88.899 44.304 91.866 45.765 L 139.472 69.171 Z"/>
          <path fill="#68E3BE" d="M 161.321 80.13 L 147.864 86.726 L 91.167 114.603 C 88.639 115.848 85.652 115.848 83.125 114.603 L 28.806 87.893 L 26.398 86.717 L 12.731 79.993 L 10.323 78.816 L 4.189 75.807 C -1.396 73.053 -1.396 65.231 4.189 62.487 L 4.328 62.418 L 26.408 73.269 L 40.095 79.993 L 87.151 103.125 L 134.197 79.993 L 147.654 73.396 L 152.17 75.611 L 161.331 80.12 Z"/>
          <path fill="#68E3BE" d="M 100.818 28.445 L 87.141 35.179 L 48.457 54.175 L 36.588 48.352 L 34.78 47.47 L 87.141 21.721 L 100.818 28.445 Z"/>
          <path fill="#68E3BE" d="M 64.572 70.328 L 62.164 69.152 L 48.497 62.428 L 46.089 61.252 L 40.095 58.301 L 26.408 51.577 L 24.02 50.421 L 18.026 47.47 L 18.006 47.451 L 34.47 39.344 L 42.922 35.208 L 56.42 28.562 L 87.161 13.468 L 87.181 13.487 L 100.868 6.763 L 87.141 0 L 20.793 32.601 L 4.288 40.727 C -1.336 43.491 -1.336 51.371 4.288 54.135 L 4.328 54.155 L 10.323 57.105 L 12.731 58.282 L 26.398 65.006 L 28.805 66.182 L 32.412 67.956 L 34.82 69.132 L 48.487 75.856 L 50.895 77.032 L 87.131 94.852 L 100.798 88.128 L 64.562 70.308 Z"/>
          <path fill="#68E3BE" d="M 154.038 98.077 L 161.501 101.743 L 92.216 135.824 C 89.029 137.392 85.283 137.392 82.096 135.824 L 73.484 131.589 L 147.874 95.048 L 151.66 96.901 L 154.048 98.077 Z"/>
        </g>

        <!-- Tissue rooted at L/R gateways — symmetric, every branch reconnects to a trunk -->
        <g class="stroke" stroke-width="2" opacity="0.30">
          <path d="M 225 0 H 840"/>
          <path d="M 340 0 V -52 H 840"/>
          <path d="M 340 0 V 64 H 840"/>
          <path d="M -225 0 H -840"/>
          <path d="M -340 0 V -52 H -840"/>
          <path d="M -340 0 V 64 H -840"/>
        </g>
        <g class="stroke" stroke-width="1.35" opacity="0.17">
          <path d="M 300 0 V -66 H 620 V -110 H 840"/>
          <path d="M 300 0 V 84 H 640 V 150 H 840"/>
          <path d="M 480 -66 H 720 V -52"/>
          <path d="M 500 84 H 760 V 64"/>
          <path d="M -300 0 V -66 H -620 V -110 H -840"/>
          <path d="M -300 0 V 84 H -640 V 150 H -840"/>
          <path d="M -480 -66 H -720 V -52"/>
          <path d="M -500 84 H -760 V 64"/>
        </g>
        <g class="stroke" stroke-width="1" opacity="0.08">
          <path d="M 620 -52 V -16 H 840"/>
          <path d="M 640 64 V 104 H 840"/>
          <path d="M -620 -52 V -16 H -840"/>
          <path d="M -640 64 V 104 H -840"/>
        </g>

        <!-- tissue nodes — symmetric -->
        <circle class="node" cx="340" cy="0" r="3.5" opacity="0.32"/>
        <circle class="node" cx="560" cy="-52" r="3" opacity="0.28"/>
        <circle class="node" cx="640" cy="64" r="3" opacity="0.28"/>
        <circle class="node" cx="780" cy="-110" r="2.5" opacity="0.24"/>
        <circle class="node" cx="800" cy="150" r="2.5" opacity="0.22"/>
        <circle class="node" cx="-340" cy="0" r="3.5" opacity="0.32"/>
        <circle class="node" cx="-560" cy="-52" r="3" opacity="0.28"/>
        <circle class="node" cx="-640" cy="64" r="3" opacity="0.28"/>
        <circle class="node" cx="-780" cy="-110" r="2.5" opacity="0.24"/>
        <circle class="node" cx="-800" cy="150" r="2.5" opacity="0.22"/>
      </g>
    </svg>

    <div class="lc-halo" aria-hidden="true"></div>

    <div class="lc-seal">
      <div class="lc-wordmark">LUCI</div>
      <div class="lc-rule" aria-hidden="true"></div>
      <p class="lc-tagline">The <em>Orchestration Engine</em><br>for Enterprise Multimedia</p>
    </div>
  </div>
</body>
</html>
