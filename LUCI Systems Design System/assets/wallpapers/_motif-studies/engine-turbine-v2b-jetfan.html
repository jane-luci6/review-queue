<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI engine motif — Turbine v2 · Jet fan</title>
<!--
  Turbine pass 2b — "Jet fan": dense overlapping blades with a hard leading edge and
  a cut trailing edge (not soft petal curves). Looks like a jet-engine intake fan —
  mechanical density, not floral symmetry.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .blade { fill: var(--mint); }
  .blade-gold { fill: var(--gold); }
  .casing { fill: none; stroke: var(--mint); stroke-width: 4; }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="footprint-ring" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <circle class="ring" cx="410" cy="410" r="402" stroke-width="1.4" opacity="0.10"/>
    <!-- outer casing (engine housing) -->
    <circle class="casing" cx="410" cy="410" r="340" opacity="0.40"/>
    <circle class="ring" cx="410" cy="410" r="326" stroke-width="1.4" opacity="0.20"/>
    <!-- spinner hub ring -->
    <circle class="ring" cx="410" cy="410" r="108" stroke-width="2" opacity="0.40"/>

    <!-- 12 overlapping jet-fan blades: hard leading edge, swept trailing edge.
         Path: from hub out, lean clockwise, cut tip. Overlap creates density. -->
    <g transform="translate(410 410)">
      <g opacity="0.58">
        <!-- hard-edged blade: leading edge straight-ish, trailing edge cut back -->
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z"/>
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(30)"/>
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(60)"/>
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(90)"/>
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(120)"/>
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(150)"/>
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(180)"/>
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(210)"/>
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(240)"/>
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(270)"/>
        <path class="blade" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(300)"/>
        <path class="blade-gold" d="M 22 -8 L 290 -55 L 305 -20 L 295 8 L 22 18 Z" transform="rotate(330)" opacity="0.85"/>
      </g>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
