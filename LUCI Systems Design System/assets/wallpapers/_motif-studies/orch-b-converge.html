<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI motif — Orchestration · Converge</title>
<!--
  Minimalist orchestration B — "Converge": several curved paths from the periphery
  meeting at the mark. Many streams, one core. Super quiet — thin strokes, low opacity.
  Orchestration as convergence, not machinery.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; }
  .stroke-gold { stroke: var(--gold); }
  .fine { stroke-width: 1.4; }
  .node { fill: var(--mint); }
  .node-gold { fill: var(--gold); }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)">
      <!-- faint seating ring -->
      <circle class="stroke fine" r="360" opacity="0.10"/>

      <!-- curved convergence paths — many into one -->
      <g class="stroke fine" opacity="0.32">
        <path d="M 0 -360 Q 80 -180 0 -70"/>
        <path d="M 300 -200 Q 140 -120 55 -40"/>
        <path d="M 360 0 Q 180 40 70 10"/>
        <path d="M 240 280 Q 100 140 40 55"/>
        <path d="M -40 360 Q -60 180 -10 70"/>
        <path d="M -320 180 Q -160 80 -55 30"/>
        <path class="stroke-gold" d="M -340 -80 Q -180 -40 -70 -5" opacity="0.55"/>
        <path d="M -160 -320 Q -80 -160 -30 -55"/>
      </g>

      <!-- origin nodes at the periphery -->
      <circle class="node"      cx="0"    cy="-360" r="4" opacity="0.45"/>
      <circle class="node"      cx="300"  cy="-200" r="4" opacity="0.45"/>
      <circle class="node"      cx="360"  cy="0"    r="4" opacity="0.45"/>
      <circle class="node"      cx="240"  cy="280"  r="4" opacity="0.45"/>
      <circle class="node"      cx="-40"  cy="360"  r="4" opacity="0.45"/>
      <circle class="node"      cx="-320" cy="180"  r="4" opacity="0.45"/>
      <circle class="node-gold" cx="-340" cy="-80"  r="5" opacity="0.65"/>
      <circle class="node"      cx="-160" cy="-320" r="4" opacity="0.45"/>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
