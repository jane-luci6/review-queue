<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI engine motif — Turbine v2 · Impeller</title>
<!--
  Turbine pass 2a — "Impeller": hard trapezoidal blades (straight edges, not soft curves),
  thicker at the hub, cut short at the tip. Overlapping pitch + a mechanical shroud ring.
  Reads as a fan/compressor, not a flower.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .blade { fill: var(--mint); }
  .blade-gold { fill: var(--gold); }
  .shroud { fill: none; stroke: var(--mint); stroke-width: 3; }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="footprint-ring" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <circle class="ring" cx="410" cy="410" r="402" stroke-width="1.4" opacity="0.10"/>
    <!-- mechanical shroud (fan housing) -->
    <circle class="shroud" cx="410" cy="410" r="330" opacity="0.35"/>
    <circle class="ring" cx="410" cy="410" r="318" stroke-width="1.4" opacity="0.18"/>
    <circle class="ring" cx="410" cy="410" r="110" stroke-width="1.4" opacity="0.30"/>

    <!-- 8 hard trapezoidal blades — straight radial edges, slight forward lean, cut tips -->
    <g transform="translate(410 410)">
      <g opacity="0.70">
        <!-- blade path: hub width ~28, tip width ~10, slight sweep. Hard geometry. -->
        <path class="blade" d="M 18 -14 L 300 -6 L 300 6 L 18 14 Z" transform="rotate(0)"/>
        <path class="blade" d="M 18 -14 L 300 -6 L 300 6 L 18 14 Z" transform="rotate(45)"/>
        <path class="blade" d="M 18 -14 L 300 -6 L 300 6 L 18 14 Z" transform="rotate(90)"/>
        <path class="blade" d="M 18 -14 L 300 -6 L 300 6 L 18 14 Z" transform="rotate(135)"/>
        <path class="blade" d="M 18 -14 L 300 -6 L 300 6 L 18 14 Z" transform="rotate(180)"/>
        <path class="blade" d="M 18 -14 L 300 -6 L 300 6 L 18 14 Z" transform="rotate(225)"/>
        <path class="blade" d="M 18 -14 L 300 -6 L 300 6 L 18 14 Z" transform="rotate(270)"/>
        <path class="blade-gold" d="M 18 -14 L 300 -6 L 300 6 L 18 14 Z" transform="rotate(315)" opacity="0.85"/>
      </g>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
