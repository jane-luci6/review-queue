<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI engine motif — Blueprint · Turbine plan</title>
<!--
  Blueprint pass A — "Turbine plan": top-down engineering drawing of a turbine stage.
  Thin stroke only (no fills), dashed centerlines, dimension ticks, hidden-line arcs.
  Reads as a blueprint of an engine, not a flower or a solid impeller.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; stroke-linejoin: round; }
  .stroke-gold { stroke: var(--gold); }
  .hidden { stroke-dasharray: 6 5; }
  .centerline { stroke-dasharray: 18 6 3 6; }
  .fine { stroke-width: 1.2; }
  .med { stroke-width: 1.8; }
  .heavy { stroke-width: 2.6; }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)" class="stroke">
      <!-- outer sheet edge (blueprint border) -->
      <circle class="fine" r="402" opacity="0.14"/>

      <!-- centerlines (blueprint long-short-long) -->
      <line class="centerline fine" x1="-390" y1="0" x2="390" y2="0" opacity="0.35"/>
      <line class="centerline fine" x1="0" y1="-390" x2="0" y2="390" opacity="0.35"/>

      <!-- casing (outer housing) — heavy outline -->
      <circle class="heavy" r="330" opacity="0.55"/>
      <!-- inner casing wall -->
      <circle class="med" r="310" opacity="0.30"/>

      <!-- hub / spinner -->
      <circle class="heavy" r="110" opacity="0.55"/>
      <circle class="fine" r="95" opacity="0.28"/>

      <!-- 8 blade outlines — hard geometry, stroke only, slight forward lean -->
      <g class="med" opacity="0.70">
        <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z"/>
        <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(45)"/>
        <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(90)"/>
        <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(135)"/>
        <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(180)"/>
        <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(225)"/>
        <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(270)"/>
        <path class="stroke-gold" d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(315)" opacity="0.9"/>
      </g>

      <!-- dimension ticks on casing (engineering marks) -->
      <g class="fine" opacity="0.45">
        <line x1="330" y1="-8" x2="348" y2="-8"/>
        <line x1="330" y1="8" x2="348" y2="8"/>
        <line x1="348" y1="-8" x2="348" y2="8"/>
        <line x1="-348" y1="-8" x2="-330" y2="-8"/>
        <line x1="-348" y1="8" x2="-330" y2="8"/>
        <line x1="-348" y1="-8" x2="-348" y2="8"/>
      </g>

      <!-- hidden-line arc (obscured geometry behind) -->
      <path class="hidden fine" d="M -220 0 A 220 220 0 0 1 220 0" opacity="0.35"/>

      <!-- section cut markers (two arrows on the vertical) -->
      <g class="fine" opacity="0.40">
        <path d="M -12 -360 L 0 -348 L 12 -360"/>
        <path d="M -12 360 L 0 348 L 12 360"/>
      </g>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
