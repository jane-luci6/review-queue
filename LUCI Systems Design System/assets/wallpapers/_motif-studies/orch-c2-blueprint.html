<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI motif — Orchestration · Sync + blueprint underlay</title>
<!--
  C evolution 2 — Sync over a faint blueprint/circuit underlay. The rings sit on top of
  a masked mint/gold circuit texture so they feel like they're reading/connecting
  something in the background. Sync arcs stay quiet.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .blueprint {
    position: absolute; inset: 0;
    background-image: url("../../textures/texture-circuit-header-mintgold.png");
    background-repeat: repeat;
    background-size: 480px auto;
    opacity: 0.38;
    mix-blend-mode: screen;
    pointer-events: none;
    /* keep the blueprint visible under the rings, fade at the far edges */
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, #000 42%, transparent 78%);
            mask-image: radial-gradient(circle at 50% 50%, #000 0%, #000 42%, transparent 78%);
  }
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; }
  .stroke-gold { stroke: var(--gold); }
  .fine { stroke-width: 1.3; }
  .med { stroke-width: 2.2; }
  .node { fill: var(--mint); }
  .node-gold { fill: var(--gold); }
</style>
</head>
<body>
<div class="stage">
  <div class="blueprint" aria-hidden="true"></div>
  <div class="footprint" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)">
      <circle class="stroke fine" r="340" opacity="0.14"/>
      <circle class="stroke fine" r="240" opacity="0.18"/>
      <circle class="stroke fine" r="140" opacity="0.22"/>

      <g class="stroke med" opacity="0.50">
        <path d="M 140 0 A 140 140 0 0 1 99 99"/>
        <path d="M 240 0 A 240 240 0 0 1 170 170" transform="rotate(40)"/>
        <path class="stroke-gold" d="M 340 0 A 340 340 0 0 1 240 240" transform="rotate(80)" opacity="0.70"/>
      </g>
      <g class="stroke med" opacity="0.38">
        <path d="M 140 0 A 140 140 0 0 1 99 99" transform="rotate(180)"/>
        <path d="M 240 0 A 240 240 0 0 1 170 170" transform="rotate(220)"/>
        <path d="M 340 0 A 340 340 0 0 1 240 240" transform="rotate(260)"/>
      </g>

      <circle class="node"      cx="340"  cy="0"    r="4" opacity="0.45"/>
      <circle class="node"      cx="-170" cy="294"  r="4" opacity="0.45"/>
      <circle class="node-gold" cx="-170" cy="-294" r="5" opacity="0.65"/>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
