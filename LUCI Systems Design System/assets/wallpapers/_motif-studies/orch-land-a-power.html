<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI motif — Orchestration landscape · Power source</title>
<!--
  Inspiration pass — Image 1 energy: center as a source of power exploding outward.
  LUCI mark at the hub with a soft mint power-glow, dense radial rays, a ring of
  satellite nodes, and quieter outer nodes the rays reach. Background-grade, mint/gold.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .power-glow {
    position: absolute; top: 50%; left: 50%;
    width: 280px; height: 280px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(104,227,190,0.22) 0%, rgba(104,227,190,0.06) 40%, transparent 70%);
    pointer-events: none;
  }
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; }
  .fine { stroke-width: 1.1; }
  .med { stroke-width: 1.6; }
  .node { fill: var(--mint); }
  .node-gold { fill: var(--gold); }
  .ring-stroke { fill: none; stroke: var(--mint); }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="power-glow" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)">
      <!-- power ring around the mark -->
      <circle class="ring-stroke" r="88" stroke-width="2" opacity="0.45"/>
      <circle class="ring-stroke" r="100" stroke-width="1" opacity="0.18"/>

      <!-- dense radial rays exploding outward -->
      <g class="stroke fine" opacity="0.22">
        <line x1="100" y1="0" x2="400" y2="0"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(15)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(30)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(45)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(60)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(75)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(90)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(105)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(120)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(135)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(150)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(165)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(180)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(195)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(210)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(225)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(240)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(255)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(270)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(285)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(300)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(315)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(330)"/>
        <line x1="100" y1="0" x2="400" y2="0" transform="rotate(345)"/>
      </g>

      <!-- orchestration ring -->
      <circle class="ring-stroke" r="220" stroke-width="1.3" opacity="0.28"/>

      <!-- satellite nodes on the ring (stronger spokes to these) -->
      <g class="stroke med" opacity="0.40">
        <line x1="100" y1="0" x2="220" y2="0"/>
        <line x1="100" y1="0" x2="220" y2="0" transform="rotate(60)"/>
        <line x1="100" y1="0" x2="220" y2="0" transform="rotate(120)"/>
        <line x1="100" y1="0" x2="220" y2="0" transform="rotate(180)"/>
        <line x1="100" y1="0" x2="220" y2="0" transform="rotate(240)"/>
        <line x1="100" y1="0" x2="220" y2="0" transform="rotate(300)"/>
      </g>
      <circle class="node" cx="220" cy="0" r="7" opacity="0.65"/>
      <circle class="node" cx="110" cy="190" r="7" opacity="0.65"/>
      <circle class="node" cx="-110" cy="190" r="7" opacity="0.65"/>
      <circle class="node-gold" cx="-220" cy="0" r="8" opacity="0.75"/>
      <circle class="node" cx="-110" cy="-190" r="7" opacity="0.65"/>
      <circle class="node" cx="110" cy="-190" r="7" opacity="0.65"/>

      <!-- quieter outer nodes the rays reach -->
      <circle class="node" cx="360" cy="80" r="4" opacity="0.35"/>
      <circle class="node" cx="300" cy="260" r="4" opacity="0.30"/>
      <circle class="node" cx="-40" cy="370" r="4" opacity="0.30"/>
      <circle class="node" cx="-340" cy="140" r="4" opacity="0.30"/>
      <circle class="node" cx="-320" cy="-200" r="4" opacity="0.28"/>
      <circle class="node" cx="60" cy="-370" r="4" opacity="0.28"/>
      <circle class="node" cx="340" cy="-160" r="4" opacity="0.30"/>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
