<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI engine motif — Blueprint · Cutaway section</title>
<!--
  Blueprint pass B — "Cutaway section": engineering section view through the engine core.
  Left half = solid outline (visible); right half = dashed (hidden) + section hatching.
  Feels like a blueprint cutaway of a turbine — technical, not decorative.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; stroke-linejoin: round; }
  .stroke-gold { stroke: var(--gold); }
  .hidden { stroke-dasharray: 7 5; }
  .centerline { stroke-dasharray: 18 6 3 6; }
  .hatch { stroke: var(--mint); stroke-width: 1; }
  .fine { stroke-width: 1.2; }
  .med { stroke-width: 1.8; }
  .heavy { stroke-width: 2.6; }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <defs>
      <!-- 45° section hatching (engineering convention) -->
      <pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
        <line class="hatch" x1="0" y1="0" x2="0" y2="10" opacity="0.35"/>
      </pattern>
      <clipPath id="right-half">
        <rect x="410" y="0" width="410" height="820"/>
      </clipPath>
      <clipPath id="left-half">
        <rect x="0" y="0" width="410" height="820"/>
      </clipPath>
    </defs>

    <g class="stroke">
      <!-- centerlines -->
      <line class="centerline fine" x1="20" y1="410" x2="800" y2="410" opacity="0.35"/>
      <line class="centerline fine" x1="410" y1="20" x2="410" y2="800" opacity="0.35"/>

      <!-- LEFT half — visible solid outlines -->
      <g clip-path="url(#left-half)">
        <circle class="heavy" cx="410" cy="410" r="330" opacity="0.55"/>
        <circle class="med" cx="410" cy="410" r="250" opacity="0.35"/>
        <circle class="heavy" cx="410" cy="410" r="110" opacity="0.55"/>
        <!-- blade outlines on left -->
        <g transform="translate(410 410)" class="med" opacity="0.70">
          <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(180)"/>
          <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(225)"/>
          <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(270)"/>
          <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(315)"/>
        </g>
      </g>

      <!-- RIGHT half — section hatching + dashed hidden geometry -->
      <g clip-path="url(#right-half)">
        <!-- hatched material between casing and hub -->
        <path fill="url(#hatch)" stroke="none"
              d="M 410 80 A 330 330 0 0 1 410 740 A 110 110 0 0 0 410 300 A 110 110 0 0 0 410 520 A 330 330 0 0 1 410 80 Z"
              opacity="0.9"/>
        <circle class="heavy" cx="410" cy="410" r="330" opacity="0.55"/>
        <circle class="heavy" cx="410" cy="410" r="110" opacity="0.55"/>
        <!-- hidden-line blades on right -->
        <g transform="translate(410 410)" class="hidden med" opacity="0.45">
          <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(0)"/>
          <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(45)"/>
          <path d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(90)"/>
          <path class="stroke-gold" d="M 112 -18 L 300 -42 L 305 -12 L 112 18 Z" transform="rotate(135)" opacity="0.7"/>
        </g>
      </g>

      <!-- cutting-plane arrows at top/bottom -->
      <g class="fine" opacity="0.50">
        <path d="M 398 28 L 410 42 L 422 28"/>
        <path d="M 398 792 L 410 778 L 422 792"/>
        <line x1="410" y1="42" x2="410" y2="70"/>
        <line x1="410" y1="750" x2="410" y2="778"/>
      </g>

      <!-- dimension callout on the right -->
      <g class="fine stroke-gold" opacity="0.70">
        <line x1="750" y1="410" x2="780" y2="410"/>
        <line x1="750" y1="80" x2="750" y2="740"/>
        <line x1="742" y1="80" x2="758" y2="80"/>
        <line x1="742" y1="740" x2="758" y2="740"/>
      </g>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
