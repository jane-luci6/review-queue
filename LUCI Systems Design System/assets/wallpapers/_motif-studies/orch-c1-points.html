<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI motif — Orchestration · Sync + points</title>
<!--
  C evolution 1 — Sync with orchestration points: keep the quiet rings + coordinated
  arc-segments, add discrete connection nodes on the arcs and thin cross-links between
  layers (orchestration as points being coordinated across stages).
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; }
  .stroke-gold { stroke: var(--gold); }
  .fine { stroke-width: 1.3; }
  .med { stroke-width: 2.2; }
  .node { fill: var(--mint); }
  .node-gold { fill: var(--gold); }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)">
      <circle class="stroke fine" r="340" opacity="0.10"/>
      <circle class="stroke fine" r="240" opacity="0.14"/>
      <circle class="stroke fine" r="140" opacity="0.18"/>

      <!-- coordinated arc-segments -->
      <g class="stroke med" opacity="0.45">
        <path d="M 140 0 A 140 140 0 0 1 99 99"/>
        <path d="M 240 0 A 240 240 0 0 1 170 170" transform="rotate(40)"/>
        <path class="stroke-gold" d="M 340 0 A 340 340 0 0 1 240 240" transform="rotate(80)" opacity="0.65"/>
      </g>
      <g class="stroke med" opacity="0.35">
        <path d="M 140 0 A 140 140 0 0 1 99 99" transform="rotate(180)"/>
        <path d="M 240 0 A 240 240 0 0 1 170 170" transform="rotate(220)"/>
        <path d="M 340 0 A 340 340 0 0 1 240 240" transform="rotate(260)"/>
      </g>

      <!-- connection points ON the arc endpoints (orchestration nodes) -->
      <!-- inner arc ends @ 0° and ~45°; mid @ 40°+45°; outer @ 80°+45° -->
      <circle class="node"      cx="140"  cy="0"    r="5" opacity="0.55"/>
      <circle class="node"      cx="99"   cy="99"   r="5" opacity="0.55"/>
      <circle class="node"      cx="184"  cy="154"  r="5" opacity="0.50"/>  <!-- mid arc start approx -->
      <circle class="node"      cx="0"    cy="240"  r="5" opacity="0.50"/>
      <circle class="node-gold" cx="59"   cy="335"  r="6" opacity="0.70"/>
      <circle class="node"      cx="-140" cy="0"    r="5" opacity="0.45"/>
      <circle class="node"      cx="-99"  cy="-99"  r="5" opacity="0.45"/>
      <circle class="node"      cx="-184" cy="-154" r="5" opacity="0.40"/>
      <circle class="node"      cx="0"    cy="-340" r="5" opacity="0.40"/>

      <!-- thin cross-links between layers (same angular family) -->
      <g class="stroke fine" opacity="0.22">
        <line x1="140" y1="0" x2="184" y2="154"/>
        <line x1="99" y1="99" x2="0" y2="240"/>
        <line x1="0" y1="240" x2="59" y2="335"/>
        <line x1="-140" y1="0" x2="-184" y2="-154"/>
        <line x1="-99" y1="-99" x2="0" y2="-340"/>
      </g>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
