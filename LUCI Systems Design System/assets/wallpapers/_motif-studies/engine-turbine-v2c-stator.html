<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI engine motif — Turbine v2 · Stator</title>
<!--
  Turbine pass 2c — "Stator": fewer heavy blades (4) with a hard forward lean, plus a
  secondary counter-ring of short stator vanes. Industrial weight, not floral softness.
  Looks like a cutaway of a turbine stage.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .blade { fill: var(--mint); }
  .blade-gold { fill: var(--gold); }
  .vane { fill: var(--mint); }
  .casing { fill: none; stroke: var(--mint); stroke-width: 3.5; }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="footprint-ring" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <circle class="ring" cx="410" cy="410" r="402" stroke-width="1.4" opacity="0.10"/>
    <circle class="casing" cx="410" cy="410" r="345" opacity="0.38"/>
    <circle class="ring" cx="410" cy="410" r="332" stroke-width="1.4" opacity="0.18"/>
    <circle class="ring" cx="410" cy="410" r="118" stroke-width="2" opacity="0.35"/>

    <g transform="translate(410 410)">
      <!-- 4 heavy rotor blades — thick, hard-edged, forward-leaning. Industrial. -->
      <g opacity="0.72">
        <path class="blade" d="M 24 -22 L 280 -70 L 310 -18 L 300 22 L 24 28 Z"/>
        <path class="blade" d="M 24 -22 L 280 -70 L 310 -18 L 300 22 L 24 28 Z" transform="rotate(90)"/>
        <path class="blade" d="M 24 -22 L 280 -70 L 310 -18 L 300 22 L 24 28 Z" transform="rotate(180)"/>
        <path class="blade-gold" d="M 24 -22 L 280 -70 L 310 -18 L 300 22 L 24 28 Z" transform="rotate(270)" opacity="0.88"/>
      </g>

      <!-- secondary stator vanes on the outer ring — short, radial, mechanical -->
      <g opacity="0.38">
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(30)"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(60)"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(90)"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(120)"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(150)"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(180)"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(210)"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(240)"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(270)"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(300)"/>
        <rect class="vane" x="318" y="-5" width="28" height="10" rx="1" transform="rotate(330)"/>
      </g>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
