<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI engine motif — 3 · Rotor / flow</title>
<!--
  Study 3 — "Rotor / flow": segmented (gapped) rings implying a rotor, plus curved flow
  arcs routing between nodes around the core — reads as orchestration (things being
  processed/routed through the engine). One flow arc in gold. LUCI mark = the core.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .seg { fill: none; stroke: var(--mint); stroke-width: 6; stroke-linecap: round; }
  .flow { fill: none; stroke: var(--mint); stroke-width: 2; stroke-linecap: round; }
  .flow-gold { stroke: var(--gold); }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="footprint-ring" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)">
      <!-- segmented rotor rings: arcs with gaps = rotation/segments -->
      <g class="seg" opacity="0.30">
        <path d="M 120 0 A 120 120 0 0 1 84 84"/>
        <path d="M 120 0 A 120 120 0 0 1 84 84" transform="rotate(120)"/>
        <path d="M 120 0 A 120 120 0 0 1 84 84" transform="rotate(240)"/>
      </g>
      <g class="seg" opacity="0.22">
        <path d="M 220 0 A 220 220 0 0 1 156 156" transform="rotate(20)"/>
        <path d="M 220 0 A 220 220 0 0 1 156 156" transform="rotate(140)"/>
        <path d="M 220 0 A 220 220 0 0 1 156 156" transform="rotate(260)"/>
      </g>
      <g class="seg" opacity="0.16">
        <path d="M 320 0 A 320 320 0 0 1 226 226" transform="rotate(40)"/>
        <path d="M 320 0 A 320 320 0 0 1 226 226" transform="rotate(160)"/>
        <path d="M 320 0 A 320 320 0 0 1 226 226" transform="rotate(280)"/>
      </g>

      <!-- nodes on the outer ring -->
      <circle class="node"      cx="0"   cy="-320" r="7" opacity="0.6"/>
      <circle class="node-gold" cx="320" cy="0"    r="8" opacity="0.75"/>
      <circle class="node"      cx="0"   cy="320"  r="7" opacity="0.6"/>
      <circle class="node"      cx="-320" cy="0"   r="7" opacity="0.6"/>

      <!-- curved flow arcs routing between nodes through the core (orchestration) -->
      <g class="flow" opacity="0.5">
        <path d="M 0 -300 Q 180 -60 300 0"/>
        <path d="M 300 0 Q 60 180 0 300"/>
        <path d="M 0 300 Q -180 60 -300 0"/>
      </g>
      <path class="flow flow-gold" opacity="0.7" d="M -300 0 Q -60 -180 0 -300"/>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
