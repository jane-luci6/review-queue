<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI engine motif — 2 · Gyroscope</title>
<!--
  Study 2 — "Gyroscope": concentric rings + nested tilted elliptical gimbal rings at
  different axes around the LUCI mark. Nested rotation axes read as a stabilized
  spinning engine — spatial, circular, space-y, but mechanical. One node in gold.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .gimbal { fill: none; stroke: var(--mint); stroke-width: 1.6; }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="footprint-ring" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <!-- coplanar concentric rings (the base orbit) -->
    <circle class="ring" cx="410" cy="410" r="402" stroke-width="1.4" opacity="0.10"/>
    <circle class="ring" cx="410" cy="410" r="300" stroke-width="1.4" opacity="0.16"/>
    <circle class="ring" cx="410" cy="410" r="120" stroke-width="1.4" opacity="0.30"/>

    <!-- tilted gimbal rings: ellipses at different rotations = nested rotation axes -->
    <g transform="translate(410 410)">
      <ellipse class="gimbal" rx="370" ry="150" opacity="0.20"/>
      <ellipse class="gimbal" rx="370" ry="150" opacity="0.16" transform="rotate(60)"/>
      <ellipse class="gimbal" rx="300" ry="120" opacity="0.24" transform="rotate(30)"/>
      <ellipse class="gimbal" rx="300" ry="120" opacity="0.18" transform="rotate(90)"/>
      <ellipse class="gimbal" rx="220" ry="90"  opacity="0.28" transform="rotate(120)"/>
    </g>

    <!-- a few nodes on the outer ring (one gold) -->
    <g transform="translate(410 410)">
      <circle class="node"      cx="0"   cy="-402" r="6" opacity="0.5"/>
      <circle class="node-gold" cx="402" cy="0"    r="7" opacity="0.7"/>
      <circle class="node"      cx="0"   cy="402"  r="6" opacity="0.5"/>
      <circle class="node"      cx="-402" cy="0"   r="6" opacity="0.5"/>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
