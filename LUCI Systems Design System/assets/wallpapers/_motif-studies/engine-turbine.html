<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI engine motif — 1 · Turbine</title>
<!--
  Study 1 — "Turbine": filled, tapered, swept blades around the LUCI mark hub — an
  abstract impeller. Filled curved fins (not dashed arcs) read as a spinning engine.
  One blade in gold. Concentric rings + soft footprint kept for the spatial quality.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .blade { fill: var(--mint); }
  .blade-gold { fill: var(--gold); }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="footprint-ring" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <!-- faint concentric rings (spatial guide) -->
    <circle class="ring" cx="410" cy="410" r="402" stroke-width="1.4" opacity="0.10"/>
    <circle class="ring" cx="410" cy="410" r="330" stroke-width="1.4" opacity="0.14"/>

    <!-- 6 swept tapered blades = impeller. One blade path, rotated 60° each. -->
    <g transform="translate(410 410)">
      <g opacity="0.62">
        <path class="blade"        d="M 96 0 C 175 8 250 55 322 132 C 250 30 175 4 96 0 Z"/>
        <path class="blade"        d="M 96 0 C 175 8 250 55 322 132 C 250 30 175 4 96 0 Z" transform="rotate(60)"/>
        <path class="blade"        d="M 96 0 C 175 8 250 55 322 132 C 250 30 175 4 96 0 Z" transform="rotate(120)"/>
        <path class="blade"        d="M 96 0 C 175 8 250 55 322 132 C 250 30 175 4 96 0 Z" transform="rotate(180)"/>
        <path class="blade"        d="M 96 0 C 175 8 250 55 322 132 C 250 30 175 4 96 0 Z" transform="rotate(240)"/>
        <path class="blade-gold"   d="M 96 0 C 175 8 250 55 322 132 C 250 30 175 4 96 0 Z" transform="rotate(300)" opacity="0.78"/>
      </g>
    </g>

    <!-- inner hub ring -->
    <circle class="ring" cx="410" cy="410" r="104" stroke-width="1.4" opacity="0.30"/>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
