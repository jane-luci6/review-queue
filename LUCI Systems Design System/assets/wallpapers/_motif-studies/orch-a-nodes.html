<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI motif — Orchestration · Nodes</title>
<!--
  Minimalist orchestration A — "Nodes": the LUCI mark as the orchestrator, thin leaders
  out to discrete endpoint nodes at varied radii. Quiet, background-grade. Reads as
  many things coordinated from one core — not an engine, not a compass.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; }
  .fine { stroke-width: 1.2; }
  .node { fill: var(--mint); }
  .node-gold { fill: var(--gold); }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)">
      <!-- one very faint outer ring — just enough to seat the field -->
      <circle class="stroke fine" r="360" opacity="0.12"/>

      <!-- thin leaders from core to endpoints (orchestration lines) -->
      <g class="stroke fine" opacity="0.28">
        <line x1="55" y1="-30" x2="280" y2="-220"/>
        <line x1="55" y1="10" x2="340" y2="40"/>
        <line x1="30" y1="50" x2="160" y2="310"/>
        <line x1="-40" y1="40" x2="-260" y2="240"/>
        <line x1="-55" y1="-10" x2="-330" y2="-60"/>
        <line x1="-20" y1="-50" x2="-90" y2="-320"/>
      </g>

      <!-- endpoint nodes — varied radii, one gold -->
      <circle class="node"      cx="280"  cy="-220" r="5" opacity="0.55"/>
      <circle class="node"      cx="340"  cy="40"   r="5" opacity="0.55"/>
      <circle class="node-gold" cx="160"  cy="310"  r="6" opacity="0.70"/>
      <circle class="node"      cx="-260" cy="240"  r="5" opacity="0.55"/>
      <circle class="node"      cx="-330" cy="-60"  r="5" opacity="0.55"/>
      <circle class="node"      cx="-90"  cy="-320" r="5" opacity="0.55"/>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
