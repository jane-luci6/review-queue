<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI motif — Orchestration landscape · C refined</title>
<!--
  Locked direction C, refined: power-source center + satellite ring + connective tissue.
  Horizontals run OFF the page (left/right). Mix of very faint / mid / stronger strokes
  so the tissue reads as complex, layered infrastructure — still background-grade.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .power-glow {
    position: absolute; top: 50%; left: 50%;
    width: 260px; height: 260px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(104,227,190,0.20) 0%, rgba(104,227,190,0.05) 42%, transparent 70%);
    pointer-events: none;
  }
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; stroke-linejoin: round; }
  .fine { stroke-width: 1.0; }
  .mid { stroke-width: 1.4; }
  .strong { stroke-width: 1.9; }
  .node { fill: var(--mint); }
  .node-gold { fill: var(--gold); }
  .ring-stroke { fill: none; stroke: var(--mint); }
  .sat-ring { fill: none; stroke: var(--mint); stroke-width: 1.4; }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="power-glow" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)">
      <!-- hub -->
      <circle class="ring-stroke" r="84" stroke-width="2.2" opacity="0.48"/>
      <circle class="ring-stroke" r="96" stroke-width="1" opacity="0.16"/>

      <!-- radial power rays — mixed weights -->
      <g class="stroke fine" opacity="0.12">
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(20)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(40)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(80)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(100)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(140)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(160)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(200)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(220)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(260)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(280)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(320)"/>
        <line x1="96" y1="0" x2="410" y2="0" transform="rotate(340)"/>
      </g>

      <!-- orchestration ring -->
      <circle class="ring-stroke" r="210" stroke-width="1.3" opacity="0.26"/>

      <!-- strong spokes to satellites -->
      <g class="stroke strong" opacity="0.48">
        <line x1="84" y1="0" x2="210" y2="0"/>
        <line x1="84" y1="0" x2="210" y2="0" transform="rotate(60)"/>
        <line x1="84" y1="0" x2="210" y2="0" transform="rotate(120)"/>
        <line x1="84" y1="0" x2="210" y2="0" transform="rotate(180)"/>
        <line x1="84" y1="0" x2="210" y2="0" transform="rotate(240)"/>
        <line x1="84" y1="0" x2="210" y2="0" transform="rotate(300)"/>
      </g>

      <!-- satellite systems -->
      <g opacity="0.72">
        <circle class="sat-ring" cx="210" cy="0" r="17" opacity="0.55"/>
        <circle class="node" cx="210" cy="0" r="4"/>
        <circle class="sat-ring" cx="105" cy="182" r="17" opacity="0.55"/>
        <circle class="node" cx="105" cy="182" r="4"/>
        <circle class="sat-ring" cx="-105" cy="182" r="17" opacity="0.55"/>
        <circle class="node" cx="-105" cy="182" r="4"/>
        <circle class="sat-ring" cx="-210" cy="0" r="17" opacity="0.55" style="stroke:var(--gold)"/>
        <circle class="node-gold" cx="-210" cy="0" r="5"/>
        <circle class="sat-ring" cx="-105" cy="-182" r="17" opacity="0.55"/>
        <circle class="node" cx="-105" cy="-182" r="4"/>
        <circle class="sat-ring" cx="105" cy="-182" r="17" opacity="0.55"/>
        <circle class="node" cx="105" cy="-182" r="4"/>
      </g>

      <!-- ========== CONNECTIVE TISSUE — layered complexity ========== -->

      <!-- LAYER 1 — very faint under-web (runs off left/right edges) -->
      <g class="stroke fine" opacity="0.10">
        <path d="M 227 0 H 410"/>
        <path d="M 227 28 H 410"/>
        <path d="M 227 -28 H 410"/>
        <path d="M 227 -55 H 360 V -110 H 410"/>
        <path d="M 227 55 H 350 V 130 H 410"/>
        <path d="M -227 0 H -410"/>
        <path d="M -227 28 H -410"/>
        <path d="M -227 -28 H -410"/>
        <path d="M -227 -55 H -350 V -140 H -410"/>
        <path d="M -227 55 H -340 V 150 H -410"/>
        <!-- faint cross-links -->
        <path d="M 280 -28 V 28"/>
        <path d="M 340 -55 V 55"/>
        <path d="M -280 -28 V 28"/>
        <path d="M -340 -55 V 55"/>
      </g>

      <!-- LAYER 2 — mid tissue, primary off-page horizontals + branches -->
      <g class="stroke mid" opacity="0.28">
        <!-- RIGHT: main trunk off-page, with forks -->
        <path d="M 227 0 H 410"/>
        <path d="M 280 0 V -70 H 360 V -120 H 410"/>
        <path d="M 280 0 V 90 H 370 V 160 H 410"/>
        <path d="M 320 -70 H 380 V -40"/>
        <path d="M 340 90 H 400 V 50"/>
        <!-- LEFT: main trunk off-page, with forks -->
        <path d="M -227 0 H -410"/>
        <path d="M -280 0 V 70 H -360 V 140 H -410"/>
        <path d="M -280 0 V -100 H -370 V -170 H -410"/>
        <path d="M -320 70 H -390 V 100"/>
        <path d="M -340 -100 H -400 V -60"/>
        <!-- vertical bleeds (shorter, not the focus) -->
        <path d="M 0 -227 V -380"/>
        <path d="M 0 227 V 380"/>
        <path d="M 40 -280 H 120 V -350"/>
        <path d="M -50 280 H -130 V 360"/>
      </g>

      <!-- LAYER 3 — stronger primary trunks + a few bold branches (the readable structure) -->
      <g class="stroke strong" opacity="0.42">
        <!-- RIGHT primary off-page -->
        <path d="M 227 0 H 410"/>
        <path d="M 300 0 V -55 H 410"/>
        <path d="M 300 0 V 70 H 410"/>
        <!-- LEFT primary off-page -->
        <path d="M -227 0 H -410"/>
        <path d="M -300 0 V 50 H -410"/>
        <path d="M -300 0 V -80 H -410"/>
        <!-- diagonal bleeds from satellites into the tissue -->
        <path d="M 120 195 L 180 260 H 280 V 320 H 410"/>
        <path d="M -120 -195 L -185 -270 H -300 V -320 H -410"/>
      </g>

      <!-- LAYER 4 — fine secondary forks near the edges (complexity at the periphery) -->
      <g class="stroke fine" opacity="0.18">
        <path d="M 360 -55 V -20 H 410"/>
        <path d="M 370 70 V 110 H 410"/>
        <path d="M 380 -120 H 410"/>
        <path d="M 390 160 H 410"/>
        <path d="M -360 50 V 20 H -410"/>
        <path d="M -370 -80 V -120 H -410"/>
        <path d="M -380 140 H -410"/>
        <path d="M -390 -170 H -410"/>
        <path d="M 250 260 H 320 V 290 H 410"/>
        <path d="M -250 -270 H -320 V -300 H -410"/>
      </g>

      <!-- data nodes on the tissue — denser toward the edges -->
      <circle class="node" cx="300" cy="0" r="3.5" opacity="0.50"/>
      <circle class="node" cx="360" cy="-55" r="3" opacity="0.40"/>
      <circle class="node" cx="370" cy="70" r="3" opacity="0.40"/>
      <circle class="node" cx="400" cy="-120" r="2.5" opacity="0.30"/>
      <circle class="node" cx="400" cy="160" r="2.5" opacity="0.28"/>
      <circle class="node" cx="-300" cy="0" r="3.5" opacity="0.50"/>
      <circle class="node-gold" cx="-370" cy="-80" r="4" opacity="0.55"/>
      <circle class="node" cx="-360" cy="50" r="3" opacity="0.40"/>
      <circle class="node" cx="-400" cy="140" r="2.5" opacity="0.28"/>
      <circle class="node" cx="-400" cy="-170" r="2.5" opacity="0.28"/>
      <circle class="node" cx="180" cy="260" r="3" opacity="0.35"/>
      <circle class="node" cx="320" cy="320" r="2.5" opacity="0.28"/>
      <circle class="node" cx="-185" cy="-270" r="3" opacity="0.35"/>
      <circle class="node" cx="-320" cy="-320" r="2.5" opacity="0.28"/>
      <circle class="node" cx="120" cy="-350" r="2.5" opacity="0.25"/>
      <circle class="node" cx="-130" cy="360" r="2.5" opacity="0.25"/>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
