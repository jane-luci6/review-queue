<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI — Orchestration landscape motif</title>
<!--
  Final motif: every line connected under the LUCI hub. Mint→gold wave gradient
  across the tissue (same language as texture-circuit-header-mintgold).
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .power-glow {
    position: absolute; top: 50%; left: 50%;
    width: 260px; height: 260px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(104,227,190,0.20) 0%, rgba(104,227,190,0.05) 42%, transparent 70%);
    pointer-events: none;
  }
  .stroke {
    fill: none;
    stroke: url(#mintGoldWave);
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .fine { stroke-width: 1.0; }
  .mid { stroke-width: 1.4; }
  .strong { stroke-width: 1.9; }
  .node { fill: url(#mintGoldWave); }
  .ring-stroke { fill: none; stroke: url(#mintGoldWave); }
  .sat-ring { fill: none; stroke: url(#mintGoldWave); stroke-width: 1.4; }
  /* force gradient via style on the SVG root group — CSS url can fail in headless Chrome */

</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="power-glow" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 1000 1000" aria-hidden="true">
    <defs>
      <!-- Wave: gold at the edges → mint through the hub (matches circuit mintgold pattern) -->
      <linearGradient id="mintGoldWave" gradientUnits="userSpaceOnUse"
        x1="-500" y1="-80" x2="500" y2="80">
        <stop offset="0%" stop-color="#EDD086"/>
        <stop offset="16%" stop-color="#D4D494"/>
        <stop offset="34%" stop-color="#68E3BE"/>
        <stop offset="66%" stop-color="#68E3BE"/>
        <stop offset="84%" stop-color="#D4D494"/>
        <stop offset="100%" stop-color="#EDD086"/>
      </linearGradient>
    </defs>

    <g transform="translate(500 500)" fill="none" stroke="url(#mintGoldWave)" stroke-linecap="round" stroke-linejoin="round">
      <!-- HUB rings stay mint-forward (gradient still reads mint at center) -->
      <circle class="ring-stroke" r="84" stroke-width="2.2" opacity="0.48"/>
      <circle class="ring-stroke" r="96" stroke-width="1" opacity="0.16"/>
      <circle class="ring-stroke" r="210" stroke-width="1.3" opacity="0.26"/>

      <g class="stroke strong" opacity="0.55">
        <line x1="84" y1="0" x2="210" y2="0"/>
        <line x1="-84" y1="0" x2="-210" y2="0"/>
      </g>

      <g opacity="0.72">
        <circle class="sat-ring" cx="210" cy="0" r="17" opacity="0.55"/>
        <circle class="node" cx="210" cy="0" r="4"/>
        <circle class="sat-ring" cx="-210" cy="0" r="17" opacity="0.55"/>
        <circle class="node" cx="-210" cy="0" r="5"/>
        <circle class="sat-ring" cx="105" cy="182" r="17" opacity="0.55"/>
        <circle class="node" cx="105" cy="182" r="4"/>
        <circle class="sat-ring" cx="-105" cy="182" r="17" opacity="0.55"/>
        <circle class="node" cx="-105" cy="182" r="4"/>
        <circle class="sat-ring" cx="-105" cy="-182" r="17" opacity="0.55"/>
        <circle class="node" cx="-105" cy="-182" r="4"/>
        <circle class="sat-ring" cx="105" cy="-182" r="17" opacity="0.55"/>
        <circle class="node" cx="105" cy="-182" r="4"/>
      </g>

      <g class="stroke mid" opacity="0.42">
        <path d="M 105 182 H 210 V 17"/>
        <path d="M -105 182 H -210 V 17"/>
        <path d="M -105 -182 H -210 V -17"/>
        <path d="M 105 -182 H 210 V -17"/>
      </g>

      <!-- RIGHT tissue -->
      <g class="stroke strong" opacity="0.52">
        <path d="M 227 0 H 500"/>
        <path d="M 300 0 V -55 H 500"/>
        <path d="M 300 0 V 70 H 500"/>
      </g>
      <g class="stroke mid" opacity="0.32">
        <path d="M 280 0 V -70 H 360 V -120 H 500"/>
        <path d="M 280 0 V 90 H 370 V 160 H 500"/>
        <path d="M 320 -70 H 380 V -55"/>
        <path d="M 340 90 H 400 V 70"/>
      </g>
      <g class="stroke fine" opacity="0.16">
        <path d="M 227 0 V 28 H 500"/>
        <path d="M 227 0 V -28 H 500"/>
        <path d="M 227 0 V -55 H 300"/>
        <path d="M 227 0 V 55 H 300"/>
        <path d="M 280 -28 V 28"/>
        <path d="M 340 -55 V 70"/>
        <path d="M 360 -55 V -20 H 500"/>
        <path d="M 370 70 V 110 H 500"/>
        <path d="M 360 -120 H 500"/>
        <path d="M 370 160 H 500"/>
      </g>
      <circle class="node" cx="300" cy="0" r="3.5" opacity="0.55"/>
      <circle class="node" cx="360" cy="-55" r="3.5" opacity="0.50"/>
      <circle class="node" cx="370" cy="70" r="3" opacity="0.45"/>
      <circle class="node" cx="400" cy="-120" r="2.5" opacity="0.40"/>
      <circle class="node" cx="400" cy="160" r="2.5" opacity="0.38"/>
      <circle class="node" cx="480" cy="0" r="2.5" opacity="0.42"/>

      <!-- LEFT tissue -->
      <g class="stroke strong" opacity="0.52">
        <path d="M -227 0 H -500"/>
        <path d="M -300 0 V 50 H -500"/>
        <path d="M -300 0 V -80 H -500"/>
      </g>
      <g class="stroke mid" opacity="0.32">
        <path d="M -280 0 V 70 H -360 V 140 H -500"/>
        <path d="M -280 0 V -100 H -370 V -170 H -500"/>
        <path d="M -320 70 H -390 V 50"/>
        <path d="M -340 -100 H -400 V -80"/>
      </g>
      <g class="stroke fine" opacity="0.16">
        <path d="M -227 0 V 28 H -500"/>
        <path d="M -227 0 V -28 H -500"/>
        <path d="M -227 0 V -55 H -300"/>
        <path d="M -227 0 V 55 H -300"/>
        <path d="M -280 -28 V 28"/>
        <path d="M -340 -80 V 50"/>
        <path d="M -360 50 V 20 H -500"/>
        <path d="M -370 -80 V -120 H -500"/>
        <path d="M -360 140 H -500"/>
        <path d="M -370 -170 H -500"/>
      </g>
      <circle class="node" cx="-300" cy="0" r="3.5" opacity="0.55"/>
      <circle class="node" cx="-370" cy="-80" r="4" opacity="0.58"/>
      <circle class="node" cx="-360" cy="50" r="3" opacity="0.45"/>
      <circle class="node" cx="-400" cy="140" r="2.5" opacity="0.38"/>
      <circle class="node" cx="-400" cy="-170" r="2.5" opacity="0.42"/>
      <circle class="node" cx="-480" cy="0" r="2.5" opacity="0.42"/>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
