<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI motif — Orchestration landscape · Combined</title>
<!--
  Inspiration pass — both references: center as power source (soft glow + radial rays)
  orchestrating a ring of satellite nodes, with connective tissue bleeding outward beyond
  the ring. The full landscape Jane described. Still quieter than stock art — background grade.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .power-glow {
    position: absolute; top: 50%; left: 50%;
    width: 260px; height: 260px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(104,227,190,0.20) 0%, rgba(104,227,190,0.05) 42%, transparent 70%);
    pointer-events: none;
  }
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; stroke-linejoin: round; }
  .fine { stroke-width: 1.1; }
  .med { stroke-width: 1.7; }
  .node { fill: var(--mint); }
  .node-gold { fill: var(--gold); }
  .ring-stroke { fill: none; stroke: var(--mint); }
  .sat-ring { fill: none; stroke: var(--mint); stroke-width: 1.4; }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="power-glow" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)">
      <!-- hub -->
      <circle class="ring-stroke" r="84" stroke-width="2.2" opacity="0.48"/>
      <circle class="ring-stroke" r="96" stroke-width="1" opacity="0.16"/>

      <!-- radial power rays (quieter density than land-a) -->
      <g class="stroke fine" opacity="0.16">
        <line x1="96" y1="0" x2="390" y2="0"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(20)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(40)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(80)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(100)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(140)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(160)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(200)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(220)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(260)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(280)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(320)"/>
        <line x1="96" y1="0" x2="390" y2="0" transform="rotate(340)"/>
      </g>

      <!-- orchestration ring -->
      <circle class="ring-stroke" r="210" stroke-width="1.3" opacity="0.26"/>

      <!-- strong spokes to satellites -->
      <g class="stroke med" opacity="0.48">
        <line x1="84" y1="0" x2="210" y2="0"/>
        <line x1="84" y1="0" x2="210" y2="0" transform="rotate(60)"/>
        <line x1="84" y1="0" x2="210" y2="0" transform="rotate(120)"/>
        <line x1="84" y1="0" x2="210" y2="0" transform="rotate(180)"/>
        <line x1="84" y1="0" x2="210" y2="0" transform="rotate(240)"/>
        <line x1="84" y1="0" x2="210" y2="0" transform="rotate(300)"/>
      </g>

      <!-- satellite systems -->
      <g opacity="0.72">
        <circle class="sat-ring" cx="210" cy="0" r="17" opacity="0.55"/>
        <circle class="node" cx="210" cy="0" r="4"/>
        <circle class="sat-ring" cx="105" cy="182" r="17" opacity="0.55"/>
        <circle class="node" cx="105" cy="182" r="4"/>
        <circle class="sat-ring" cx="-105" cy="182" r="17" opacity="0.55"/>
        <circle class="node" cx="-105" cy="182" r="4"/>
        <circle class="sat-ring" cx="-210" cy="0" r="17" opacity="0.55" style="stroke:var(--gold)"/>
        <circle class="node-gold" cx="-210" cy="0" r="5"/>
        <circle class="sat-ring" cx="-105" cy="-182" r="17" opacity="0.55"/>
        <circle class="node" cx="-105" cy="-182" r="4"/>
        <circle class="sat-ring" cx="105" cy="-182" r="17" opacity="0.55"/>
        <circle class="node" cx="105" cy="-182" r="4"/>
      </g>

      <!-- connective tissue bleeding beyond the ring -->
      <g class="stroke fine" opacity="0.30">
        <path d="M 227 0 H 310 V -70 H 380"/>
        <path d="M 310 0 V 90 H 375"/>
        <path d="M -227 0 H -310 V 60 H -385"/>
        <path d="M -310 0 V -100 H -370"/>
        <path d="M 0 -227 V -310 H 80 V -375"/>
        <path d="M 0 227 V 310 H -70 V 375"/>
        <path d="M 120 195 L 175 260 L 175 330"/>
        <path d="M -120 -195 L -180 -265 L -255 -265"/>
      </g>
      <circle class="node" cx="310" cy="0" r="3.5" opacity="0.45"/>
      <circle class="node" cx="380" cy="-70" r="3.5" opacity="0.35"/>
      <circle class="node" cx="-310" cy="0" r="3.5" opacity="0.45"/>
      <circle class="node-gold" cx="-370" cy="-100" r="4" opacity="0.50"/>
      <circle class="node" cx="80" cy="-375" r="3.5" opacity="0.30"/>
      <circle class="node" cx="-70" cy="375" r="3.5" opacity="0.30"/>
      <circle class="node" cx="175" cy="330" r="3.5" opacity="0.30"/>
      <circle class="node" cx="-255" cy="-265" r="3.5" opacity="0.30"/>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
