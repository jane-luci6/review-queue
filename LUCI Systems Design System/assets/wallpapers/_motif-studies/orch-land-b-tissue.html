<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI motif — Orchestration landscape · Connective tissue</title>
<!--
  Inspiration pass — Image 2 structure: center orchestrates a ring of satellites, plus
  connective tissue bleeding outward (PCB-style traces with data nodes). LUCI mark as hub,
  6 satellite nodes on a ring, branched circuit traces left/right/out. Background-grade.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .power-glow {
    position: absolute; top: 50%; left: 50%;
    width: 240px; height: 240px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(104,227,190,0.18) 0%, rgba(104,227,190,0.05) 42%, transparent 70%);
    pointer-events: none;
  }
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; stroke-linejoin: round; }
  .stroke-gold { stroke: var(--gold); }
  .fine { stroke-width: 1.2; }
  .med { stroke-width: 1.7; }
  .node { fill: var(--mint); }
  .node-gold { fill: var(--gold); }
  .ring-stroke { fill: none; stroke: var(--mint); }
  .sat-ring { fill: none; stroke: var(--mint); stroke-width: 1.4; }
</style>
</head>
<body>
<div class="stage">
  <div class="footprint" aria-hidden="true"></div>
  <div class="power-glow" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)">
      <!-- hub ring -->
      <circle class="ring-stroke" r="82" stroke-width="2" opacity="0.42"/>
      <circle class="ring-stroke" r="200" stroke-width="1.2" opacity="0.22"/>
      <circle class="ring-stroke" r="320" stroke-width="1" opacity="0.10"/>

      <!-- spokes to satellite ring -->
      <g class="stroke med" opacity="0.45">
        <line x1="82" y1="0" x2="200" y2="0"/>
        <line x1="82" y1="0" x2="200" y2="0" transform="rotate(60)"/>
        <line x1="82" y1="0" x2="200" y2="0" transform="rotate(120)"/>
        <line x1="82" y1="0" x2="200" y2="0" transform="rotate(180)"/>
        <line x1="82" y1="0" x2="200" y2="0" transform="rotate(240)"/>
        <line x1="82" y1="0" x2="200" y2="0" transform="rotate(300)"/>
      </g>

      <!-- satellite nodes (hollow rings + center dots = "systems") -->
      <g opacity="0.70">
        <circle class="sat-ring" cx="200" cy="0" r="18" opacity="0.55"/>
        <circle class="node" cx="200" cy="0" r="4"/>
        <circle class="sat-ring" cx="100" cy="173" r="18" opacity="0.55"/>
        <circle class="node" cx="100" cy="173" r="4"/>
        <circle class="sat-ring" cx="-100" cy="173" r="18" opacity="0.55"/>
        <circle class="node" cx="-100" cy="173" r="4"/>
        <circle class="sat-ring" cx="-200" cy="0" r="18" opacity="0.55" style="stroke:var(--gold)"/>
        <circle class="node-gold" cx="-200" cy="0" r="5"/>
        <circle class="sat-ring" cx="-100" cy="-173" r="18" opacity="0.55"/>
        <circle class="node" cx="-100" cy="-173" r="4"/>
        <circle class="sat-ring" cx="100" cy="-173" r="18" opacity="0.55"/>
        <circle class="node" cx="100" cy="-173" r="4"/>
      </g>

      <!-- connective tissue bleeding outward — PCB-style branched traces -->
      <g class="stroke fine" opacity="0.32">
        <!-- right bleed -->
        <path d="M 218 0 H 300 V -60 H 370"/>
        <path d="M 300 0 V 80 H 380"/>
        <path d="M 300 -60 H 340 V -120"/>
        <!-- left bleed -->
        <path d="M -218 0 H -300 V 50 H -380"/>
        <path d="M -300 0 V -90 H -360"/>
        <path d="M -300 50 H -340 V 120"/>
        <!-- top bleed -->
        <path d="M 0 -218 V -300 H 70 V -360"/>
        <path d="M 0 -300 H -80 V -350"/>
        <!-- bottom bleed -->
        <path d="M 0 218 V 300 H -60 V 360"/>
        <path d="M 0 300 H 90 V 350"/>
        <!-- diagonal bleeds from satellites -->
        <path d="M 115 188 L 160 240 L 160 300"/>
        <path d="M -115 -188 L -170 -250 L -240 -250"/>
      </g>

      <!-- data nodes on the connective tissue -->
      <circle class="node" cx="300" cy="0" r="3.5" opacity="0.50"/>
      <circle class="node" cx="370" cy="-60" r="3.5" opacity="0.40"/>
      <circle class="node" cx="380" cy="80" r="3.5" opacity="0.40"/>
      <circle class="node" cx="-300" cy="0" r="3.5" opacity="0.50"/>
      <circle class="node" cx="-380" cy="50" r="3.5" opacity="0.40"/>
      <circle class="node-gold" cx="-360" cy="-90" r="4" opacity="0.55"/>
      <circle class="node" cx="70" cy="-360" r="3.5" opacity="0.35"/>
      <circle class="node" cx="-60" cy="360" r="3.5" opacity="0.35"/>
      <circle class="node" cx="160" cy="300" r="3.5" opacity="0.35"/>
      <circle class="node" cx="-240" cy="-250" r="3.5" opacity="0.35"/>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
