<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI motif — Orchestration · Sync + points + blueprint</title>
<!--
  C evolution 3 — the full combination: faint circuit underlay + a quiet schematic of
  background "systems" (small nodes/boxes) that the sync rings pass through and connect,
  plus orchestration points on the arcs. The rings read as coordinating something underneath.
-->
<link rel="stylesheet" href="../../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_study-base.css">
<style>
  .blueprint {
    position: absolute; inset: 0;
    background-image: url("../../textures/texture-circuit-header-mintgold.png");
    background-repeat: repeat;
    background-size: 480px auto;
    opacity: 0.28;
    mix-blend-mode: screen;
    pointer-events: none;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, #000 40%, transparent 76%);
            mask-image: radial-gradient(circle at 50% 50%, #000 0%, #000 40%, transparent 76%);
  }
  .stroke { fill: none; stroke: var(--mint); stroke-linecap: round; stroke-linejoin: round; }
  .stroke-gold { stroke: var(--gold); }
  .fine { stroke-width: 1.2; }
  .med { stroke-width: 2.2; }
  .node { fill: var(--mint); }
  .node-gold { fill: var(--gold); }
  .sys { fill: none; stroke: var(--mint); stroke-width: 1.1; }
</style>
</head>
<body>
<div class="stage">
  <div class="blueprint" aria-hidden="true"></div>
  <div class="footprint" aria-hidden="true"></div>

  <svg class="motif" viewBox="0 0 820 820" aria-hidden="true">
    <g transform="translate(410 410)">
      <!-- background "systems" — faint boxes/nodes the rings connect through -->
      <g class="sys" opacity="0.22">
        <rect x="200" y="-280" width="48" height="32" rx="2"/>
        <rect x="260" y="80" width="40" height="40" rx="2"/>
        <rect x="40" y="260" width="56" height="28" rx="2"/>
        <rect x="-280" y="160" width="44" height="36" rx="2"/>
        <rect x="-300" y="-120" width="52" height="28" rx="2"/>
        <rect x="-120" y="-300" width="36" height="36" rx="2"/>
        <rect x="120" y="-40" width="28" height="28" rx="2"/>
        <rect x="-60" y="120" width="28" height="28" rx="2"/>
      </g>
      <!-- faint links between background systems -->
      <g class="stroke fine" opacity="0.12">
        <line x1="224" y1="-248" x2="134" y2="-40"/>
        <line x1="148" y1="-12" x2="260" y2="100"/>
        <line x1="280" y1="120" x2="68" y2="260"/>
        <line x1="40" y1="274" x2="-46" y2="148"/>
        <line x1="-60" y1="134" x2="-258" y2="178"/>
        <line x1="-280" y1="160" x2="-274" y2="-92"/>
        <line x1="-274" y1="-120" x2="-102" y2="-282"/>
        <line x1="-102" y1="-282" x2="200" y2="-264"/>
      </g>

      <!-- sync rings sitting over the schematic -->
      <circle class="stroke fine" r="340" opacity="0.16"/>
      <circle class="stroke fine" r="240" opacity="0.20"/>
      <circle class="stroke fine" r="140" opacity="0.24"/>

      <g class="stroke med" opacity="0.52">
        <path d="M 140 0 A 140 140 0 0 1 99 99"/>
        <path d="M 240 0 A 240 240 0 0 1 170 170" transform="rotate(40)"/>
        <path class="stroke-gold" d="M 340 0 A 340 340 0 0 1 240 240" transform="rotate(80)" opacity="0.72"/>
      </g>
      <g class="stroke med" opacity="0.40">
        <path d="M 140 0 A 140 140 0 0 1 99 99" transform="rotate(180)"/>
        <path d="M 240 0 A 240 240 0 0 1 170 170" transform="rotate(220)"/>
        <path d="M 340 0 A 340 340 0 0 1 240 240" transform="rotate(260)"/>
      </g>

      <!-- orchestration points on the arcs -->
      <circle class="node"      cx="140"  cy="0"    r="5" opacity="0.55"/>
      <circle class="node"      cx="99"   cy="99"   r="5" opacity="0.55"/>
      <circle class="node"      cx="0"    cy="240"  r="5" opacity="0.50"/>
      <circle class="node-gold" cx="59"   cy="335"  r="6" opacity="0.72"/>
      <circle class="node"      cx="-140" cy="0"    r="5" opacity="0.45"/>
      <circle class="node"      cx="-99"  cy="-99"  r="5" opacity="0.45"/>
      <circle class="node"      cx="0"    cy="-340" r="5" opacity="0.40"/>

      <!-- thin radial ties from points toward nearby background systems -->
      <g class="stroke fine" opacity="0.25">
        <line x1="140" y1="0" x2="134" y2="-26"/>
        <line x1="99" y1="99" x2="148" y2="100"/>
        <line x1="0" y1="240" x2="40" y2="260"/>
        <line x1="59" y1="335" x2="68" y2="288"/>
        <line x1="-140" y1="0" x2="-248" y2="-92"/>
        <line x1="0" y1="-340" x2="-84" y2="-300"/>
      </g>
    </g>
  </svg>

  <img class="core" src="../../logos/luci-mark-mint.png" alt="" aria-hidden="true">
</div>
</body>
</html>
