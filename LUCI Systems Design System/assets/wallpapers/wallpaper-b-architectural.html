<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI wallpaper — B · Architectural</title>
<!--
  Variant B — "Architectural": the isometric mint mark motif scaled large and bleeding off
  the right edge (mint, one plane gold), a faint mint/gold circuit texture, and a subtle
  isometric perspective grid (the "blueprint future" floor). Tagline anchored left.
  Logo + tagline only (no sub-tagline).
  Render to PNG at 1920x1080 and 2560x1440 (see scripts/render-internal-team-assets.sh).
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_wallpaper-base.css">
<style>
  html, body { width: 1920px; height: 1080px; }
  .wallpaper { width: 1920px; height: 1080px; }

  /* circuit texture — concentrated on the right behind the motif */
  .lc-circuit {
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 30%, #000 60%, #000 100%);
            mask-image: linear-gradient(90deg, transparent 0%, transparent 30%, #000 60%, #000 100%);
    opacity: 0.42;
  }

  /* faint isometric perspective grid — converging floor lines, lower-right */
  .lc-grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.22;
  }

  .lc-motif {
    position: absolute;
    top: 50%;
    right: -180px;
    width: 1180px;
    height: auto;
    transform: translateY(-50%);
    pointer-events: none;
    opacity: 0.16;
  }
  .lc-motif .plane-gold { fill: var(--gold); opacity: 0.85; }
  .lc-motif .plane-mint { fill: var(--mint); }

  .lc-lockup {
    position: absolute;
    left: 120px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    max-width: 620px;
  }
  .lc-lockup .lc-tagline { font-size: 48px; max-width: 600px; }

  .lc-foot {
    position: absolute;
    left: 120px;
    bottom: 96px;
    z-index: 2;
  }
  .lc-foot .lc-logo { height: 56px; opacity: 0.92; }

  .lc-vignette {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(10,22,28,0.92) 0%, rgba(10,22,28,0.55) 32%, rgba(10,22,28,0) 52%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="wallpaper">
    <div class="lc-circuit" aria-hidden="true"></div>

    <!-- isometric perspective grid: converging lines toward a vanishing point on the right -->
    <svg class="lc-grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <g stroke="#68E3BE" stroke-width="1" fill="none" opacity="0.5">
        <!-- horizontal floor lines, perspective-spaced -->
        <line x1="0"    y1="900" x2="1920" y2="900"/>
        <line x1="-40"  y1="820" x2="1920" y2="860"/>
        <line x1="-80"  y1="740" x2="1920" y2="820"/>
        <line x1="-120" y1="660" x2="1920" y2="780"/>
        <line x1="-160" y1="580" x2="1920" y2="740"/>
        <!-- converging verticals toward a vanishing point at (1500, 560) -->
        <line x1="200"  y1="1080" x2="1500" y2="560"/>
        <line x1="520"  y1="1080" x2="1500" y2="560"/>
        <line x1="840"  y1="1080" x2="1500" y2="560"/>
        <line x1="1160" y1="1080" x2="1500" y2="560"/>
        <line x1="1480" y1="1080" x2="1500" y2="560"/>
        <line x1="1800" y1="1080" x2="1500" y2="560"/>
      </g>
    </svg>

    <!-- isometric LUCI mark, large, bleeding off the right edge -->
    <svg class="lc-motif" viewBox="0 0 161.501 137" fill="none" aria-hidden="true">
      <path class="plane-mint" d="M 78.779 120.749 L 65.111 127.473 L 4.308 97.587 C -1.336 94.813 -1.326 86.913 4.308 84.149 L 4.328 84.149 L 4.888 84.413 L 78.789 120.749 L 78.779 120.749 Z"/>
      <path class="plane-gold" d="M 139.462 69.171 L 134.197 71.739 L 125.775 75.876 L 87.151 56.88 L 70.556 65.045 L 56.869 58.321 L 82.435 45.765 C 85.402 44.304 88.899 44.304 91.866 45.765 L 139.472 69.171 L 139.462 69.171 Z"/>
      <path class="plane-mint" d="M 161.321 80.13 L 147.864 86.726 L 91.167 114.603 C 88.639 115.848 85.652 115.848 83.125 114.603 L 28.806 87.893 L 26.398 86.717 L 12.731 79.993 L 10.323 78.816 L 4.189 75.807 C -1.396 73.053 -1.396 65.231 4.189 62.487 L 4.328 62.418 L 26.408 73.269 L 40.095 79.993 L 87.151 103.125 L 134.197 79.993 L 147.654 73.396 L 152.17 75.611 L 161.331 80.12 L 161.321 80.13 Z"/>
      <path class="plane-mint" d="M 100.818 28.445 L 87.141 35.179 L 48.457 54.175 L 36.588 48.352 L 34.78 47.47 L 87.141 21.721 L 100.818 28.445 Z"/>
      <path class="plane-mint" d="M 64.572 70.328 L 62.164 69.152 L 48.497 62.428 L 46.089 61.252 L 40.095 58.301 L 26.408 51.577 L 24.02 50.421 L 18.026 47.47 L 18.006 47.451 L 34.47 39.344 L 42.922 35.208 L 56.42 28.562 L 87.161 13.468 L 87.181 13.487 L 100.868 6.763 L 87.141 0 L 20.793 32.601 L 4.288 40.727 C -1.336 43.491 -1.336 51.371 4.288 54.135 L 4.328 54.155 L 10.323 57.105 L 12.731 58.282 L 26.398 65.006 L 28.805 66.182 L 32.412 67.956 L 34.82 69.132 L 48.487 75.856 L 50.895 77.032 L 87.131 94.852 L 100.798 88.128 L 64.562 70.308 L 64.572 70.328 Z"/>
      <path class="plane-mint" d="M 154.038 98.077 L 161.501 101.743 L 92.216 135.824 C 89.029 137.392 85.283 137.392 82.096 135.824 L 73.484 131.589 L 147.874 95.048 L 151.66 96.901 L 154.048 98.077 L 154.038 98.077 Z"/>
    </svg>

    <div class="lc-vignette" aria-hidden="true"></div>

    <div class="lc-lockup">
      <div class="lc-rule" aria-hidden="true"></div>
      <p class="lc-tagline">The <em>Orchestration Engine</em><br>for Enterprise Multimedia</p>
    </div>

    <div class="lc-foot">
      <img class="lc-logo" src="../logos/luci-full-mintmark-white.png" alt="LUCI">
    </div>
  </div>
</body>
</html>
