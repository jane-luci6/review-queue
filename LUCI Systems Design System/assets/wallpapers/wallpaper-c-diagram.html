<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI wallpaper — C · System orbit</title>
<!--
  Variant C — "System orbit": a custom abstract orbit motif (concentric mint rings + node
  dots + a soft central glow) on the right half — evokes "the orchestrated system" without
  legible text or a busy diagram. Tagline stack anchored left. No canonical-diagram
  reference, so no retired-language bleed and no propagation coupling.
  Render to PNG at 1920x1080 and 2560x1440 (see scripts/render-internal-team-assets.sh).
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_wallpaper-base.css">
<style>
  html, body { width: 1920px; height: 1080px; }
  .wallpaper { width: 1920px; height: 1080px; }

  .lc-orbit {
    position: absolute;
    top: 50%;
    right: 60px;
    width: 920px;
    height: 920px;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .lc-orbit .ring {
    fill: none;
    stroke: var(--mint);
    stroke-width: 1.4;
  }
  .lc-orbit .node {
    fill: var(--mint);
  }
  .lc-orbit .node-gold { fill: var(--gold); }

  /* soft central glow */
  .lc-glow {
    position: absolute;
    top: 50%;
    right: 60px;
    width: 920px;
    height: 920px;
    transform: translateY(-50%);
    background: radial-gradient(circle at 50% 50%, rgba(104,227,190,0.14), rgba(104,227,190,0) 62%);
    pointer-events: none;
  }

  .lc-lockup {
    position: absolute;
    left: 120px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    max-width: 600px;
  }
  .lc-lockup .lc-tagline { font-size: 38px; max-width: 540px; }
  .lc-lockup .lc-sub { font-size: 17px; max-width: 460px; }

  .lc-foot {
    position: absolute;
    right: 120px;
    bottom: 96px;
    z-index: 2;
  }
  .lc-foot .lc-logo { height: 56px; opacity: 0.92; }

  .lc-vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 280px 50px rgba(0,0,0,0.5);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="wallpaper">
    <div class="lc-glow" aria-hidden="true"></div>
    <!-- abstract orbit: three concentric rings + nodes (one gold), no text -->
    <svg class="lc-orbit" viewBox="0 0 920 920" aria-hidden="true">
      <circle class="ring" cx="460" cy="460" r="452" opacity="0.10"/>
      <circle class="ring" cx="460" cy="460" r="360" opacity="0.16"/>
      <circle class="ring" cx="460" cy="460" r="248" opacity="0.22"/>
      <circle class="ring" cx="460" cy="460" r="132" opacity="0.30"/>
      <!-- nodes on the outer ring -->
      <circle class="node" cx="460" cy="8"    r="6" opacity="0.55"/>
      <circle class="node" cx="912" cy="460" r="6" opacity="0.55"/>
      <circle class="node-gold" cx="460" cy="912" r="7" opacity="0.7"/>
      <circle class="node" cx="8"    cy="460" r="6" opacity="0.55"/>
      <!-- nodes on the mid ring -->
      <circle class="node" cx="460" cy="100"  r="5" opacity="0.5"/>
      <circle class="node" cx="820" cy="460"  r="5" opacity="0.5"/>
      <circle class="node" cx="460" cy="820"  r="5" opacity="0.5"/>
      <circle class="node" cx="100" cy="460"  r="5" opacity="0.5"/>
      <!-- inner core dot -->
      <circle class="node" cx="460" cy="460" r="10" opacity="0.85"/>
    </svg>

    <div class="lc-vignette" aria-hidden="true"></div>

    <div class="lc-lockup">
      <div class="lc-rule" aria-hidden="true"></div>
      <p class="lc-tagline">The <em>Orchestration Engine</em><br>for Enterprise Multimedia</p>
      <p class="lc-sub">One interface to control, automate, and execute the entire guest experience.</p>
    </div>

    <div class="lc-foot">
      <img class="lc-logo" src="../logos/luci-full-mintmark-white.png" alt="LUCI">
    </div>
  </div>
</body>
</html>
