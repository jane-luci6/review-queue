<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUCI wallpaper — A · Quiet executive</title>
<!--
  Variant A — "Quiet executive": deep navy, vast negative space, a small full-logo +
  tagline lockup bottom-left, a faint oversized mint mark watermark upper-right, and a
  subtle mint/gold circuit texture breathing at the edges + a thin mint horizon line.
  Logo + tagline only (no sub-tagline). Futuristic but quiet.
  Render to PNG at 1920x1080 and 2560x1440 (see scripts/render-internal-team-assets.sh).
-->
<link rel="stylesheet" href="../fonts/luci-brand-fonts.css">
<link rel="stylesheet" href="_wallpaper-base.css">
<style>
  html, body { width: 1920px; height: 1080px; }
  .wallpaper { width: 1920px; height: 1080px; }

  /* circuit texture — visible at the edges, fading toward the middle */
  .lc-circuit {
    -webkit-mask-image: radial-gradient(ellipse 46% 74% at 50% 50%, transparent 0%, transparent 40%, #000 92%);
            mask-image: radial-gradient(ellipse 46% 74% at 50% 50%, transparent 0%, transparent 40%, #000 92%);
  }
  /* soft mint glow behind the mark watermark for depth */
  .lc-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(720px 360px at 80% 22%, rgba(104,227,190,0.10), transparent 70%);
    pointer-events: none;
  }
  .lc-mark-wm {
    top: 96px;
    right: 96px;
    width: 560px;
    height: auto;
  }
  .lc-horizon { bottom: 132px; }

  .lc-lockup {
    position: absolute;
    left: 120px;
    bottom: 132px;
    z-index: 2;
  }
  .lc-lockup .lc-tagline { font-size: 34px; max-width: 560px; }

  .lc-vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 320px 60px rgba(0,0,0,0.55);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="wallpaper">
    <div class="lc-circuit" aria-hidden="true"></div>
    <div class="lc-glow" aria-hidden="true"></div>
    <img class="lc-mark-wm" src="../logos/luci-mark-mint.png" alt="" aria-hidden="true">
    <div class="lc-horizon" aria-hidden="true"></div>
    <div class="lc-vignette" aria-hidden="true"></div>
    <div class="lc-lockup">
      <img class="lc-logo" src="../logos/luci-full-mintmark-white.png" alt="LUCI">
      <div class="lc-rule" aria-hidden="true"></div>
      <p class="lc-tagline">The <em>Orchestration Engine</em><br>for Enterprise Multimedia</p>
    </div>
  </div>
</body>
</html>
