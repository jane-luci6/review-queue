<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Response handling after a prospect raises a hand</title>
  <desc id="desc">Warm and net-new prospects receive an immediate response, then remain with Sales until Mark or Mike explicitly hands them back to Marketing.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2b9e80"/></marker>
    <style>
      .title{font:700 26px 'Space Grotesk',Arial,sans-serif;fill:#1C2B33}
      .lane{font:700 17px 'Space Grotesk',Arial,sans-serif;fill:#1C2B33}
      .head{font:700 13px 'Space Grotesk',Arial,sans-serif;fill:#1C2B33}
      .label{font:700 10px 'Space Grotesk',Arial,sans-serif;fill:#49616E;letter-spacing:.45px}
      .body{font:400 10.8px Inter,Arial,sans-serif;fill:#354F5C}
      .box{fill:#F5F8FA;stroke:#DBE1E4;stroke-width:1.5}
      .accent{fill:#E6F5EF;stroke:#A9DCCA;stroke-width:1.5}
      .gold{fill:#FBF8EF;stroke:#CEB06E;stroke-width:1.5}
      .sales{fill:#0A161C;stroke:#0A161C;stroke-width:1.5}
      .line{stroke:#2b9e80;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .rule{stroke:#DBE1E4;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="48" y="48" class="title">Response handling after a prospect raises a hand</text>

  <text x="48" y="105" class="lane">Warm prospect responds</text>
  <rect x="48" y="124" width="160" height="104" rx="12" class="accent"/>
  <text x="64" y="151" class="head">Hand raise</text>
  <text x="64" y="176"><tspan class="label">SOURCE: </tspan><tspan class="body">Warm email</tspan></text>
  <text x="64" y="197"><tspan class="label">ACTION: </tspan><tspan class="body">Reply / book</tspan></text>
  <path d="M208 176H228" class="line"/>
  <rect x="238" y="124" width="194" height="104" rx="12" class="box"/>
  <text x="254" y="151" class="head">Immediate response</text>
  <text x="254" y="176"><tspan class="label">NOW: </tspan><tspan class="body">Acknowledge</tspan></text>
  <text x="254" y="197"><tspan class="label">WITHIN 1D: </tspan><tspan class="body">Mark follows</tspan></text>
  <path d="M432 176H452" class="line"/>
  <rect x="462" y="124" width="174" height="104" rx="12" class="sales"/>
  <text x="478" y="151" style="font:700 13px 'Space Grotesk',Arial,sans-serif;fill:#68E3BE">Sales owns</text>
  <text x="478" y="176" style="font:400 10.8px Inter,Arial,sans-serif;fill:#F5F8FA">Personal follow-up</text>
  <text x="478" y="197" style="font:400 10.8px Inter,Arial,sans-serif;fill:#A9B8BF">Automation stops</text>
  <path d="M636 176H656" class="line"/>
  <rect x="666" y="124" width="172" height="104" rx="12" class="gold"/>
  <text x="682" y="151" class="head">Explicit handback</text>
  <text x="682" y="176"><tspan class="label">WHEN: </tspan><tspan class="body">Sales is finished</tspan></text>
  <text x="682" y="197"><tspan class="label">OWNER: </tspan><tspan class="body">Mark / Mike</tspan></text>
  <path d="M838 176H858" class="line"/>
  <rect x="868" y="124" width="168" height="104" rx="12" class="box"/>
  <text x="884" y="151" class="head">Marketing recovery</text>
  <text x="884" y="176"><tspan class="label">EMAILS: </tspan><tspan class="body">1-2 maximum</tspan></text>
  <text x="884" y="197"><tspan class="label">TIMING: </tspan><tspan class="body">Provisional</tspan></text>
  <path d="M1036 176H1056" class="line"/>
  <rect x="1066" y="124" width="86" height="104" rx="12" class="box"/>
  <text x="1082" y="151" class="head">Pulse</text>
  <text x="1082" y="176" class="body">If quiet</text>

  <line x1="48" y1="266" x2="1152" y2="266" class="rule"/>
  <text x="48" y="315" class="lane">Net-new prospect requests a demo</text>
  <rect x="48" y="334" width="160" height="104" rx="12" class="accent"/>
  <text x="64" y="361" class="head">Hand raise</text>
  <text x="64" y="386"><tspan class="label">SOURCE: </tspan><tspan class="body">Form / email</tspan></text>
  <text x="64" y="407"><tspan class="label">ACTION: </tspan><tspan class="body">Demo request</tspan></text>
  <path d="M208 386H228" class="line"/>
  <rect x="238" y="334" width="194" height="104" rx="12" class="box"/>
  <text x="254" y="361" class="head">Immediate response</text>
  <text x="254" y="386"><tspan class="label">NOW: </tspan><tspan class="body">Confirm + calendar</tspan></text>
  <text x="254" y="407"><tspan class="label">WITHIN 1 DAY: </tspan><tspan class="body">Sales follows</tspan></text>
  <path d="M432 386H452" class="line"/>
  <rect x="462" y="334" width="174" height="104" rx="12" class="sales"/>
  <text x="478" y="361" style="font:700 13px 'Space Grotesk',Arial,sans-serif;fill:#68E3BE">Sales owns</text>
  <text x="478" y="386" style="font:400 10.8px Inter,Arial,sans-serif;fill:#F5F8FA">Schedule / demo</text>
  <text x="478" y="407" style="font:400 10.8px Inter,Arial,sans-serif;fill:#A9B8BF">Automation stops</text>
  <path d="M636 386H656" class="line"/>
  <rect x="666" y="334" width="172" height="104" rx="12" class="gold"/>
  <text x="682" y="361" class="head">Explicit handback</text>
  <text x="682" y="386"><tspan class="label">AFTER: </tspan><tspan class="body">Final attempt</tspan></text>
  <text x="682" y="407"><tspan class="label">STATUS: </tspan><tspan class="body">Nurture-ready</tspan></text>
  <path d="M838 386H858" class="line"/>
  <rect x="868" y="334" width="168" height="104" rx="12" class="box"/>
  <text x="884" y="361" class="head">Marketing recovery</text>
  <text x="884" y="386"><tspan class="label">PATH: </tspan><tspan class="body">Two recovery tracks</tspan></text>
  <text x="884" y="407"><tspan class="label">EMAILS: </tspan><tspan class="body">1-2 maximum</tspan></text>
  <path d="M1036 386H1056" class="line"/>
  <rect x="1066" y="334" width="86" height="104" rx="12" class="box"/>
  <text x="1082" y="361" class="head">Pulse</text>
  <text x="1082" y="386" class="body">If quiet</text>
</svg>
