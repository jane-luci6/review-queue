# Internal Marketing Portal — container nginx (Phase 1 static parity with .37)
# Serves the built ui_kits/review/ bundle on port 8081.

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /stakeholder-review.html               { rewrite ^ /internal-portal/index.html last; }
    location = /stakeholder-review-webflow-embed.html { rewrite ^ /internal-portal/index.html last; }
    location = /review-board.html                     { rewrite ^ /internal-portal/index.html last; }
    location = /review-portal.html                    { rewrite ^ /internal-portal/index.html last; }
    location = /resources-hub-home-prototype.html     { rewrite ^ /internal-portal/index.html last; }

    # Comment/approval sync API — proxied same-origin to the comments_api container.
    # Portal JS calls /api/comments (GET / POST); nginx forwards to python:8090.
    location /api/comments {
        proxy_pass http://comments_api:8090/api/comments;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map|pdf|docx|md)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~* \.json$ {
        add_header Cache-Control "no-store" always;
    }

    add_header X-Content-Type-Options nosniff always;
    server_tokens off;
}
