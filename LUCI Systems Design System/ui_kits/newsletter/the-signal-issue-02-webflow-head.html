  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Signal — Issue 02 · July 2026 · LUCI Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    :root {
      /* Brand palette */
      --navy-deep:   #0A161C;
      --navy:        #10232D;
      --navy-mid:    #314955;
      --navy-muted:  #49616E;
      --mint:        #68E3BE;
      --mint-rgb:    104, 227, 190;   /* same as --mint, used for rgba() tints */
      --mint-dark:   #2b9e80;
      --sand:        #E5E3DF;
      --off-white:   #F5F8FA;
      --white:       #FFFFFF;
      --rule-light:  #D4D9DC;

      /* Type */
      --display: 'Syncopate', 'Arial Black', sans-serif;
      --body:    'Space Grotesk', 'Trebuchet MS', sans-serif;

      /* Layout */
      --max:  820px;
      --pad:  clamp(28px, 6vw, 60px);
      --read: 60ch;
    }

    body {
      font-family: var(--body);
      background: var(--navy-deep);
      color: #354F5C;
      -webkit-font-smoothing: antialiased;
      font-size: 18px;
      line-height: 1.72;
    }

    .issue {
      max-width: var(--max);
      margin: 0 auto;
      background: var(--white);
    }

    /* ── MASTHEAD ─────────────────────────────────────── */
    .masthead {
      background: var(--navy);
      padding: var(--pad);
      position: relative;
      overflow: hidden;
    }

    /* Mint accent bar at bottom */
    .masthead::after {
      content: '';
      display: block;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: var(--mint);
    }

    .masthead__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: clamp(20px, 3vw, 28px);
      margin-bottom: clamp(20px, 3vw, 28px);
      border-bottom: 1px solid rgba(var(--mint-rgb), 0.15);
    }

    .masthead__logo img { height: 28px; display: block; }

    .masthead__vol {
      font-size: 12px;
      font-weight: 500;
      color: rgba(165,179,188,0.82);
      letter-spacing: 0.05em;
      text-align: right;
    }

    /* Publication title — the hero */
    .masthead__title {
      font-family: var(--display);
      text-transform: uppercase;
      font-size: clamp(52px, 12vw, 96px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.03em;
      color: var(--off-white);
      position: relative;
      z-index: 1;
    }

    .masthead__title em {
      font-style: normal;
      color: var(--mint);
      display: block;
    }

    /* Giant issue number watermark */
    .masthead__numeral {
      font-family: var(--display);
      font-size: clamp(100px, 22vw, 200px);
      font-weight: 700;
      line-height: 0.85;
      letter-spacing: -0.04em;
      color: rgba(var(--mint-rgb), 0.05);
      position: absolute;
      right: calc(var(--pad) - 8px);
      bottom: -12px;
      pointer-events: none;
      user-select: none;
    }

    .masthead__deck {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(165, 179, 188, 0.7);
      max-width: 44ch;
      position: relative;
      z-index: 1;
    }

    .masthead__issue {
      margin-top: 30px;
      position: relative;
      z-index: 1;
    }

    .masthead__issue-label {
      display: block;
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 8px;
    }

    .masthead__issue-title {
      display: block;
      font-family: var(--body);
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.015em;
      color: var(--off-white);
      max-width: 42ch;
    }

    .masthead__distro {
      display: inline-block;
      margin-top: 18px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mint);
      border: 1px solid rgba(var(--mint-rgb), 0.4);
      padding: 4px 10px;
      position: relative;
      z-index: 1;
    }

    /* ── TABLE OF CONTENTS ────────────────────────────── */
    .toc {
      background: var(--navy);
      padding: clamp(28px, 5vw, 38px) var(--pad);
      border-bottom: 1px solid rgba(var(--mint-rgb), 0.15);
    }

    .toc__label {
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 14px;
    }

    .toc__list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      column-gap: 36px;
    }

    @media (max-width: 600px) {
      .toc__list { grid-template-columns: 1fr; }
    }

    .toc__list a {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 13px 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      color: var(--off-white);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.3;
      transition: color 0.15s, border-color 0.15s;
    }

    .toc__num {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--mint);
      min-width: 22px;
    }

    .toc__text { flex: 1; }

    .toc__arrow {
      color: rgba(var(--mint-rgb), 0.4);
      transition: transform 0.15s, color 0.15s;
    }

    .toc__list a:hover {
      color: var(--white);
      border-color: rgba(var(--mint-rgb), 0.4);
    }

    .toc__list a:hover .toc__arrow {
      color: var(--mint);
      transform: translateX(3px);
    }

    /* ── SECTION ANATOMY ──────────────────────────────── */

    /*
      Each section has a kicker (department label), a headline, and body.
      Visual registers (alternate to keep the reader moving — reserve deep/dark for Closing + Footer only):
        --sand:     marquee story (In the field) — warm light; transitions cleanly from dark TOC
        --white:    primary reading sections; required wrapper for callouts
        --light:    alternate reading sections (off-white)
        --deep:     Closing only — signals end of issue content
    */

    .sec {
      padding: clamp(40px, 6vw, 64px) var(--pad);
      border-bottom: 1px solid var(--rule-light);
      position: relative;
    }

    .sec--white   { background: var(--white); }
    .sec--light   { background: var(--off-white); }
    .sec--sand    { background: var(--sand); }
    .sec--mid     { background: var(--navy-mid); border-bottom-color: rgba(0,0,0,0.2); }
    .sec--dark    { background: var(--navy); border-bottom-color: rgba(0,0,0,0.3); }
    .sec--deep    { background: var(--navy-deep); border-bottom-color: rgba(0,0,0,0.4); }

    /* Marquee — lead story (In the field). Warm sand + scaled headline; no dark grey block after TOC. */
    .sec--marquee {
      background: var(--sand);
    }

    .sec--marquee .art-title {
      font-size: clamp(30px, 5vw, 42px);
      max-width: 24ch;
      color: var(--navy);
    }

    .sec--marquee .kicker__rule { background: var(--mint-dark); }
    .sec--marquee .kicker__label { color: var(--mint-dark); }

    .sec--marquee .field-property {
      border-bottom-color: var(--rule-light);
    }

    .sec--marquee .field-property__name,
    .sec--marquee .field-property__location {
      color: var(--mint-dark);
    }

    .sec--marquee .field-story__block {
      border-bottom-color: var(--rule-light);
    }

    .sec--marquee .field-story__heading {
      color: var(--mint-dark);
    }

    .sec--marquee .field-story__block p,
    .sec--marquee .field-story-list li,
    .sec--marquee .field-plan-list li {
      color: #354F5C;
    }

    .sec--marquee .field-plan-list strong {
      color: var(--navy);
    }

    .sec--marquee .field-results li {
      border-bottom-color: var(--rule-light);
      color: #354F5C;
    }

    .sec--marquee .field-results li::before {
      color: var(--mint-dark);
    }

    .sec--marquee .field-story-list li::before {
      background: var(--mint-dark);
    }

    .sec--marquee .field-story__cta {
      border-top-color: var(--rule-light);
    }

    .sec--marquee .field-story__cta p {
      color: #49616E;
    }

    .sec--marquee .pullquote {
      color: var(--navy);
    }

    .sec--marquee .quote-attrib__title,
    .sec--marquee .quote-attrib__location {
      color: var(--mint-dark);
    }

    /* Pullquote on light (A Minute with Mike) */
    .sec--white .pullquote,
    .sec--light .pullquote {
      color: var(--navy);
      border-left-color: var(--mint-dark);
    }

    /* Department kicker — centered section label */
    .kicker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 24px;
    }

    .kicker__rule {
      width: 28px;
      height: 2px;
      background: var(--mint);
      flex-shrink: 0;
    }

    .kicker__label {
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mint);
    }

    .sec--white .kicker__rule,
    .sec--light .kicker__rule {
      background: var(--mint-dark);
    }

    .sec--white .kicker__label,
    .sec--light .kicker__label {
      color: var(--mint-dark);
    }

    /* Article headline */
    .art-title {
      font-family: var(--body);
      font-weight: 700;
      font-size: clamp(26px, 4.5vw, 38px);
      line-height: 1.1;
      letter-spacing: -0.025em;
      max-width: 22ch;
      margin-bottom: 20px;
    }

    .art-deck {
      font-family: var(--body);
      font-weight: 500;
      font-size: clamp(17px, 2.2vw, 20px);
      line-height: 1.5;
      letter-spacing: -0.005em;
      color: #49616E;
      max-width: var(--read);
      margin: 0 0 24px;
    }

    .sec--mid .art-deck,
    .sec--dark .art-deck,
    .sec--deep .art-deck { color: rgba(235, 245, 248, 0.78); }

    .sec--white .art-title,
    .sec--light .art-title  { color: var(--navy); }
    .sec--mid .art-title    { color: var(--off-white); }
    .sec--dark .art-title   { color: var(--off-white); }
    .sec--deep .art-title   { color: var(--off-white); }

    /* Body copy */
    .art-body p {
      font-size: 17px;
      line-height: 1.72;
      margin-bottom: 16px;
      max-width: var(--read);
    }

    .art-body p:last-child { margin-bottom: 0; }

    .art-signoff {
      margin-top: 32px;
      max-width: var(--read);
    }
    .art-signoff__line {
      font-size: 17px;
      line-height: 1.72;
      color: #354F5C;
      margin-bottom: 18px;
    }
    .art-signoff__name {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--navy);
    }
    .art-signoff__role {
      margin-top: 4px;
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mint-dark);
    }

    .sec--white .art-body p,
    .sec--light .art-body p { color: #354F5C; }

    .sec--mid .art-body p { color: rgba(235, 245, 248, 0.88); }
    .sec--dark .art-body p { color: rgba(235, 245, 248, 0.92); }
    .sec--deep .art-body p { color: rgba(235, 245, 248, 0.88); }

    .art-body ul, .art-body ol {
      margin: 0 0 16px 20px;
      max-width: var(--read);
    }

    .art-body li {
      font-size: 17px;
      line-height: 1.65;
      margin-bottom: 10px;
    }

    .sec--white .art-body li,
    .sec--light .art-body li { color: #354F5C; }
    .sec--mid .art-body li,
    .sec--dark .art-body li,
    .sec--deep .art-body li  { color: rgba(235, 245, 248, 0.88); }

    .art-body li::marker { color: var(--mint); }
    .sec--white .art-body li::marker { color: var(--mint-dark); }

    .art-body strong { color: inherit; font-weight: 700; }

    .sec--dark .art-body strong,
    .sec--mid .art-body strong,
    .sec--deep .art-body strong { color: var(--off-white); }

    /* Links */
    .art-body a { color: var(--mint-dark); font-weight: 600; }
    .sec--dark .art-body a,
    .sec--mid .art-body a,
    .sec--deep .art-body a { color: var(--mint); }

    /* ── CALLOUT (contained aside — Quick Tip, Support) ── */
    .callout {
      background: var(--navy);
      border-left: 4px solid var(--mint);
      padding: clamp(24px, 4vw, 32px);
      max-width: var(--read);
    }

    .callout__kicker {
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 14px;
    }

    .callout p {
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .callout p:last-child { margin-bottom: 0; }

    .callout strong { color: var(--off-white); font-weight: 700; }

    .callout a { color: var(--mint); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

    .callout p { color: rgba(235, 245, 248, 0.95); }

    /* ── NEED A HAND — full-width callout banner (own sand band, formatted header — no section kicker) ── */
    .need-hand { padding: clamp(32px, 5vw, 44px) var(--pad); }
    .need-hand__inner {
      border-left: 4px solid var(--mint-dark);
      padding-left: 24px;
    }
    .need-hand__header {
      font-family: var(--body);
      font-size: clamp(22px, 2.4vw, 26px);
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.15;
      color: var(--navy);
      margin-bottom: 10px;
    }
    .need-hand__lead {
      font-size: 17px;
      line-height: 1.6;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .need-hand__lead a { color: var(--mint-dark); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .need-hand__sub {
      font-size: 15px;
      line-height: 1.6;
      color: #49616E;
    }

    .callout__figure {
      margin: 20px 0 16px;
      max-width: var(--read);
    }

    .callout__figure img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid rgba(104, 227, 190, 0.18);
    }

    .callout__caption {
      font-size: 13px;
      line-height: 1.45;
      color: rgba(235, 245, 248, 0.65);
      margin-top: 8px;
    }

    /* ── PULL QUOTE ───────────────────────────────────── */
    .pullquote {
      margin: 32px 0 8px;
      font-size: clamp(19px, 2.8vw, 24px);
      font-style: italic;
      line-height: 1.45;
      color: var(--off-white);
      border-left: 4px solid var(--mint);
      padding: 16px 0 16px 24px;
      max-width: 32ch;
    }

    /* ── Wide pullquote variant (Tachi field quote — full width, smaller) ── */
    .pullquote--wide {
      max-width: none;
      font-size: clamp(15px, 1.7vw, 18px);
      line-height: 1.6;
      padding: 14px 0 14px 22px;
      margin: 28px 0 10px;
    }

    /* ── ONE TRAIL — centered statement moment (light) ── */
    .trail-statement {
      max-width: var(--read);
      margin: 32px 0;
      border-left: 4px solid var(--mint-dark);
      background: linear-gradient(155deg, #E6F5EF 0%, #F3FAF8 100%);
      padding: 22px 26px;
      box-shadow: inset 0 0 0 1px rgba(43,158,128,0.14);
    }
    .trail-statement__rule { display: none; }
    .trail-statement__kicker {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mint-dark);
      margin-bottom: 12px;
    }
    .trail-statement__body {
      font-size: 17px;
      line-height: 1.65;
      color: #354F5C;
    }
    .trail-statement__body strong { color: var(--navy); font-weight: 700; }

    /* ── TOPIC FIGURE — recall model diagram (A Minute with Mike) ── */
    .topic-figure {
      max-width: 680px;
      margin: 28px auto 8px;
      padding: 18px 0 20px;
      border-top: 1px solid rgba(43,158,128,0.18);
      border-bottom: 1px solid rgba(43,158,128,0.18);
      text-align: center;
    }
    .topic-figure__label {
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mint-dark);
      margin: 0 0 10px;
    }
    .topic-figure__svg {
      display: block;
      width: 100%;
      max-width: 480px;
      height: auto;
      margin: 0 auto;
    }
    .topic-figure__cap {
      font-family: var(--body);
      font-size: 13px;
      line-height: 1.55;
      color: #5C717B;
      margin: 12px auto 0;
      max-width: 460px;
    }

    /* ── THE PAYOFF — result statement (mint top rule, larger navy) ── */
    .payoff-statement {
      max-width: var(--read);
      margin: 32px 0;
      border-top: 3px solid var(--mint);
      padding-top: 18px;
    }
    .payoff-statement__kicker {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mint-dark);
      margin-bottom: 12px;
    }
    .payoff-statement__body {
      font-size: clamp(19px, 2.4vw, 23px);
      line-height: 1.5;
      font-weight: 600;
      color: var(--navy);
      letter-spacing: -0.01em;
    }

    /* ── IN THE FIELD: property header ───────────────── */
    .field-property {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(var(--mint-rgb), 0.15);
    }

    .field-property__logo {
      flex-shrink: 0;
      background: var(--white);
      padding: 10px 14px;
      line-height: 0;
    }

    .field-property__logo img {
      height: 32px;
      width: auto;
      display: block;
    }

    .field-property__name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mint);
      line-height: 1.5;
    }

    .field-property__location {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--mint);
      margin-top: 4px;
      text-transform: none;
    }

    @media (max-width: 480px) {
      .field-property { flex-direction: column; align-items: flex-start; }
    }

    /* ── IN THE FIELD: story stack ───────────────────── */
    .field-story {
      display: flex;
      flex-direction: column;
      margin-top: 8px;
    }

    .field-story__block {
      padding: 26px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .field-story__block:first-child { padding-top: 0; }
    .field-story__block:last-child { border-bottom: none; padding-bottom: 0; }

    .field-story__block--accent {
      background: transparent;
    }

    .field-story__heading {
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 16px;
    }

    .field-story__block p {
      font-size: 16px;
      line-height: 1.68;
      color: rgba(235, 245, 248, 0.88);
      margin-bottom: 14px;
      max-width: none;
    }

    .field-story__block p:last-child { margin-bottom: 0; }

    /* Inline bullet list inside The Story */
    .field-story-list {
      list-style: none;
      margin: 0 0 16px 0;
      padding: 0;
    }

    .field-story-list li {
      position: relative;
      padding-left: 22px;
      font-size: 16px;
      line-height: 1.55;
      color: rgba(235, 245, 248, 0.88);
      margin-bottom: 10px;
    }

    .field-story-list li:last-child { margin-bottom: 14px; }

    .field-story-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 11px;
      width: 10px;
      height: 2px;
      background: var(--mint);
    }

    /* The Plan: two forward-looking outcomes */
    .field-plan-list {
      list-style: none;
      margin: 18px 0 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .field-plan-list li {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 14px;
      font-size: 16px;
      line-height: 1.65;
      color: rgba(235, 245, 248, 0.88);
    }

    .field-plan-list li::before {
      content: '\2713';
      font-size: 20px;
      font-weight: 700;
      color: var(--mint);
      line-height: 1.3;
    }

    .field-plan-list strong {
      color: var(--off-white);
      font-weight: 700;
      margin-right: 4px;
    }

    /* Results: airy two-column rows, hairline-separated */
    .field-results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 32px;
      list-style: none;
      margin: 0;
      padding: 0;
      counter-reset: result;
    }

    @media (max-width: 480px) {
      .field-results { grid-template-columns: 1fr; }
    }

    .field-results li {
      display: flex;
      gap: 12px;
      align-items: baseline;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 15px;
      line-height: 1.45;
      color: rgba(235, 245, 248, 0.92);
      margin: 0;
    }

    .field-results li::before {
      content: counter(result, decimal-leading-zero);
      counter-increment: result;
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--mint);
      min-width: 22px;
    }

    .field-story__cta {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(var(--mint-rgb), 0.15);
    }

    .field-story__cta p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(235, 245, 248, 0.75);
      margin-bottom: 16px;
      max-width: none;
    }

    .field-story__cta a.field-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--body);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: var(--navy);
      background: var(--mint);
      padding: 16px 26px;
      transition: background 0.15s;
    }

    .field-story__cta a.field-cta-btn:hover {
      background: #7aedc8;
      color: var(--navy);
    }

    .field-cta-btn__arrow {
      font-family: var(--body);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }

    /* ── IN THE FIELD: onsite photos (editorial) ─────── */
    .field-photo {
      margin: 24px 0;
    }

    .field-photo img,
    .field-photo video {
      width: 100%;
      height: auto;
      display: block;
    }

    .field-photo--hero {
      margin: 0 0 28px;
    }

    .field-photo__caption {
      font-family: var(--body);
      font-size: 13px;
      line-height: 1.45;
      color: rgba(53, 79, 92, 0.72);
      margin-top: 8px;
      max-width: 52ch;
    }

    .field-photo-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 24px 0;
    }

    .field-photo-row .field-photo {
      margin: 0;
    }

    @media (max-width: 640px) {
      .field-photo-row { grid-template-columns: 1fr; }
    }

    .field-video {
      margin: 28px 0;
    }

    .field-video video {
      background: var(--navy-deep);
    }

    .field-property--text-only .field-property__logo {
      display: none;
    }

    /* ── IN THE FIELD: cinematic story components ────── */
    .field-bleed { margin-inline: calc(var(--pad) * -1); }

    .field-cinematic {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      object-position: center;
    }
    .field-cinematic--hero   { aspect-ratio: 2 / 1; }
    .field-cinematic--wide   { aspect-ratio: 16 / 9; }
    .field-cinematic--pano   { aspect-ratio: 3453 / 1023; }
    .field-cinematic--square { aspect-ratio: 1 / 1; }
    .field-cinematic--tall   { aspect-ratio: 4 / 5; }

    .field-opener {
      text-align: center;
      padding: 8px 0 6px;
      margin: 6px 0 18px;
    }
    .field-opener__logo {
      height: 132px;
      width: auto;
      margin: 0 auto 16px;
      display: block;
    }
    .field-opener__where {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mint-dark);
      margin-bottom: 12px;
    }
    .field-opener__title {
      font-family: var(--body);
      font-weight: 700;
      font-size: clamp(34px, 6.2vw, 52px);
      line-height: 1.04;
      letter-spacing: -0.025em;
      color: var(--navy);
      max-width: 16ch;
      margin: 0 auto;
    }
    @media (max-width: 640px) {
      .field-opener__logo { height: 104px; }
    }

    .field-hook { margin-bottom: 22px; }
    .field-hook p {
      font-size: 19px;
      line-height: 1.6;
      font-weight: 500;
      color: var(--navy);
      max-width: var(--read);
    }

    .field-stats {
      background: var(--navy);
      padding: clamp(22px, 3.5vw, 32px) var(--pad);
      margin-block: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .field-stats__item { display: flex; flex-direction: column; gap: 8px; }
    .field-stats__num {
      font-family: var(--body);
      font-weight: 700;
      font-size: clamp(40px, 6vw, 64px);
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--mint);
    }
    .field-stats__label {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.02em;
      color: rgba(235,245,248,0.82);
    }
    @media (max-width: 640px) {
      .field-stats { grid-template-columns: repeat(3, 1fr); gap: 20px; }
    }

    .field-act {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 34px 0 18px;
    }
    .field-act__num {
      font-family: var(--display);
      font-weight: 700;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: rgba(43,158,128,0.35);
    }
    .field-act__label {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mint-dark);
    }
    .field-act__rule {
      flex: 1;
      height: 3px;
      max-width: 120px;
      background: var(--mint-dark);
      opacity: 0.25;
    }

    .field-figure { margin: 16px 0; }
    .field-figure__caption {
      font-family: var(--body);
      font-size: 13px;
      line-height: 1.45;
      color: rgba(53,79,92,0.72);
      margin-top: 8px;
      max-width: 52ch;
    }
    .field-figure.field-bleed .field-figure__caption { padding-inline: var(--pad); }
    .field-figure__caption--dark { color: rgba(235,245,248,0.72); }
    .field-tag {
      font-family: var(--display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mint-dark);
      margin-right: 8px;
    }

    .field-figure--annot { max-width: 640px; margin: 18px 0 22px; }
    .field-figure--annot .field-cinematic {
      border: 1px solid rgba(26,39,51,0.10);
      box-sizing: border-box;
    }
    .field-figure--annot .field-figure__caption { max-width: 46ch; }
    @media (max-width: 640px) {
      .field-figure--annot { max-width: 100%; }
    }

    .field-team-collage { max-width: 620px; margin: 18px 0 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field-team-collage img { aspect-ratio: 4 / 3; }
    @media (max-width: 640px) {
      .field-team-collage { grid-template-columns: 1fr; }
    }

    .field-compare--static {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 24px 0;
      max-width: 720px;
    }
    .field-compare--static .field-figure { margin: 0; }
    @media (max-width: 640px) {
      .field-compare--static { grid-template-columns: 1fr; }
    }

    .field-reel {
      background: var(--navy-deep);
      padding: clamp(16px, 2.5vw, 26px) var(--pad);
      margin-block: 22px;
    }
    .field-reel video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }
    .field-reel .field-figure__caption { padding-inline: 0; }

    .field-slider {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      --pos: 50%;
    }
    .field-slider__img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .field-slider__before {
      position: absolute;
      inset: 0;
      clip-path: inset(0 calc(100% - var(--pos)) 0 0);
    }
    .field-slider__divider {
      position: absolute;
      top: 0; bottom: 0;
      left: var(--pos);
      width: 2px;
      background: var(--mint);
      transform: translateX(-1px);
      pointer-events: none;
    }
    .field-slider__handle {
      position: absolute;
      top: 50%; left: 50%;
      width: 44px; height: 44px;
      transform: translate(-50%, -50%);
      border-radius: 9999px;
      background: var(--mint);
      box-shadow: 0 2px 12px rgba(0,0,0,0.45);
      display: grid;
      place-items: center;
    }
    .field-slider__handle::before {
      content: "\2039\2003\203A";
      color: var(--navy);
      font-weight: 700;
      font-size: 16px;
    }
    .field-slider__tag {
      position: absolute;
      top: 16px;
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--off-white);
      background: rgba(10,22,28,0.6);
      padding: 4px 10px;
      transition: opacity .2s ease;
    }
    .field-slider__tag--before { left: 16px; }
    .field-slider__tag--after  { right: 16px; }
    .field-slider__range {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: ew-resize;
    }
    .field-slider:focus-within .field-slider__handle {
      outline: 3px solid var(--off-white);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .field-slider__divider { transition: none; }
    }


    .quote-attrib {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-left: 28px;
      line-height: 1.6;
    }

    .quote-attrib__title,
    .quote-attrib__location {
      display: block;
      color: var(--mint);
    }

    .quote-attrib__location {
      margin-top: 2px;
    }

    /* ── AUTHOR CARD (de-boxed) ───────────────────────── */
    .author-card {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--rule-light);
      max-width: var(--read);
    }

    .author-card__header {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--mint-dark);
      font-family: var(--body);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: none;
    }

    .author-card__header:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .author-card__content {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      padding: 0;
    }

    @media (max-width: 500px) {
      .author-card__content { flex-direction: column; align-items: center; }
    }

    .author-card__img {
      flex-shrink: 0;
      width: 80px;
      height: 80px;
      overflow: hidden;
      background: var(--sand);
    }

    .author-card__img img {
      display: block;
      width: 80px;
      height: 80px;
      object-fit: cover;
      object-position: center 10%;
      filter: saturate(0.85) brightness(1.05) contrast(0.95);
    }

    .author-card__body { flex: 1; min-width: 0; }

    .author-card__name {
      font-weight: 700;
      font-size: 16px;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .author-card__title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mint-dark);
      margin-bottom: 10px;
    }

    .author-card__contact {
      font-size: 14px;
      color: #49616E;
    }

    .author-card__contact a { color: var(--mint-dark); font-weight: 600; }

    /* ── SERVICES (de-boxed definition list) ──────────── */
    .svc-list {
      margin: 28px 0;
    }

    .svc-list > div {
      padding: 22px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .svc-list > div:first-child { padding-top: 0; }
    .svc-list > div:last-child { border-bottom: none; padding-bottom: 0; }

    .svc-list dt {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--mint);
      margin-bottom: 7px;
    }

    .svc-list dd {
      margin: 0;
      font-size: 15px;
      line-height: 1.62;
      color: rgba(235, 245, 248, 0.86);
    }

    /* Services list on light/white sections (Beyond the platform) */
    .sec--white .svc-list > div,
    .sec--light .svc-list > div {
      border-bottom-color: var(--rule-light);
    }

    .sec--white .svc-list dt,
    .sec--light .svc-list dt {
      color: var(--mint-dark);
    }

    .sec--white .svc-list dd,
    .sec--light .svc-list dd {
      color: #354F5C;
    }

    /* ── INSIDE LUCI (mint-accent white section) ─── */
    .playbook-accent {
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      bottom: 0;
      background: linear-gradient(to bottom, var(--mint) 0%, transparent 100%);
    }

    .steps {
      list-style: none;
      margin: 20px 0;
      counter-reset: step;
      max-width: var(--read);
    }

    .steps li {
      counter-increment: step;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }

    .steps li::before {
      content: counter(step, decimal-leading-zero);
      font-family: var(--display);
      font-size: 13px;
      font-weight: 700;
      color: var(--mint-dark);
      flex-shrink: 0;
      padding-top: 3px;
      min-width: 28px;
    }

    .steps li p { margin: 0; font-size: 17px; color: #354F5C; }

    /* ── COMMAND TRAIL (August release feature) ──── */
    .feature-lockup {
      max-width: 760px;
      margin: 24px 0 8px;
      padding-top: 16px;
      border-top: 2px solid var(--mint-dark);
    }
    .feature-lockup__tag {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mint-dark);
      margin-bottom: 12px;
    }
    .feature-lockup__hook {
      font-family: var(--body);
      font-weight: 700;
      font-size: clamp(22px, 3vw, 28px);
      line-height: 1.2;
      letter-spacing: -0.015em;
      color: var(--navy);
      max-width: 40ch;
      margin-bottom: 14px;
    }
    .feature-lockup__deck {
      font-size: 17px;
      line-height: 1.65;
      color: #49616E;
      max-width: var(--read);
    }

    .article-head {
      max-width: 1080px;
      margin: 0 0 8px;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 48px;
      align-items: center;
    }
    .article-head__text { min-width: 0; }
    .article-head__art { min-width: 0; }
    .article-head__art svg { width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto; }
    @media (max-width: 860px) {
      .article-head { grid-template-columns: 1fr; gap: 24px; }
      .article-head__art { max-width: 360px; }
      .article-head--art-wide .article-head__art svg { width: 100%; max-width: 360px; margin: 0 auto; }
    }
    .article-head--art-wide { grid-template-columns: 1.35fr 1fr; }
    .article-head--art-wide .article-head__art { overflow: visible; }
    .article-head--art-wide .article-head__art svg { width: 130%; max-width: none; margin: 0 0 0 -40px; }

    /* Portrait art — column hugs the bulb, header gets the rest of the width */
    .article-head--mike { grid-template-columns: 1fr auto; }
    .article-head--mike .article-head__art svg { width: 200px; max-width: none; height: auto; }

    /* ── 3-PART PROCESS FLOW (Minute with Mike) ──── */
    .flow--3 {
      list-style: none;
      margin: 28px 0;
      padding: 0;
      max-width: 1080px;
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: start;
      gap: 0 8px;
    }
    .flow__step {
      padding-top: 16px;
      border-top: 1px solid var(--rule-light);
      min-width: 0;
    }
    .flow__num {
      display: block;
      font-family: var(--display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--mint-dark);
      margin-bottom: 14px;
    }
    .flow__num::after {
      content: '';
      display: block;
      width: 28px;
      height: 2px;
      margin-top: 8px;
      background: #CEB06E;
    }
    .flow__label {
      font-family: var(--body);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.015em;
      color: #1A1A1A;
      margin: 0 0 8px;
    }
    .flow__body {
      font-size: 15px;
      line-height: 1.6;
      color: #354F5C;
      margin: 0;
    }
    .flow__arrow {
      align-self: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2px;
    }
    .flow__arrow-art { width: 56px; height: 34px; display: block; }
    @media (max-width: 860px) {
      .flow--3 { grid-template-columns: 1fr; gap: 10px; }
      .flow__step { padding-top: 12px; }
      .flow__arrow { transform: rotate(90deg); justify-self: center; padding: 0; margin: -6px 0; }
      .flow__arrow-art { width: 44px; height: 26px; }
    }

    .trail-grid {
      max-width: 760px;
      margin: 32px 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .trail-card {
      padding-top: 16px;
      border-top: 1px solid var(--rule-light);
    }
    .trail-card__label {
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mint-dark);
      margin-bottom: 10px;
    }
    .trail-card__body {
      font-size: 15px;
      line-height: 1.6;
      color: #354F5C;
    }
    .trail-card__icon {
      display: block;
      margin-bottom: 14px;
      color: var(--mint-dark);
    }
    @media (max-width: 640px) {
      .trail-grid { grid-template-columns: 1fr; gap: 20px; }
    }

    /* ── PLAY CARDS (playbook steps + Mike principles) ──── */
    .play-cards {
      max-width: 760px;
      margin: 28px 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .play-cards--pair { grid-template-columns: repeat(2, 1fr); }
    .play-card {
      padding-top: 16px;
      border-top: 1px solid var(--rule-light);
    }
    .play-card__num {
      font-family: var(--display);
      font-size: 13px;
      font-weight: 700;
      color: var(--mint-dark);
      margin-bottom: 8px;
    }
    .play-card__label {
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mint-dark);
      margin-bottom: 10px;
    }
    .play-card__body {
      font-size: 15px;
      line-height: 1.6;
      color: #354F5C;
    }
    @media (max-width: 640px) {
      .play-cards, .play-cards--pair { grid-template-columns: 1fr; gap: 20px; }
    }

    /* Play cards on dark — circuit-textured navy panels (Set a revert preset) */
    .sec--dark .play-card {
      background:
        linear-gradient(180deg, rgba(16,35,45,0.70), rgba(10,22,28,0.84)),
        url("assets/textures/texture-circuit-navy-steel.png");
      background-repeat: repeat;
      background-size: 420px;
      border: 1px solid rgba(104, 227, 190, 0.18);
      padding: 18px 18px 20px;
    }
    .sec--dark .play-card__num { color: var(--mint); }
    .sec--dark .play-card__label { color: var(--mint); }
    .sec--dark .play-card__body { color: rgba(235, 245, 248, 0.88); }

    /* Author card on dark (A Minute with Mike sign-off) */
    .sec--dark .author-card { border-top-color: rgba(255, 255, 255, 0.12); }
    .sec--dark .author-card__name { color: var(--off-white); }
    .sec--dark .author-card__title { color: var(--mint); }

    /* The payoff on dark — circuit-textured navy panel, mint top rule */
    .sec--dark .payoff-statement {
      background:
        linear-gradient(180deg, rgba(16,35,45,0.70), rgba(10,22,28,0.84)),
        url("assets/textures/texture-circuit-navy-steel.png");
      background-repeat: repeat;
      background-size: 420px;
      border: 1px solid rgba(104, 227, 190, 0.18);
      border-top: 3px solid var(--mint);
      padding: 18px 22px 20px;
    }
    .sec--dark .payoff-statement__kicker { color: var(--mint); }
    .sec--dark .payoff-statement__body { color: var(--off-white); }

    .callout + .art-body { margin-top: 24px; }

    /* ── DRAFT NOTE ───────────────────────────────────── */
    .draft {
      background: rgba(255, 251, 230, 0.08);
      border: 1px dashed rgba(196, 165, 116, 0.5);
      padding: 14px 18px;
      margin: 16px 0;
