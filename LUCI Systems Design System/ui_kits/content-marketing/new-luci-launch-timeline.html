<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New LUCI Launch Timeline</title>
<link rel="stylesheet" href="../../assets/fonts/luci-brand-fonts.css">
<style>
:root{--navy-deep:#0A161C;--navy-muted:#49616E;--mint-dark:#2b9e80;--gold-deep:#CEB06E;--off-white:#F5F8FA;--rule-light:#DBE1E4;--ink:#354F5C;--ink-strong:#1C2B33;--font:'Space Grotesk','Trebuchet MS',sans-serif;--font-body:'Inter','Helvetica Neue',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--off-white);color:var(--ink);padding:56px clamp(28px,6vw,72px) 72px;line-height:1.5}
.tl-kicker{font-family:var(--font);font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mint-dark);margin-bottom:14px}
.tl-title{font-family:var(--font);font-weight:700;font-size:clamp(32px,5vw,44px);line-height:1.1;letter-spacing:-.03em;color:var(--ink-strong)}
.tl-months-top{display:flex;max-width:920px;margin-top:36px}
.tl-months-top span{flex:1;text-align:center;font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-muted);padding-bottom:10px;border-bottom:1px solid var(--rule-light)}
.tl-timeline{position:relative;max-width:920px;height:140px;margin-bottom:8px;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 1px),rgba(219,225,228,.45) calc(10% - 1px),rgba(219,225,228,.45) 10%)}
.tl-line{position:absolute;left:0;right:0;top:28px;height:2px;background:var(--rule-light)}
.tl-span{position:absolute;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.tl-span--main{top:12px;height:14px;background:rgba(43,158,128,.22);color:var(--mint-dark)}
.tl-span--sub{top:36px;height:12px;background:rgba(43,158,128,.1);color:var(--navy-muted);font-size:9px}
.tl-prod{position:absolute;transform:translateX(-50%);text-align:center;z-index:2;top:28px}
.tl-prod__dot{display:block;width:16px;height:16px;border-radius:50%;background:var(--off-white);border:3px solid var(--mint-dark);margin:-8px auto 0}
.tl-prod--ga .tl-prod__dot{background:var(--gold-deep);border-color:var(--gold-deep);width:20px;height:20px;margin:-10px auto 0}
.tl-prod__label{display:block;font-family:var(--font);font-weight:700;font-size:14px;color:var(--ink-strong);margin-top:16px;line-height:1.2;max-width:14ch;margin-left:auto;margin-right:auto}
.tl-prod--ga .tl-prod__label{color:var(--gold-deep)}
.tl-prod__date{display:block;font-family:var(--font);font-weight:700;font-size:11px;color:var(--navy-muted);margin-top:4px}
.tl-arrow{position:absolute;top:12px;height:14px;display:flex;align-items:center;font-family:var(--font);font-weight:700;font-size:12px;color:var(--mint-dark);opacity:.4}
@media print{@page{size:landscape;margin:.5in}body{padding:0}}
@media(max-width:760px){.tl-timeline{height:auto}.tl-months-top{flex-wrap:wrap}.tl-months-top span{flex:0 0 33%}.tl-line,.tl-span,.tl-arrow,.tl-prod{position:static;transform:none;display:block;margin:12px 0;width:auto}}
</style>
</head>
<body>
<p class="tl-kicker">New LUCI</p>
<h1 class="tl-title">Launch Timeline</h1>
<div class="tl-months-top">
<span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span>
</div>
<div class="tl-timeline">
<div class="tl-line"></div>
<div class="tl-span tl-span--main" style="left:10%;width:14%">Stabilization</div>
<div class="tl-span tl-span--main" style="left:24%;width:26%">Release preparation</div>
<div class="tl-span tl-span--main" style="left:50%;width:45%">Rollout</div>
<div class="tl-span tl-span--sub" style="left:60%;width:35%">Post-release support</div>
<div class="tl-arrow" style="left:96%">&#8594;</div>
<div class="tl-prod" style="left:10%">
<span class="tl-prod__dot"></span>
<span class="tl-prod__label">Beta</span>
<span class="tl-prod__date">Sep 30</span>
</div>
<div class="tl-prod" style="left:24%">
<span class="tl-prod__dot"></span>
<span class="tl-prod__label">Release candidate</span>
<span class="tl-prod__date">Nov 13</span>
</div>
<div class="tl-prod tl-prod--ga" style="left:50%">
<span class="tl-prod__dot"></span>
<span class="tl-prod__label">General availability</span>
<span class="tl-prod__date">Jan 29</span>
</div>
</div>
</body>
</html>
