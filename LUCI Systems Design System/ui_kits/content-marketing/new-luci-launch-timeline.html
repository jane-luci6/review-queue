<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New LUCI Launch Timeline</title>
<link rel="stylesheet" href="../../assets/fonts/luci-brand-fonts.css">
<style>
  :root {
    --navy-deep: #0A161C; --navy-muted: #49616E;
    --mint-dark: #2b9e80; --gold-deep: #CEB06E;
    --off-white: #F5F8FA; --rule-light: #DBE1E4;
    --ink: #354F5C; --ink-strong: #1C2B33;
    --font: 'Space Grotesk', 'Trebuchet MS', sans-serif;
    --font-body: 'Inter', 'Helvetica Neue', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--off-white); color: var(--ink); padding: 56px clamp(28px,6vw,72px) 72px; line-height: 1.5; }
  .tl-kicker { font-family: var(--font); font-weight: 700; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mint-dark); margin-bottom: 14px; }
  .tl-title { font-family: var(--font); font-weight: 700; font-size: clamp(32px,5vw,44px); line-height: 1.1; letter-spacing: -0.03em; color: var(--ink-strong); }

  .tl-timeline { position: relative; max-width: 920px; margin-top: 48px; height: 160px; }
  .tl-line { position: absolute; left: 0; right: 0; top: 40px; height: 2px; background: var(--rule-light); }

  .tl-span { position: absolute; top: 33px; height: 16px; border-radius: 4px; background: rgba(43,158,128,0.22); display: flex; align-items: center; justify-content: center; font-family: var(--font); font-weight: 600; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mint-dark); }

  .tl-prod { position: absolute; transform: translateX(-50%); text-align: center; z-index: 2; top: 40px; }
  .tl-prod__dot { display: block; width: 16px; height: 16px; border-radius: 50%; background: var(--off-white); border: 3px solid var(--mint-dark); margin: -8px auto 0; }
  .tl-prod--ga .tl-prod__dot { background: var(--gold-deep); border-color: var(--gold-deep); width: 20px; height: 20px; margin: -10px auto 0; }
  .tl-prod__label { display: block; font-family: var(--font); font-weight: 700; font-size: 14px; color: var(--ink-strong); margin-top: 14px; line-height: 1.2; max-width: 14ch; margin-left: auto; margin-right: auto; }
  .tl-prod--ga .tl-prod__label { color: var(--gold-deep); }
  .tl-prod__date { display: block; font-family: var(--font); font-weight: 700; font-size: 11px; color: var(--navy-muted); margin-top: 4px; }

  .tl-months { max-width: 920px; display: flex; justify-content: space-between; margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--rule-light); }
  .tl-month { font-family: var(--font); font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--navy-muted); }

  @media print { @page { size: landscape; margin: 0.5in; } body { padding: 0; } }
  @media (max-width: 760px) { .tl-timeline { height: auto; } .tl-line, .tl-span, .tl-prod { position: static; transform: none; display: block; margin: 12px 0; width: auto; } }
</style>
</head>
<body>
  <p class="tl-kicker">New LUCI</p>
  <h1 class="tl-title">Launch Timeline</h1>

  <div class="tl-timeline">
    <div class="tl-line"></div>

    <div class="tl-span" style="left:16%; width:24%">Stabilization</div>
    <div class="tl-span" style="left:82%; width:13%">Rollout</div>
    <div class="tl-span" style="left:90%; width:10%">Post-release</div>

    <div class="tl-prod" style="left:16%">
      <span class="tl-prod__dot"></span>
      <span class="tl-prod__label">Beta</span>
      <span class="tl-prod__date">Sep 30</span>
    </div>
    <div class="tl-prod" style="left:40%">
      <span class="tl-prod__dot"></span>
      <span class="tl-prod__label">Release candidate</span>
      <span class="tl-prod__date">Nov 13</span>
    </div>
    <div class="tl-prod tl-prod--ga" style="left:82%">
      <span class="tl-prod__dot"></span>
      <span class="tl-prod__label">General availability</span>
      <span class="tl-prod__date">Jan 29</span>
    </div>
  </div>

  <div class="tl-months">
    <span class="tl-month">September</span>
    <span class="tl-month">October</span>
    <span class="tl-month">November</span>
    <span class="tl-month">December</span>
    <span class="tl-month">January</span>
    <span class="tl-month">February</span>
  </div>
</body>
</html>
