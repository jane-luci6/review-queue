<!-- ============================================================
     LUCI social landing page  ·  HEAD CODE
     Paste into: Webflow > Page Settings > Inside <head> tag
     (or Site Settings > Custom Code > Head if reused site-wide)
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  /* brand palette — sampled from the LUCI sales brochure */
  --navy:#10232D;
  --navy-2:#17323F;
  --navy-3:#1E3E4D;
  --slate:#2C4956;          /* the lighter band used between dark sections */
  --mint:#68E3BE;
  --mint-deep:#1A7A64;
  --gold:#EDD086;
  --gold-deep:#B08838;
  --cream:#F3F7F8;
  --white:#FFFFFF;
  --muted-dark:#96A5AC;
  --muted-mid:#B4C3C9;
  --rule-dark:#344C57;
  --rule-mid:#3E5D6B;

  --font-body:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

  --max:1140px;
  --gutter:28px;
  --radius:14px;
  --radius-sm:10px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--navy);color:var(--white);
  font-family:var(--font-body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;}
.container{max-width:var(--max);margin:0 auto;padding:0 var(--gutter);}
.center{text-align:center;}
.center .lede{margin-left:auto;margin-right:auto;}

/* ---------- shared type ---------- */
.eyebrow{
  font-size:11.5px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--mint);margin:0 0 16px;
}
.eyebrow--gold{color:var(--gold);}
.h1{
  font-size:clamp(34px,5.6vw,60px);font-weight:700;line-height:1.08;
  letter-spacing:-1px;text-transform:uppercase;margin:0 0 20px;
}
.h2{
  font-size:clamp(25px,3.4vw,36px);font-weight:700;line-height:1.24;
  letter-spacing:-.5px;margin:0 0 18px;
}
.h3{font-size:19px;font-weight:700;line-height:1.3;margin:0 0 8px;letter-spacing:-.2px;}
.lede{font-size:clamp(16px,1.8vw,19px);line-height:1.62;color:var(--muted-dark);
  margin:0 0 32px;max-width:58ch;}
.mint-word{color:var(--mint);}
.gold-word{color:var(--gold);}
.underline-mint{border-bottom:3px solid var(--mint);padding-bottom:2px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--font-body);font-size:15px;font-weight:700;letter-spacing:.2px;
  padding:15px 27px;border-radius:40px;border:2px solid transparent;
  text-decoration:none;cursor:pointer;transition:.16s ease;
}
.btn--primary{background:var(--mint);color:var(--navy);border-color:var(--mint);}
.btn--primary:hover{background:#7FEBCB;border-color:#7FEBCB;}
.btn--outline{background:transparent;color:var(--white);border-color:var(--rule-mid);}
.btn--outline:hover{border-color:var(--mint);color:var(--mint);}
.btn--block{width:100%;justify-content:center;}
.btn--sm{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;padding:12px 20px;}

/* ---------- nav ---------- */
.nav{background:var(--navy);border-bottom:1px solid var(--rule-dark);
  position:sticky;top:0;z-index:50;}
.nav__inner{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:16px var(--gutter);max-width:var(--max);margin:0 auto;}
.nav__logo{width:118px;}

/* ---------- hero ---------- */
.hero{background:var(--navy);position:relative;overflow:hidden;
  padding:clamp(52px,7vw,88px) 0 clamp(56px,7vw,90px);}
.hero__texture{position:absolute;inset:0;background-image:url('images/texture-isometric.png');
  background-repeat:repeat;background-size:600px auto;opacity:.10;pointer-events:none;}
.hero__inner{position:relative;display:grid;grid-template-columns:.82fr 1.18fr;
  gap:48px;align-items:center;}
.hero__sub{font-size:15px;color:var(--muted-mid);margin:0;max-width:30ch;}
.hero__sub b{color:var(--white);font-weight:600;}
.hero__visual{border-radius:var(--radius);overflow:hidden;border:1px solid var(--rule-dark);
  box-shadow:0 18px 60px rgba(0,0,0,.45);}
.hero__cap{font-size:12.5px;color:var(--muted-dark);margin:14px 0 0;}

/* ---------- silos ---------- */
.silos{background:var(--slate);padding:clamp(52px,7vw,84px) 0;text-align:center;}
.silos__label{font-size:16px;font-weight:600;color:var(--white);margin:0 0 30px;}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:34px;}
.chip{font-size:12.5px;font-weight:600;color:var(--muted-mid);
  border:1px solid var(--rule-mid);border-radius:30px;padding:8px 15px;white-space:nowrap;}
.silos__arrow{color:var(--mint);font-size:26px;line-height:1;margin:0 0 22px;}
.silos__punch{font-size:clamp(24px,3.4vw,36px);font-weight:700;letter-spacing:-.5px;
  margin:0 0 12px;}
.silos__fine{font-size:13px;color:var(--muted-mid);margin:0;}

/* ---------- one interface / triad ---------- */
.interface{background:var(--navy-3);padding:clamp(56px,8vw,96px) 0;}
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:44px 0 40px;}
.tri{background:var(--navy);border:1px solid var(--rule-dark);border-radius:var(--radius);
  padding:28px 24px;position:relative;}
.tri__num{font-size:13px;font-weight:700;letter-spacing:1.8px;color:var(--mint);margin:0 0 14px;}
.tri__title{font-size:19px;font-weight:700;margin:0 0 9px;}
.tri__body{font-size:14.5px;line-height:1.58;color:var(--muted-dark);margin:0;}
.interface__actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}

/* ---------- consolidation ---------- */
.consol{background:var(--navy);padding:clamp(56px,8vw,96px) 0;}
.consol__inner{display:grid;grid-template-columns:.9fr 1.1fr;gap:52px;align-items:center;}
.compare{background:var(--navy-2);border:1px solid var(--rule-dark);
  border-radius:var(--radius);overflow:hidden;}
.compare__head{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;
  padding:16px 24px;border-bottom:1px solid var(--rule-dark);}
.compare__head span{font-size:10.5px;font-weight:700;letter-spacing:1.7px;
  text-transform:uppercase;color:var(--muted-dark);}
.compare__head span:last-child{color:var(--mint);text-align:right;}
.compare__row{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;
  padding:15px 24px;border-bottom:1px solid rgba(52,76,87,.5);}
.compare__row:last-child{border-bottom:0;}
.compare__was{font-size:21px;font-weight:700;color:var(--muted-mid);}
.compare__arrow{color:var(--rule-mid);font-size:15px;}
.compare__now{font-size:21px;font-weight:700;color:var(--mint);text-align:right;}
.compare__label{grid-column:1/-1;font-size:12px;color:var(--muted-dark);margin-top:-4px;}
.todo{color:var(--gold);font-weight:600;}

/* ---------- capability cards ---------- */
.caps{background:var(--navy-3);padding:clamp(56px,8vw,96px) 0;position:relative;overflow:hidden;}
.caps__texture{position:absolute;inset:0;background-image:url('images/texture-isometric.png');
  background-repeat:repeat;background-size:600px auto;opacity:.07;pointer-events:none;}
.caps__inner{position:relative;}
.caps__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:40px;}
.cap{background:linear-gradient(150deg,#1B3E4A 0%,#15303B 100%);
  border:1px solid var(--rule-dark);border-radius:var(--radius);
  padding:26px 26px 22px;position:relative;overflow:hidden;min-height:150px;
  display:flex;flex-direction:column;justify-content:space-between;}
.cap__title{font-size:18px;font-weight:700;line-height:1.28;margin:0;max-width:22ch;
  position:relative;z-index:1;}
.cap__num{position:absolute;right:18px;bottom:-14px;font-size:74px;font-weight:700;
  line-height:1;color:rgba(104,227,190,.14);letter-spacing:-3px;}
.cap__icon{margin-top:18px;position:relative;z-index:1;}

/* ---------- proof strip ---------- */
.proof{background:var(--cream);padding:40px 0;}
.proof__label{text-align:center;font-size:12px;font-weight:700;letter-spacing:1.9px;
  text-transform:uppercase;color:var(--muted-light,#68787F);margin:0 0 24px;}
.proof__logos{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
.proof__slot{background:var(--navy);color:var(--muted-mid);border-radius:var(--radius-sm);
  padding:20px 30px;font-size:13.5px;font-weight:600;letter-spacing:.4px;}

/* ---------- demo ---------- */
.demo{background:var(--navy);padding:clamp(56px,8vw,96px) 0;position:relative;overflow:hidden;}
.demo__texture{position:absolute;inset:0;background-image:url('images/texture-isometric.png');
  background-repeat:repeat;background-size:600px auto;opacity:.08;pointer-events:none;}
.demo__inner{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;}
.demo__list{list-style:none;padding:0;margin:26px 0 0;}
.demo__list li{position:relative;padding-left:30px;margin-bottom:14px;
  color:var(--muted-dark);font-size:15.5px;}
.demo__list li::before{content:'';position:absolute;left:0;top:7px;width:14px;height:14px;
  border-radius:50%;border:2px solid var(--mint);}
.form{background:var(--navy-2);border:1px solid var(--rule-dark);
  border-radius:var(--radius);padding:32px;}
.form__row{margin-bottom:18px;}
.form__row--split{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form__label{display:block;font-size:11.5px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--mint);margin-bottom:8px;}
.form__input,.form__select,.form__textarea{
  width:100%;background:var(--navy);border:1px solid var(--rule-dark);
  border-radius:var(--radius-sm);padding:14px 15px;color:var(--white);
  font-family:var(--font-body);font-size:15.5px;}
.form__input:focus,.form__select:focus,.form__textarea:focus{outline:none;border-color:var(--mint);}
.form__input::placeholder,.form__textarea::placeholder{color:#5E7078;}
.form__textarea{min-height:96px;resize:vertical;}
.form__fine{font-size:12.5px;color:#7C8D95;margin:16px 0 0;line-height:1.55;}
.form__success{display:none;text-align:center;padding:30px 10px;}
.form__success.is-visible{display:block;}
.form__success h3{color:var(--mint);font-size:21px;margin:0 0 10px;}
.form__success p{color:var(--muted-dark);margin:0;font-size:15px;}
.is-hidden{display:none !important;}

/* ---------- footer ---------- */
.footer{background:var(--navy);border-top:1px solid var(--rule-dark);padding:40px 0 0;}
.footer__tag{font-size:11.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--muted-dark);margin:0 0 26px;}
.footer__inner{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding-bottom:38px;}
.footer__label{font-size:11.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--white);margin:0 0 12px;}
.footer__inner p{margin:0 0 6px;font-size:14.5px;color:var(--muted-dark);}
.footer__inner a{color:var(--mint);text-decoration:none;}
.footer__inner a:hover{text-decoration:underline;}
.footer__bar{height:9px;background:var(--mint);}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .hero__inner,.consol__inner,.demo__inner{grid-template-columns:1fr;gap:34px;}
  .triad{grid-template-columns:1fr;}
}
@media (max-width:620px){
  body{font-size:16px;}
  .caps__grid,.footer__inner,.form__row--split{grid-template-columns:1fr;}
  .form{padding:24px;}
  .nav__logo{width:104px;}
  .compare__row,.compare__head{padding-left:18px;padding-right:18px;}
}
</style>
