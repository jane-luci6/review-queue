<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart for Jane's LinkedIn post (draft, 26 Oct 2026)</title>
<style>
  :root {
    --navy: #0A161C;
    --ink: #10232D;
    --sand: #E5E3DF;
    --paper: #F7F5F1;
    --kicker: #2b9e80;
    --line: #cfcbc4;
    --mint: #68E3BE;
    --ink-soft: #5c5852;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 18px/1.55 "Georgia", "Times New Roman", serif;
    color: var(--ink);
    background: var(--sand);
  }
  nav {
    position: sticky; top: 0; z-index: 2;
    background: var(--navy); color: #fff;
    padding: 14px 22px 16px;
    display: flex; flex-wrap: wrap; gap: 8px 18px;
    align-items: baseline;
  }
  nav strong {
    font: 700 12px/1 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--mint);
  }
  main { max-width: 52rem; margin: 0 auto; padding: 2.5rem 1.5rem 6rem; }
  .kicker {
    font: 700 12px/1 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--kicker); margin: 0 0 .6rem;
  }
  h1 {
    font: 700 1.7rem/1.2 "Helvetica Neue", Arial, sans-serif;
    color: var(--navy); margin: 0 0 .8rem;
    letter-spacing: -.01em;
  }
  .draft-tag {
    display: inline-block;
    font: 700 11px/1 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--kicker);
    background: #e8f6f1;
    border: 1px solid var(--kicker);
    padding: 5px 10px;
    border-radius: 9999px;
    margin: 0 0 2rem;
  }
  .chart {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 0 0 1.6rem;
    overflow: hidden;
  }
  .chart__body { padding: 18px 22px 22px; }
  .chart__svg {
    display: block;
    width: 100%;
    height: auto;
    max-width: 46rem;
    margin: 0 auto;
  }
  .download {
    display: inline-block;
    font: 700 14px/1 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .04em;
    color: #fff;
    background: var(--navy);
    border: 1px solid var(--navy);
    border-radius: 9999px;
    padding: 12px 22px;
    text-decoration: none;
    margin: 0 0 2rem;
  }
  .download:hover { background: var(--ink); }
  .footer {
    color: #6b6660;
    font-size: .85rem;
    font-family: "Helvetica Neue", Arial, sans-serif;
    margin-top: 2rem;
  }
</style>
</head>
<body>
<nav>
  <strong>Jane personal LinkedIn &middot; AI humor chart</strong>
</nav>
<main>
  <p class="kicker">Draft for Jane &middot; 26 Oct 2026</p>
  <h1>Chart for Jane&rsquo;s LinkedIn post (draft, 26 Oct 2026)</h1>
  <span class="draft-tag">Personal profile &middot; Draft, not posted</span>

  <section class="chart" id="chart" aria-label="Hand-drawn sketch chart: funniness stays flat across time spent prompting or refining the result.">
    <div class="chart__body">
      <svg class="chart__svg" viewBox="0 0 1200 627" role="img" aria-label="Hand-drawn sketch: a flat straight line for funniness across time spent prompting or refining the result, with axis labels Funniness and Time spent prompting or refining the result.">
        <!-- Paper-feel background -->
        <rect x="0" y="0" width="1200" height="627" fill="#F7F5F1" />

        <!-- Hand-drawn marker-style axes (wobbly, round caps) -->
        <g fill="none" stroke="#10232D" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Y axis -->
          <path d="M 132 552 Q 128 420 134 280 Q 129 160 138 76" />
          <!-- X axis -->
          <path d="M 132 552 Q 360 556 600 548 Q 840 554 1088 550" />
        </g>

        <!-- Axis labels (marker-style lettering) -->
        <text x="138" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#2b9e80" letter-spacing="0.06em">Funniness</text>
        <text x="1080" y="600" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#2b9e80" letter-spacing="0.02em" text-anchor="end">Time spent prompting or refining the result</text>

        <!-- ONE straight, flat line (no wobble; stays flat) -->
        <path d="M 220 300 L 1020 300" fill="none" stroke="#2b9e80" stroke-width="6" stroke-linecap="round" />
      </svg>
    </div>
  </section>

  <a class="download" href="assets/jane-ai-humor-chart.png" download="jane-ai-humor-chart.png">Download PNG</a>

  <p class="footer">Personal profile draft &mdash; nothing posted &middot; 26 Oct 2026.</p>
</main>
</body>
</html>
