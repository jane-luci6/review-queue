<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>What LUCI is — LUCI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 48px;
      background: #c8cdd0;
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      background: #f5f8fa;
      border: 1px solid #dbe1e4;
    }
    .meta {
      padding: 16px 24px;
      font-size: 13px;
      color: #56707c;
      border-bottom: 1px solid #dbe1e4;
    }
    .meta strong { color: #354f5c; }
    .variant-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin: 0 0 16px;
    }
    .stage--light { padding: 40px clamp(24px, 5vw, 64px) 48px; }
    .stage--light .variant-label { color: #2b9e80; }
    /* Hub-only display crop: canonical SVG is 900×460 but the art occupies ~600×300
       in the upper-left. Crop the empty canvas so the art fills the white stage.
       Canonical file is untouched — size is consumer-controlled per luci-canonical-assets. */
    .crop {
      width: 100%;
      aspect-ratio: 2 / 1;
      overflow: hidden;
    }
    .crop img { display: block; width: 145%; height: auto; }
    .stage--dark {
      background: #10232d;
      padding: 40px clamp(24px, 5vw, 64px) 48px;
      border-top: 1px solid rgba(104, 227, 190, 0.16);
    }
    .stage--dark .variant-label { color: #68E3BE; }
    .stage--dark img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="meta"><strong>What LUCI is</strong> — LUCI (the orchestration platform) + Systems (the embedded operation). Light variant for print, PDF, web, and sales collateral; dark variant drops straight onto navy sections. Updated Jul 6, 2026.</p>
    <section class="stage--light">
      <span class="variant-label">Light · canonical</span>
      <div class="crop">
        <img src="../../../assets/diagrams/luci-what-luci-is.svg?v=30" alt="What LUCI is: LUCI, the orchestration platform, plus Systems, the embedded operation." width="680" height="364">
      </div>
    </section>
    <section class="stage--dark">
      <span class="variant-label">Dark · for navy sections</span>
      <img src="diagrams/luci-what-luci-is.dark.svg?v=4" alt="LUCI + Systems identity diagram on a dark background — orchestration platform (A/V rack plus control software on any device) plus the embedded operation (team, processes, and standards)" width="560" height="300">
    </section>
  </div>
</body>
</html>
