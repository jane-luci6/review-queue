<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Consolidation ledger — LUCI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 48px;
      background: #c8cdd0;
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      background: #f5f8fa;
      border: 1px solid #dbe1e4;
    }
    .meta {
      padding: 16px 24px;
      font-size: 13px;
      color: #56707c;
      border-bottom: 1px solid #dbe1e4;
    }
    .meta strong { color: #354f5c; }
    .variant-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin: 0 0 16px;
    }
    .stage { padding: 40px clamp(24px, 5vw, 64px) 48px; text-align: center; }
    .stage .fig {
      display: block;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      height: auto;
    }
    .stage--light .variant-label { color: #2b9e80; }
    .stage--dark {
      background: #10232d;
      border-top: 1px solid rgba(104, 227, 190, 0.16);
    }
    .stage--dark .variant-label { color: #68E3BE; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="meta"><strong>Consolidation ledger</strong> — &ldquo;The Collapse&rdquo; redesign: software (4+ multimedia systems) and hardware (5+ racks, 15+ receivers, 100+ devices) funnel into one outcome: <strong>1</strong> interface, equipment rack. Network, service, and code rows below. Updated Jul 8, 2026.</p>
    <section class="stage stage--light">
      <span class="variant-label">On light</span>
      <img class="fig" src="../../../assets/diagrams/luci-consolidation-ledger.svg?v=13" alt="Consolidation ledger: today four or more multimedia systems, five or more equipment racks, fifteen or more receivers, and one hundred plus hardware devices, forty gig AV-over-IP links, thousands per change, and locked code. With LUCI: one interface, one equipment rack, one gig consolidated network, changes included in service, and code that is yours." width="720" height="680">
    </section>
    <section class="stage stage--dark">
      <span class="variant-label">On navy</span>
      <img class="fig" src="../../../assets/diagrams/luci-consolidation-ledger.svg?v=13" alt="Consolidation ledger on a navy background — unified funnel plus network, service, and code rows." width="720" height="680">
    </section>
  </div>
</body>
</html>
