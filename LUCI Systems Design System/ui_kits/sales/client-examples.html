<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LUCI — Client Examples</title>
  <!-- Static brand fonts (Inter + Space Grotesk + Syncopate) — self-contained, PDF-safe. No Google Fonts <link>. -->
  <link rel="stylesheet" href="../../assets/fonts/luci-brand-fonts.css">
  <link rel="stylesheet" href="sales-document.css?v=3">
  <style>
    /* LUCI Client Examples — single-page logo sheet (PDF-first, US Letter, Track C).
       Header: the LUCI E-mesh (mint lines + nodes) over a navy->off-white
       gradient that bleeds down into the content — no boxy band, no hard
       mint bar. The 16 client logos are pre-rendered monochrome so the only
       color on the page is LUCI's. Follows luci-sales-document-system.mdc +
       luci-dual-accent-system.mdc. */
    .doc-page--clients { padding: 0; background: var(--off-white); }

    /* ── Mesh hero ─────────────────────────────────────────────────────── */
    /* The LUCI E-mesh (mint lines + nodes) over a navy->off-white gradient
       that bleeds down into the content. No boxy band, no hard mint bar.
       The 16 client logos are pre-rendered monochrome so the only color on
       the page is LUCI's. Follows luci-sales-document-system.mdc +
       luci-dual-accent-system.mdc. */
    .cx-hero {
      position: relative;
      flex: 0 0 2.95in;              /* pin main size — .doc-page is flex column, so `height` alone won't hold */
      padding: 0.55in 0.6in 0;
      background: linear-gradient(to bottom,
        #0A161C 0%, #0A161C 56%, #10232D 74%, #F5F8FA 100%);
    }
    /* Transparent E-mesh over the hero, fading out in the bleed zone so no
       mint lines ever sit on the light canvas (contrast-safe). */
    .cx-hero::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url('assets/textures/luci-e-mesh-header-transparent.svg');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center top;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 46%, transparent 70%);
              mask-image: linear-gradient(to bottom, #000 0%, #000 46%, transparent 70%);
      opacity: 1;
      pointer-events: none;
      z-index: 0;
    }
    .cx-hero > * { position: relative; z-index: 1; }
    .cx-hero__kicker {
      margin: 0 0 14px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--mint);
    }
    .cx-hero__title {
      margin: 0 0 14px;
      font-size: 30px; font-weight: 700; line-height: 1.12;
      letter-spacing: -0.025em;
      color: rgba(245, 248, 250, 0.96);
      max-width: 30ch;
    }
    .cx-hero__title .cx-hero__accent { color: var(--mint); }
    .cx-hero__dek {
      margin: 0; max-width: 56ch;
      font-family: var(--font-recede);
      font-size: 15.5px; line-height: 1.55;
      color: rgba(235, 245, 248, 0.78);
    }

    /* ── Logo grid (continues out of the gradient on off-white) ────────── */
    .cx-body { padding: 0 0.6in 0.55in; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
    .cx-grid {
      flex: 1 1 0; min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 1fr;
      gap: 0;
    }
    .cx-cell {
      display: flex; align-items: center; justify-content: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--rule-light);
    }
    .cx-grid .cx-cell:nth-child(n+13) { border-bottom: 0; }
    .cx-cell img {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      object-fit: contain; display: block;
    }
    .doc-page--clients .doc-foot { flex: 0 0 auto; padding: 16px 0 0; }

    @media print {
      .doc-page--clients, .cx-hero, .cx-hero::before, .cx-cell {
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <p class="doc-hub-link"><a href="../../index.html">&larr; Design Hub</a> &middot; Print or Save as PDF (US Letter)</p>
  <article class="doc">
    <section class="doc-page doc-page--clients">
      <header class="cx-hero">
        <p class="cx-hero__kicker">Selected clients</p>
        <h1 class="cx-hero__title">Where LUCI <span class="cx-hero__accent">has worked</span></h1>
        <p class="cx-hero__dek">A sample of properties LUCI has worked with across the U.S.</p>
      </header>

      <div class="cx-body">
        <div class="cx-grid" aria-label="Client logos">
          <div class="cx-cell"><img src="assets/clients-mono/yaamava.png" alt="Yaamava' Resort &amp; Casino at San Manuel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/cache-creek.png" alt="Cache Creek Casino Resort"></div>
          <div class="cx-cell"><img src="assets/clients-mono/northern-quest.png" alt="Northern Quest Resort &amp; Casino"></div>
          <div class="cx-cell"><img src="assets/clients-mono/horseshoe.png" alt="Horseshoe"></div>
          <div class="cx-cell"><img src="assets/clients-mono/santa-ana-star.png" alt="Santa Ana Star Casino Hotel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/belterra-park.png" alt="Belterra Park Cincinnati"></div>
          <div class="cx-cell"><img src="assets/clients-mono/choctaw.png" alt="Choctaw Casinos &amp; Resorts"></div>
          <div class="cx-cell"><img src="assets/clients-mono/osage.png" alt="Osage Casino Hotel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/valley-view.png" alt="Valley View Casino &amp; Hotel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/spotlight-29.png" alt="Spotlight 29 Casino"></div>
          <div class="cx-cell"><img src="assets/clients-mono/ameristar.png" alt="Ameristar Casino Hotel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/turtle-creek.png" alt="Turtle Creek Casino &amp; Hotel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/caesars-sportsbook.png" alt="Caesars Sportsbook"></div>
          <div class="cx-cell"><img src="assets/clients-mono/isleta.png" alt="Isleta Resort &amp; Casino"></div>
          <div class="cx-cell"><img src="assets/clients-mono/stanly-ranch.png" alt="Stanly Ranch, Auberge Resorts Collection, Napa Valley"></div>
          <div class="cx-cell"><img src="assets/clients-mono/spirit-mountain.png" alt="Spirit Mountain Casino"></div>
        </div>

        <div class="doc-foot">
          <span>LUCI Systems, Inc. &middot; Las Vegas, NV</span>
          <span>lucisystems.com &middot; (833) 333-5868</span>
        </div>
      </div>
    </section>
  </article>
</body>
</html>
