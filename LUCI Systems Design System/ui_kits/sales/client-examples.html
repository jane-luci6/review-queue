<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LUCI — Client Examples</title>
  <!-- Static brand fonts (Inter + Space Grotesk + Syncopate) — self-contained, PDF-safe. No Google Fonts <link>. -->
  <link rel="stylesheet" href="../../assets/fonts/luci-brand-fonts.css">
  <link rel="stylesheet" href="sales-document.css?v=3">
<style>
  /* LUCI Client Examples — single-page logo sheet (PDF-first, US Letter, Track C).
     Full LUCI branding (navy masthead + mint accent + circuit texture); the 16
     client logos are pre-rendered monochrome so the only color on the page is
     LUCI's. Follows luci-sales-document-system.mdc + luci-dual-accent-system.mdc. */
  .doc-page--clients { padding: 0; }
  .doc-page--clients .doc-page-band {
    margin: 0 0 0.4in;
    padding: 0.42in 0.6in 0.4in;
  }
  .doc-page-band__top { margin-bottom: 14px; }
  .doc-page--clients .doc-page-band__title { font-size: 26px; max-width: 30ch; }
  .doc-page--clients .doc-page-band__deck { max-width: 56ch; }

  .cx-body { padding: 0 0.6in 0.55in; flex: 1 1 auto; display: flex; flex-direction: column; }
  .cx-grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: 0;
  }
  .cx-cell {
    display: flex; align-items: center; justify-content: center;
    padding: 14px 18px;
    background: #ffffff;
    border-bottom: 1px solid var(--rule-light);
  }
  .cx-grid .cx-cell:nth-child(n+13) { border-bottom: 0; }
  .cx-cell img {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain; display: block;
  }
  .doc-page--clients .doc-foot { padding: 16px 0 0; }

  @media print {
    .doc-page--clients, .doc-page-band, .cx-cell { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <p class="doc-hub-link"><a href="../../index.html">&larr; Design Hub</a> &middot; Print or Save as PDF (US Letter)</p>
  <article class="doc">
    <section class="doc-page doc-page--clients">
      <div class="doc-page-band">
        <div class="doc-page-band__top">
          <p class="doc-page-band__kicker">Selected clients</p>
        </div>
        <h1 class="doc-page-band__title">Where LUCI <span class="doc-page-band__accent">has worked</span></h1>
        <p class="doc-page-band__deck">A sample of properties LUCI has worked with across the U.S.</p>
      </div>

      <div class="cx-body">
        <div class="cx-grid" aria-label="Client logos">
          <div class="cx-cell"><img src="assets/clients-mono/yaamava.png" alt="Yaamava' Resort &amp; Casino at San Manuel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/cache-creek.png" alt="Cache Creek Casino Resort"></div>
          <div class="cx-cell"><img src="assets/clients-mono/northern-quest.png" alt="Northern Quest Resort &amp; Casino"></div>
          <div class="cx-cell"><img src="assets/clients-mono/horseshoe.png" alt="Horseshoe"></div>
          <div class="cx-cell"><img src="assets/clients-mono/santa-ana-star.png" alt="Santa Ana Star Casino Hotel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/belterra-park.png" alt="Belterra Park Cincinnati"></div>
          <div class="cx-cell"><img src="assets/clients-mono/choctaw.png" alt="Choctaw Casinos &amp; Resorts"></div>
          <div class="cx-cell"><img src="assets/clients-mono/osage.png" alt="Osage Casino Hotel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/valley-view.png" alt="Valley View Casino &amp; Hotel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/spotlight-29.png" alt="Spotlight 29 Casino"></div>
          <div class="cx-cell"><img src="assets/clients-mono/ameristar.png" alt="Ameristar Casino Hotel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/turtle-creek.png" alt="Turtle Creek Casino &amp; Hotel"></div>
          <div class="cx-cell"><img src="assets/clients-mono/caesars-sportsbook.png" alt="Caesars Sportsbook"></div>
          <div class="cx-cell"><img src="assets/clients-mono/isleta.png" alt="Isleta Resort &amp; Casino"></div>
          <div class="cx-cell"><img src="assets/clients-mono/stanly-ranch.png" alt="Stanly Ranch, Auberge Resorts Collection, Napa Valley"></div>
          <div class="cx-cell"><img src="assets/clients-mono/spirit-mountain.png" alt="Spirit Mountain Casino"></div>
        </div>

        <div class="doc-foot">
          <span>LUCI Systems, Inc. &middot; Las Vegas, NV</span>
          <span>lucisystems.com &middot; (833) 333-5868</span>
        </div>
      </div>
    </section>
  </article>
</body>
</html>
