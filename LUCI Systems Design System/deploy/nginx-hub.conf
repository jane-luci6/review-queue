# nginx server block for the LUCI Marketing Content Hub (internal portal).
# Serves the built ui_kits/review output from /var/www/luci-hub on port 8080.
# Replicates vercel.json rewrites so legacy review entry points resolve to the portal.
# /var/www/luci-hub is owned by the luci user so deploys need no sudo.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/luci-hub;
    index index.html;

    # Legacy review entry points -> portal (mirrors vercel.json rewrites).
    # "/" is already handled by the build's root index.html redirect.
    location = /stakeholder-review.html               { rewrite ^ /internal-portal/index.html last; }
    location = /stakeholder-review-webflow-embed.html { rewrite ^ /internal-portal/index.html last; }
    location = /review-board.html                     { rewrite ^ /internal-portal/index.html last; }
    location = /review-portal.html                    { rewrite ^ /internal-portal/index.html last; }
    location = /resources-hub-home-prototype.html     { rewrite ^ /internal-portal/index.html last; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Static asset caching (short, since this is a review server).
    # JSON excluded so review-queue.json / manifests are always fresh after a deploy.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map|pdf|docx)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public";
    }

    # Manifests / queue are content — never cache.
    location ~* \.json$ {
        add_header Cache-Control "no-store" always;
    }

    add_header X-Content-Type-Options nosniff always;
    server_tokens off;
}
