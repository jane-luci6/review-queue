# nginx server block for the Internal Marketing Portal on .17 (host rsync deploy).
# Serves the built ui_kits/review output from /var/www/internal-marketing-portal on port 8081.
# One-time on .17 (with Will):
#   sudo cp deploy/nginx-internal-portal-17.conf /etc/nginx/sites-available/internal-marketing-portal
#   sudo ln -sf /etc/nginx/sites-available/internal-marketing-portal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /var/www/internal-marketing-portal;
    index index.html;

    location = /stakeholder-review.html               { rewrite ^ /internal-portal/index.html last; }
    location = /stakeholder-review-webflow-embed.html { rewrite ^ /internal-portal/index.html last; }
    location = /review-board.html                     { rewrite ^ /internal-portal/index.html last; }
    location = /review-portal.html                    { rewrite ^ /internal-portal/index.html last; }
    location = /resources-hub-home-prototype.html     { rewrite ^ /internal-portal/index.html last; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map|pdf|docx)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~* \.json$ {
        add_header Cache-Control "no-store" always;
    }

    add_header X-Content-Type-Options nosniff always;
    server_tokens off;
}
